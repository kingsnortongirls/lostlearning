<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 9 Unit 3: Python Next Steps | Lost Learning</title><meta name="description" content="Five Year 9 Python catch-up lessons covering loops, lists and functions."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year9.html">← Year 9 Lost Learning</a><a href="./">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Year 9 Computer Science</footer><script>window.LOST_UNIT={"year":9,"num":3,"title":"Python Next Steps","icon":"file-code","intro":"Move beyond beginner Python using data types, loops, lists, functions and returned values.","revision":"https://kingsnortongirls.github.io/revision/y9u3.html","support":[["Python online editor","https://www.programiz.com/python-programming/online-compiler/"]],"lessons":[{"title":"Data Types, Casting and If Statements","objective":"Read existing Python code, convert data types and write programs that use selection.","learn":[["Strings, integers and floats","A **string** stores text such as `\"12\"`; an **integer** stores a whole number such as `12`; a **float** stores a number with a fractional part such as `12.5`."],["Casting converts data types","`int(\"12\")` returns the integer 12. `float(\"2.5\")` returns a float. `str(12)` returns the string '12'. Python's `input()` function returns text, so calculations often require a conversion."],["Comparisons","Use `==` for equal, `!=` for not equal, `>` and `\u003c` for greater and less, and `>=` and `\u003c=` to include equal. A single `=` assigns a value."],["Selection and indentation","An `if` statement checks a condition. An indented block runs if it is true; `else` provides the other path. `elif` allows further conditions in order."]],"example":["Test an age","age = int(input('Enter age: '))\nif age >= 13:\n    print('Teenager or older')\nelse:\n    print('Under 13')\nThe conversion is important because the input is originally a string."],"tasks":[["Explain why `\"4\" + \"5\"` gives a different answer from `4 + 5`, and how to make a numeric calculation from input.","String addition concatenates text; int() converts digit strings to whole numbers."],["Write a Python program that asks for **two prices**, converts them to float and prints their total.","Use `float(input(...))` twice and add the two results."],["Write and test an **if/elif/else** program that displays different messages for marks below 40, 40–69 and 70 or above.","Check `mark \u003c 40`, then `mark \u003c 70`, then `else`, using indentation."]],"challenge":"Explain how a password-guessing program could count failed guesses using a variable and a loop without revealing any real passwords.","quiz":[["What type is returned by input()?",["String","Integer automatically","Float automatically"],0,"Input returns text."],["Which function converts '7' to an integer?",["int()","str()","print()"],0,"int() converts suitable digit strings."],["Which operator checks equality?",["==","=","!="],0,"== compares values."],["What is necessary after an if condition in Python?",["A colon and indented block","A full stop","An HTML tag"],0,"Python blocks depend on a colon and indentation."]]},{"title":"While and For Loops","objective":"Use while and for loops and justify which is best for a task.","learn":[["Loops repeat instructions","A loop lets one block of code run many times. **Iteration** saves writing repeated lines and helps handle changing inputs."],["While loop","`while count \u003c 5:` checks a condition before every repetition. The counter or other relevant state must change or the loop may never terminate."],["For loop","`for i in range(5):` repeats five times, giving i values 0 through 4. `range(5,10)` gives 5, 6, 7, 8 and 9."],["Choose wisely","A `for` loop is usually clear when the repetition count is known. A `while` loop is useful when repeating until a condition changes, such as until a valid input is entered."]],"example":["Compare two loops","count = 0\nwhile count \u003c 3:\n    print(count)\n    count += 1\n\nfor number in range(3):\n    print(number)\nBoth print 0, 1 and 2, but the for loop manages the count automatically."],"tasks":[["Write and explain a **while loop** that prints the numbers 1 to 5. Identify the condition and counter update.","Start at `count=1`, use `while count \u003c= 5:` and increase count each time."],["Write a **for loop** that prints the numbers 5 to 9. Explain the two arguments to range().","Use `for number in range(5,10):` and print the variable."],["Create a **pocket-money program** using a for loop to calculate total weekly savings after 12 weeks.","Ask for weekly savings and multiply as the loop tracks cumulative total, or add to a running total."]],"challenge":"Describe a guessing game that uses while to repeat until a correct **fictional number**, rather than a password, is entered.","quiz":[["What does `range(4)` produce?",["0,1,2,3","1,2,3,4","0,1,2,3,4"],0,"The stop value is excluded."],["When is a for loop often useful?",["When you know the number of repeats","Only when typing passwords","Only for graphics"],0,"For loops often handle count-based iteration."],["What can cause an accidental infinite while loop?",["Never changing the condition","Printing a string","Using a comment"],0,"An unchanged true condition can loop forever."],["What does `count += 1` do?",["Increase count by one","Reset to one","Multiply count by ten"],0,"It increments the variable."]]},{"title":"Lists, Indices and Appending","objective":"Store several values in one list, use indices and loops, and modify list contents.","learn":[["Lists keep related values together","A list stores an ordered collection such as `scores = [125, 80, 94]`. This is more manageable than making many separately named variables."],["Indices start at zero","`scores[0]` is the first item; `scores[1]` is the second. Trying to access an index beyond the list length raises an error."],["Change and append","`scores[0] = 127` replaces the first value. `scores.append(150)` adds a new value at the end, creating a new index."],["Loop through a list","`for score in scores:` processes every item. A loop is often preferable to many lines of repeated print commands."],["Debugging","An **IndexError** can happen if you ask for an item that does not exist. Check `len(scores)` and remember that the last valid index is the length minus one."]],"example":["Manage a superhero list","heroes = ['Storm', 'Hulk', 'Thor']\nprint(heroes[0])     # Storm\nheroes[1] = 'Wasp'\nheroes.append('Shuri')\nfor hero in heroes:\n    print(hero)\nThe list now has four items."],"tasks":[["Make a list of **four fictional high scores**. Print the first and last values, and explain their indices.","For four values, the first index is 0 and the last is 3."],["Update the second score, append a fifth score and print the entire list.","Use `scores[1] = ...`, then `scores.append(...)`."],["Write a for loop that prints every value in a list of **five superhero names**, and explain why a loop is more efficient than five print lines.","Use `for hero in heroes:` and an indented print call."]],"challenge":"Explain why asking for `scores[5]` would fail when a list contains exactly five values. Show a safe way to check its length.","quiz":[["What is the index of the first list item?",["0","1","-1 only"],0,"Python list indexing starts at zero."],["Which command adds to the end of a list?",["append()","input()","replaceAll()"],0,"append adds an item."],["Which code changes the first item?",["scores[0] = 10","scores[1] = 10","scores.append(10)"],0,"Index 0 is the first item."],["What does `len(scores)` return?",["Number of items","Highest score","First item"],0,"len reports a collection's length."]]},{"title":"Defining and Calling Functions with Parameters","objective":"Define reusable Python functions and explain how parameters make them flexible.","learn":[["A function is a named block","In Python, a function is defined with `def` and a colon. Its indented body is executed when the function is **called**. The definition itself does not run all its instructions immediately."],["Why functions help","A function can replace duplicated code. If a repeated logo or set of instructions has a mistake, changing one function definition fixes all future calls."],["Parameters","Parameters let a function accept input values. For example `def greet(name):` can be called with `greet('Sam')` or `greet('Alex')` to produce different greetings."],["Procedures and results","A function that only performs actions can be used like a procedure. A function may also return a value; that is the focus of the next lesson."]],"example":["Reusable programme title","def show_title(programme):\n    print('BBC')\n    print(programme)\n\nshow_title('News')\nshow_title('Sport')\nThe title formatting exists once but the programme name changes."],"tasks":[["Explain the difference between **defining** and **calling** a function. Show a minimal example.","`def hello():` defines; `hello()` calls. Indent the function body."],["Create a function `display_logo()` that prints a three-line **fictional club logo**, and call it three times.","Write the lines in one function rather than copying them three times."],["Modify the function to accept a **club name parameter** and test it with two different names.","Write `def display_logo(name):` then pass a string in each call."]],"challenge":"Explain how functions make a large program easier to maintain, using the example of correcting a typo in a repeated logo.","quiz":[["Which keyword defines a Python function?",["def","loop","goto"],0,"Functions use def."],["How do you run a function `hello`?",["hello()","def only","print def"],0,"Calling the function executes its body."],["What is a parameter?",["A named input to a function","A syntax error","Only the screen size"],0,"Parameters let functions accept values."],["Why avoid copying a logo routine many times?",["A function is reusable and easier to fix","It increases storage automatically","It disables debugging"],0,"A single definition is easier to maintain."]]},{"title":"Functions That Return Values","objective":"Write functions that calculate and return answers to the main program.","learn":[["Return gives back a result","A function can use `return` to send a value back to the code that called it. For example, `result = calcDouble(8)` can store 16 if the function doubles its argument."],["Return versus print","`print()` displays something to the user; `return` gives data back to the calling code so it can be reused in another calculation or decision."],["Parameters and calculations","`def calcHalf(amount): return amount / 2` works with different amounts. `def calcTenMore(amount): return amount + 10` adds a fixed amount."],["Combine with selection","A calculator can ask which calculation to perform and use if/elif to call a suitable function. This separates decision-making from the individual calculations."],["Randomised programs","A program can generate a random number and pass it into a function that chooses a fictional playing-card suit. Test that the possible inputs produce the appropriate returned strings."]],"example":["A function that doubles","def calc_double(amount):\n    return amount * 2\n\nanswer = calc_double(12)\nprint(answer)\nThe function **returns** 24, and the main program prints the stored answer."],"tasks":[["Write `calc_half(amount)` and `calc_ten_more(amount)` using **return**. Predict both results when the input is 120.","120/2 = 60, and 120+10 = 130."],["Create a menu-driven **calculator** that calls different functions for addition, subtraction and multiplication.","Use one function per operation and `if / elif / else` to choose."],["Explain how a simple **card suit** program could pass a random integer from 1–4 to `choose_suit(number)` and return a suit name.","Map 1–4 to four suit strings. Do not need a graphic card game to demonstrate the idea."]],"challenge":"Compare a function which prints its result with one which returns it. Give an example where returning is more flexible.","quiz":[["Which keyword returns a value to the caller?",["return","print","while"],0,"Return gives a result back."],["What does `def twice(x): return x*2` produce for x=7?",["14","7","2"],0,"7×2=14."],["Why can returning be useful?",["The result can be used in later calculations","The result must be displayed immediately","It deletes the function"],0,"A returned value can be stored or combined."],["What is a function argument?",["A value supplied when calling the function","An image file","The code editor"],0,"Arguments supply values for parameters."]]}]};</script><script src="catchup.js"></script></body></html>
