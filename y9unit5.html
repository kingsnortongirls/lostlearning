<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 9 Unit 5: Artificial Intelligence | Lost Learning</title><meta name="description" content="Year 9 AI catch-up lessons covering learning, bias, generative AI, SIFT and ethics."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year9.html">← Year 9 Lost Learning</a><a href="./">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Year 9 Computer Science</footer><script>window.LOST_UNIT={"year":9,"num":5,"title":"Artificial Intelligence","icon":"sparkles","intro":"Understand AI and machine learning, investigate real-world applications, evaluate bias and use generative AI responsibly.","revision":"https://kingsnortongirls.github.io/revision/y9u5.html","support":[["Google Teachable Machine","https://teachablemachine.withgoogle.com/"]],"lessons":[{"title":"What Is Artificial Intelligence?","objective":"Define AI and explain how machine learning differs from rule-based traditional programming.","learn":[["What is AI?","**Artificial intelligence (AI)** refers to computer systems that perform tasks associated with capabilities such as recognising patterns, generating content, making predictions or choosing actions. AI is not limited to physical robots."],["Traditional rules versus learning","A **rule-based system** follows instructions written by people, for example a traffic light on a fixed timer. **Machine learning (ML)** learns patterns from examples rather than relying entirely on hand-written rules."],["AI may depend on the implementation","A calculator performing fixed arithmetic is not normally AI. A spam filter can use hand-coded rules, trained ML models or both. Voice assistants and recommendation systems frequently use ML."],["Do not assume AI is always right","A system can appear clever while still making mistakes. Its results depend on the task, data, design and testing."]],"example":["Sort familiar technologies","**Calculator:** generally rule-based, not AI.\n**Music recommendations:** commonly use ML, so usually AI.\n**Traffic lights:** fixed-timer systems are not AI, but a smart traffic controller using prediction may be.\n**Autocorrect:** depends on the particular implementation."],"tasks":[["Classify **calculator, Netflix recommendations, torch, spam filter, traffic lights, Siri, face unlock and autocorrect** as AI, not AI or 'depends'. Explain at least four choices.","Ask whether the system learns from data or simply follows fixed human-written rules. Some examples depend on the implementation."],["Explain the key difference between a **rule-based program** and a **machine-learning model**, giving a new example of each.","Compare explicitly coded rules with patterns learned from examples."],["Find one suitable use of AI in **sport, music or healthcare** and explain its input data and predicted output.","For example, an ML model might use past match statistics to predict an outcome."]],"challenge":"Explain why 'AI is the same thing as a robot' is misleading. Give an example of AI software with no physical robot.","quiz":[["What does AI stand for?",["Artificial intelligence","Automated internet","Applied information"],0,"AI stands for artificial intelligence."],["Which usually learns patterns from examples?",["Machine learning","A fixed timer","A light switch"],0,"ML is trained on data."],["Which is typically not AI?",["A basic calculator","A trained image classifier","A recommendation model"],0,"Fixed arithmetic follows established rules."],["Can a technology use both hand-written rules and ML?",["Yes","No, never","Only if it is a robot"],0,"Hybrid systems are common."]]},{"title":"How Machines Learn","objective":"Describe supervised learning and train or plan a two-class classifier while evaluating data quality.","learn":[["A model learns from examples","In **supervised machine learning**, a model is trained using **labelled examples**. The model learns statistical patterns that help it predict labels for new inputs."],["The ML pipeline","Collect and label appropriate data → train a model → test it using new examples → decide whether it is ready to use. Training examples and test examples should not all be identical."],["Quantity and variety matter","A model trained on only five identical examples per class may perform poorly when lighting, background or angle changes. A varied, balanced dataset helps the model learn generalisable features."],["Teachable Machine","Google Teachable Machine lets you experiment with image classification. Choose two **non-personal objects** such as a pencil and an eraser, record varied examples and compare predictions."],["Privacy and safe alternatives","Do not capture faces, names or identifying personal information. If webcam access is unavailable or unsuitable, plan a classifier on paper and predict where it might fail."]],"example":["Training a safe object classifier","Class A: a **pencil**. Class B: an **eraser**. Collect numerous examples of each at different angles, distances and lighting. Train, then test with a new pencil and eraser. Record correct and incorrect predictions and possible reasons."],"tasks":[["Explain **training data, label, model, input and output** with the pencil-versus-eraser example.","A labelled pencil image is training data; a new image is input; the model predicts pencil or eraser."],["Using **Teachable Machine**, or a written plan if no camera is available, design a two-class model with varied training examples. Record the number of examples in each class.","Choose objects, not people. Keep training data balanced and change angle, lighting and background."],["Create a **test and observation table** with at least four trials, the model's prediction, correct label and explanation of any mistakes.","Try a new viewing angle or different background, then identify reasons for errors."]],"challenge":"Explain what **overfitting** means and how a classifier trained on only one background might fail when tested somewhere else.","quiz":[["What does labelled data contain?",["Examples with known categories","Only file sizes","Only user passwords"],0,"Labels provide target classes."],["What happens during training?",["A model learns statistical patterns from examples","A human writes every prediction manually","The computer always becomes correct"],0,"Training adjusts a model using data."],["Why vary lighting and angles?",["To test and improve generalisation","To make all images identical","To remove all classes"],0,"Variety reduces dependence on one condition."],["What should a learner do with classmates' face images?",["Avoid collecting or uploading them for this activity","Upload without asking","Publish them openly"],0,"Use non-personal objects to protect privacy."]]},{"title":"AI in the Real World","objective":"Investigate real-world AI applications and evaluate their benefits and risks for different groups.","learn":[["AI across sectors","AI can help recognise patterns in medical data, suggest online content, detect fraud, support transport systems and personalise educational practice. The impact depends on the system and how it is used."],["Identify the input and output","For a medical prediction system, inputs might be clinical observations and the output a risk score. A content moderation model might take a video as input and flag it for review."],["Benefits and harms","Possible benefits include faster processing and earlier detection of risks. Potential harms include false positives, missed cases, discrimination, lack of transparency and over-reliance on automated decisions."],["High-stakes decisions need oversight","Decisions affecting a person's health, freedom or access to services need careful testing, appeal mechanisms, human oversight and accountability."],["Evaluate the evidence","Ask who benefits, who might be harmed, how mistakes are measured and whether claims are supported. Do not assume a hypothetical case study is a verified real deployment."]],"example":["Case study: an AI hospital warning (teaching scenario)","A fictional hospital develops a model that predicts when a patient might become seriously ill. **Benefit:** staff may intervene sooner. **Risk:** inaccurate predictions could lead to unnecessary treatment or missed illness. **Safeguard:** clinicians review the model output rather than treating it as a diagnosis."],"tasks":[["Choose **three sectors** from healthcare, transport, social media, finance, entertainment and education. Describe one AI use, its input and output in each.","For example: input past viewing history; output a recommendation list."],["Evaluate the fictional **hospital-warning case**. Give two benefits, two risks and two safeguards.","Consider early warning, false alerts, missed patients, professional review and monitoring."],["Write a short structured argument **for or against using AI to help make an important decision about a person**. Include evidence and an opposing view.","State your position, explain a benefit and a risk, and justify the importance of human oversight."]],"challenge":"Compare two AI uses that make predictions, one low-stakes and one high-stakes. Explain why the safeguards should differ.","quiz":[["Which is a possible AI input in healthcare?",["Clinical measurements","A prediction already displayed","A screen's colour"],0,"Models can analyse medical observations."],["What is a false positive?",["A warning when the condition is absent","A perfect prediction","An unused file"],0,"A false positive incorrectly indicates something is present."],["Who should be considered when evaluating an AI system?",["People helped and potentially harmed","Only the developers","Only its price"],0,"Evaluation needs multiple perspectives."],["What is important for high-stakes AI?",["Accountability and human oversight","No testing","Never checking errors"],0,"Oversight and testing reduce the risk of harm."]]},{"title":"Bias, Ethics and Fairness","objective":"Explain four sources of AI bias, six ethics principles and evaluate a fictional biased decision-making system.","learn":[["Where bias comes from","Four important sources are **biased training data**, **underrepresentation**, **proxy variables** and **feedback loops**. They can lead a model to produce unfair outcomes."],["What is a proxy variable?","A proxy is a feature that correlates with something sensitive even if the sensitive characteristic is not directly included. A postcode could correlate with socioeconomic circumstances or other protected factors."],["What is a feedback loop?","If a biased system makes decisions that affect the data collected later, training on those results can reinforce existing unfair patterns."],["Six principles for ethical AI","**Fairness, transparency, accountability, privacy, safety and inclusivity**. Evaluate whether people can understand, challenge and correct an AI-assisted decision."],["Who is responsible?","Responsibility can involve developers, the organisation deploying AI, regulators and wider society. A claim that 'the computer made the decision' does not remove human responsibility."]],"example":["Fictional courtroom scenario: ARIA","A fictional bank's AI called **ARIA** denies loans to applicants from certain postcodes at three times the rate of other postcodes, without human review. Investigators find a strong correlation between postcode and protected characteristics. The bank must examine data, rules, impact and appeal rights before trusting the system."],"tasks":[["Define the **four sources of AI bias** and give a possible example of each.","Historical data, missing groups, proxy features and feedback loops all need explanations."],["List the **six AI ethics principles**. Explain how three could be applied to the ARIA bank case.","Think about equal treatment, understandable reasons, and appeal to a human decision-maker."],["Write **two short courtroom arguments**: one for suspending ARIA until it is checked and one for improving it with safeguards. Give a reasoned verdict.","For suspension: unfair outcomes. For improvement: potential efficiency if independently audited and appeals are available."]],"challenge":"Explain why removing a sensitive characteristic from the training data does not automatically guarantee fairness.","quiz":[["Which is an example of underrepresentation?",["Very few examples from one group","Equal data coverage","Independent model testing"],0,"Missing groups can produce uneven performance."],["What is a proxy variable?",["A feature correlated with another characteristic","A perfect safety guarantee","A renamed folder"],0,"A proxy may indirectly encode other information."],["Which is an ethical AI principle?",["Accountability","Secrecy at all costs","No appeals"],0,"Accountability is one of the six principles."],["What is wrong with leaving every high-stakes decision unreviewed?",["People may be harmed with no meaningful challenge","It always saves memory","It ensures fairness"],0,"Human oversight and routes to challenge are important."]]},{"title":"Generative AI, Hallucinations and SIFT","objective":"Explain how language models generate text, recognise hallucinations and use SIFT to check information.","learn":[["What generative AI does","Generative AI produces new text, images, audio or video based on patterns learned from training. A **large language model (LLM)** generates text by predicting likely tokens based on the context and its training."],["Training is not fact-checking","Models learn language patterns and are later fine-tuned, sometimes using human feedback. Fluent answers do not guarantee that a claim is true or that a cited source exists."],["Hallucinations and deepfakes","An **AI hallucination** is a plausible-sounding but incorrect or unsupported output. A **deepfake** is manipulated or generated media designed to resemble genuine audio, video or images; it can be used to mislead."],["SIFT framework","**S**top before sharing; **I**nvestigate the source; **F**ind better coverage from trustworthy sources; **T**race claims, quotes and media to their original context."],["Academic integrity","AI can help explain a concept or suggest revision prompts, subject to school rules. Submitting AI-written work as your own, inventing evidence or using unverified quotations undermines learning and trust."]],"example":["Check a suspicious AI claim","An AI answer claims a major scientific event will happen next month but names no verifiable source. **Stop**; **investigate** the publisher; **find** independent scientific reporting; **trace** the claim to a primary source. If you cannot verify it, do not present it as fact."],"tasks":[["Describe, in four steps, how an **LLM produces a response**, and distinguish a plausible sentence from a verified fact.","Discuss training patterns, input context, token prediction and further model refinement."],["Define **hallucination** and **deepfake** and explain one harm each could cause in a school or wider society.","Do not create or share deceptive images of real pupils."],["Apply **SIFT** to a fictional social-media claim that an AI tool has 'proved exams are being cancelled'. Write what you would check at every step.","Look for the original school or exam-board notice, reliable reporting and the date/context."]],"challenge":"Write a short code of conduct explaining when AI use helps learning and when it becomes misleading or unacceptable.","quiz":[["What does an LLM predict while generating text?",["Likely next tokens","Guaranteed verified facts","Only database rows"],0,"Text generation predicts token sequences."],["What is an AI hallucination?",["An incorrect or unsupported generated claim","A graphics card","A safe backup"],0,"Fluent text can still be false."],["What does S in SIFT stand for?",["Stop","Save","Sort"],0,"Stop before accepting or sharing a claim."],["Which is responsible for schoolwork?",["Check claims and follow school rules","Invent sources","Submit generated work unchanged as your own"],0,"Integrity and verification matter."]]},{"title":"The Future of AI: Jobs, Regulation and an Ethical Pitch","objective":"Discuss changes to work, compare approaches to AI regulation and design a responsible AI product.","learn":[["Jobs will change in different ways","AI may automate routine parts of some jobs, change the tasks in existing jobs and create demand for new skills such as AI auditing and cybersecurity. Effects vary by sector and are uncertain."],["Why regulate AI?","Rules can help protect people from unsafe or unfair uses, particularly in high-stakes settings. The EU AI Act uses a **risk-based approach** with restrictions and obligations that depend on the system. Different countries can take different approaches."],["Arguments on both sides","Supporters of regulation highlight safety, transparency and rights. Critics worry about cost, complexity or slower innovation. A well-supported view weighs both sets of arguments."],["Design an ethical AI product","A responsible pitch should state **the problem, proposed AI feature, training data, who benefits, risks, safeguards and accountability**. Include how people can appeal, opt out or request human review where appropriate."],["You have a role","Critical thinking, informed questions and responsible technology use matter as AI changes. Do not assume predictions about jobs and regulation are guaranteed outcomes."]],"example":["A fictional accessible-learning helper","Problem: pupils struggle to revise. Proposal: a system that suggests revision topics from voluntarily shared quiz results. Data: only necessary learning data. Benefits: targeted practice. Risks: unfair recommendations or exposing personal details. Safeguards: privacy, human review, transparent recommendations and easy correction."],"tasks":[["Identify **two jobs likely to change**, one task that AI could support and one new type of role. Explain why the prediction is uncertain.","Think about routine tasks, human judgement and new technical responsibilities."],["Write **one argument for and one against AI regulation**, explaining the basic purpose of the EU AI Act's risk-based framework.","Consider protection, innovation, compliance costs and different levels of risk."],["Prepare a **Dragon's Den pitch for an ethical AI product**, covering problem, data, beneficiaries, risks, safeguards and who is accountable.","A detailed written pitch is suitable if you are catching up alone. Include a likely question from an Ethics Dragon and your answer."]],"challenge":"Write a 150–200 word personal reflection: How has learning about AI changed the way you assess technology? Refer to at least two lessons.","quiz":[["Why might jobs change with AI?",["Some tasks can be automated or augmented","All jobs disappear immediately","The internet will stop"],0,"AI changes tasks differently across industries."],["What is the EU AI Act broadly based on?",["Different risk levels and obligations","One rule for every program","Only the size of a computer"],0,"The framework categorises AI systems by risk."],["What belongs in an ethical AI pitch?",["Data, benefits, risks and safeguards","Only a logo","Only the product price"],0,"Ethical design addresses impact and controls."],["Why should high-stakes AI allow human oversight?",["People need accountability and ways to challenge errors","To remove all evidence","To avoid all testing"],0,"Human review can help protect people."]]}]};</script><script src="catchup.js"></script></body></html>
