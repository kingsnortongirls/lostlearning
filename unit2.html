<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 7 Unit 2 | Lost Learning</title><style>
:root{--navy:#10345a;--blue:#1469a8;--ink:#18283a;--line:#d6e2ec}*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:var(--ink);font:16px/1.6 system-ui,Arial,sans-serif}a{color:var(--blue)}header{background:var(--navy);color:white;padding:16px max(16px,calc((100vw - 1030px)/2))}header a{color:white;text-decoration:none;font-weight:800}main{max-width:1030px;margin:auto;padding:30px 18px 65px}.hero{background:linear-gradient(120deg,#10345a,#19669a);color:white;border-radius:19px;padding:30px}.hero h1{font-size:clamp(2rem,5vw,2.8rem);margin:5px 0}.hero p{max-width:740px}.label{font-size:.79rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.panel,.card{background:white;border:1px solid var(--line);border-radius:15px;padding:23px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{margin:0}.card h3{font-size:1.35rem}.muted{color:#52687b}.btn{display:inline-block;border:0;border-radius:9px;background:#1469a8;color:white;padding:11px 16px;cursor:pointer;text-decoration:none;font:700 1rem system-ui}.btn:hover{background:#0e4d7c}.secondary{background:#e4f1fa;color:#164e78}.hidden{display:none!important}.model{background:#eef8f4;border:1px solid #b7ddce;border-radius:10px;padding:15px;margin:15px 0}.help{background:#ecf5fc;border-left:4px solid #2584ba;padding:13px;margin:16px 0}.question{border:1px solid var(--line);border-radius:10px;padding:15px;margin:13px 0}.question legend{font-weight:800}.question label{display:block;padding:7px 3px}.result{padding:10px;margin-top:10px;border-radius:8px;background:#eef7fd}.good{background:#e3f6ea}.wrong{background:#fff1e9}.meta{display:flex;gap:25px}.print-sheet{display:none}input[type=text]{max-width:450px;width:100%;padding:11px;border:1px solid #aabac8;border-radius:8px;font:inherit}.pills{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}.pills a{background:#e7f2fc;padding:6px 12px;border-radius:8px;text-decoration:none;font-weight:700}.row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.line{border-bottom:1px solid #777;min-height:30px;margin:7px 0 10px}.print-task{break-inside:avoid;padding:6px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:17px}}@media print{@page{size:A4;margin:13mm}header,main{display:none!important}.print-sheet{display:block!important;font:11pt/1.35 Arial,sans-serif;color:black}.print-sheet h1{font-size:21pt;border-bottom:3px solid black;padding-bottom:6px}.print-sheet h2{font-size:14pt}.print-sheet .note{border:1px solid black;padding:7px;margin-top:16px}}

/* Consistent Year 7 lesson-selection layout */
.unit2-back{margin:0 0 17px}.unit2-back a{font-weight:750;text-decoration:none}
.unit2-hero{padding:30px 34px}
.unit2-hero h1{line-height:1.14}
.unit2-steps{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.unit2-steps span{background:#ffffff24;border:1px solid #ffffff45;border-radius:10px;padding:6px 12px;font-weight:750;font-size:.87rem}
.unit2-pick{margin:20px 0}
.unit2-pick h2{font-size:1.55rem;line-height:1.2;margin:0 0 11px}
.unit2-pick .muted{margin:0 0 20px}
.unit2-grid{align-items:stretch}
.unit2-tile{display:flex;flex-direction:column;align-items:flex-start;min-height:230px;margin:0;border-radius:13px;box-shadow:0 4px 15px #102b480a;transition:box-shadow .16s,transform .16s}
.unit2-tile:hover{transform:translateY(-3px);box-shadow:0 13px 28px #102b4820}
.unit2-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.unit2-pill{display:inline-block;border-radius:99px;background:#e7f2fc;color:#165b91;font-size:.78rem;font-weight:800;padding:5px 11px}
.unit2-duration{font-size:.77rem;color:#51677d;white-space:nowrap}
.unit2-tile h3{font-size:1.25rem;color:#10345a;margin:17px 0 9px;line-height:1.28}
.unit2-tile p{color:#52687b;flex:1;margin:0 0 24px}

</style></head><body><header><a href="./">← Lost Learning | Computer Science</a></header><main id="main"></main><section class="print-sheet" id="print"></section><script>
const lessons={
snow:{num:1,title:'Dr John Snow',time:'25–35 minutes',intro:'How evidence, data and pattern recognition helped Dr John Snow investigate cholera.',knowledge:[['The problem','In 1854, people in Soho, London, were dying from cholera. Dr John Snow wanted to find the source of the outbreak so that further deaths could be prevented.'],['Decomposition','Snow broke the problem into smaller questions: Who was affected? Where did they live? Where did they get their drinking water? What do people who are ill have in common?'],['Collecting data','He recorded where deaths occurred and where drinking-water pumps were located, then marked them on a street map.'],['Pattern identification','Snow compared the data and noticed many deaths concentrated near the Broad Street pump.'],['Hypothesis testing','Snow suspected contaminated pump water was spreading cholera. The Broad Street pump handle was removed to stop people using that source.'],['Key vocabulary','Algorithm: ordered steps to complete a task. Abstraction: leave out irrelevant details. Generalisation: apply a useful method to another problem. Collecting data: gather useful information.']],models:[['Snow’s investigation','Identify the problem → break it into questions → collect data on deaths and pumps → look for patterns → test the idea that the water was contaminated → act on the findings.'],['Model answer: pattern identification','Snow plotted cholera deaths and water pumps on a map. Many cases were close to the Broad Street water pump. This pattern supported his hypothesis that drinking contaminated water was linked to the outbreak.'],['Model answer: abstraction','The location of a home and its drinking-water source are useful evidence. The colour of its front door is unlikely to help explain how cholera spread, so it can be ignored.']],questions:[['What year was Snow’s Soho cholera investigation?',['1854','1948','2024'],0,'Snow investigated the 1854 outbreak.'],['What was the problem Snow was investigating?',['A cholera outbreak','A road closure','A missing computer'],0,'People were dying from cholera.'],['What is decomposition?',['Breaking a problem into smaller parts','Deleting all data','Guessing the answer'],0,'Decomposition separates a complex problem into smaller questions.'],['What did Snow mark on his map?',['Deaths and drinking-water pumps','Bus stops and shops','School subjects'],0,'These locations could be compared to spot patterns.'],['Which pump was linked to the outbreak?',['Broad Street','Oxford Street','Baker Street'],0,'The Broad Street pump was the focus of the pattern.'],['Which skill finds similarities in data?',['Pattern identification','Binary conversion','Formatting'],0,'Pattern identification is looking for similarities.'],['What is a hypothesis?',['An explanation that can be tested','A type of computer','An answer that never needs evidence'],0,'Snow tested whether contaminated water caused the illnesses.'],['What was removed from the Broad Street pump?',['Its handle','Its street sign','Its roof'],0,'Removing the handle stopped people using the water source.'],['What does abstraction mean?',['Focus on relevant information','Record every irrelevant detail','Avoid gathering evidence'],0,'Abstraction ignores details that do not help solve the problem.'],['Using the same method to investigate another outbreak is an example of what?',['Generalisation','Input','Storage'],0,'Generalisation means applying a method in a new situation.']],worksheet:['Explain the problem Dr Snow was trying to solve.','Name two types of information Snow collected.','Describe the pattern he found using his map.','Explain what Snow suspected and what action was taken.','Define decomposition and abstraction.','Challenge: How could Snow’s method be used to investigate a different illness?'],summary:'Snow investigated cholera in Soho in 1854. He compared locations of deaths with drinking-water pumps and identified a cluster near the Broad Street pump.'},
evacuation:{num:2,title:'Evacuation Planning',time:'25–35 minutes',intro:'Use computational thinking to plan and evaluate a clear evacuation algorithm.',knowledge:[['Why plan ahead?','Emergencies can happen unexpectedly, and people may find it difficult to think clearly. A prepared procedure helps people respond safely. In real emergencies, always follow staff instructions and the current approved plan.'],['Decompose the task','Break the problem into smaller questions: How many people must leave? Which rooms are involved? Where are the exits? Are there stairs? Where is the assembly point?'],['Collect useful data','Record the number of people, distance to exits, flights of stairs, doorway sizes, possible evacuation time and alternative routes.'],['Identify constraints','A narrow doorway may slow movement, creating a bottleneck. A blocked route needs an approved alternative.'],['Write an algorithm','Use clear, precise, complete instructions in the correct sequence. Include an approved main route and an alternative route.'],['Evaluate and generalise','Check whether instructions are clear, complete and accessible. Improve any weaknesses. The same planning method can be applied to a different building.']],models:[['Example: decompose','For a fictional classroom, ask: How many people are present? Which signed exit can be used? Where is the assembly area? Is the route accessible? What if the main route is blocked?'],['Example: clear steps','1. Listen to the teacher. 2. Stop work and leave belongings. 3. Follow staff directions along the approved exit route. 4. Go to the designated assembly point. 5. Remain with the group for registration.'],['Example: evaluation','A narrow doorway could slow the group down. I would check that the route is suitable for everyone and that a safe, approved alternative is available if the main route cannot be used.']],questions:[['Why prepare an evacuation plan in advance?',['People have clear steps to follow','It makes a classroom prettier','It replaces staff instructions'],0,'Planning helps people act safely and calmly.'],['What does decomposition mean?',['Break a task into smaller parts','Ignore the problem','Choose a random route'],0,'Each smaller question makes planning easier.'],['Which is useful data for an evacuation plan?',['Number of people and size of exits','Favourite subjects','Desk colours'],0,'Numbers and exit capacity affect movement.'],['What is a bottleneck?',['A narrow point that can slow people down','A spare classroom','A type of fire alarm'],0,'A bottleneck restricts the flow of people.'],['What should be included if a main route is blocked?',['An approved alternative route','An instruction to collect belongings','No alternative'],0,'A safe alternative is important.'],['What is an algorithm?',['A clear sequence of steps','An unordered set of guesses','A type of computer'],0,'Algorithms give instructions in order.'],['Which instruction is most precise?',['Follow the signed exit route under staff direction','Go somewhere','Leave by any route you like'],0,'Specific instructions reduce confusion.'],['What does abstraction do?',['Leaves out irrelevant details','Removes the important information','Makes plans longer'],0,'Focus on details needed to solve the problem.'],['How should you improve a completed plan?',['Check it for missing or unclear steps','Never check it','Delete every alternative'],0,'Evaluation helps identify weaknesses.'],['Adapting a planning method for another building is called what?',['Generalisation','Binary','Storage'],0,'Generalisation reuses a method in a new context.']],worksheet:['Explain why evacuation plans should be prepared in advance.','List four types of data needed when planning an evacuation.','Define bottleneck and give an example.','Write four clear, ordered instructions for a fictional evacuation under staff direction.','Explain why an alternative route matters.','Challenge: Describe two ways to evaluate and improve your fictional plan.'],summary:'A good evacuation plan breaks the problem down, gathers relevant data, identifies bottlenecks, uses precise instructions and includes a safe alternative. Always follow actual approved safety procedures.'}
};
let student='',active='';const root=document.getElementById('main');const printArea=document.getElementById('print');function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateUK(){return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date())}
function openLesson(key){active=key;render();scrollTo(0,0)}function render(){const k=location.hash.slice(1);if(k==='snow'||k==='evacuation')active=k;root.innerHTML=!active?home():!student?gate():lessonPage();if(active&&student)quiz();if(active&&!student)document.getElementById('name').focus();printArea.innerHTML=active&&student?printPage():''}function home(){
 return '<p class="unit2-back"><a href="./">← All Year 7 units</a></p>'
 +'<section class="hero unit2-hero"><div class="label">Year 7 · Unit 2</div><h1>Thinking Like a Computer Scientist</h1><p>Choose the specific lesson you missed. Work through a clear explanation, example, questions and printable evidence.</p><div class="unit2-steps"><span>Learn</span><span>Practise</span><span>Check</span><span>Print</span></div></section>'
 +'<section class="panel unit2-pick"><h2>Choose the lesson you missed</h2><p class="muted">Each catch-up lesson stands on its own. You will be asked for your name before you start.</p><div class="grid unit2-grid">'
 +'<article class="card unit2-tile"><div class="unit2-top"><span class="unit2-pill">Lesson 1</span><span class="unit2-duration">25–35 minutes</span></div><h3>Dr John Snow</h3><p>Collect evidence, recognise patterns and explain how Dr John Snow investigated a cholera outbreak.</p><button class="btn unit2-cta" type="button" onclick="openLesson(\'snow\')">Start lesson <span aria-hidden="true">→</span></button></article>'
 +'<article class="card unit2-tile"><div class="unit2-top"><span class="unit2-pill">Lesson 2</span><span class="unit2-duration">25–35 minutes</span></div><h3>Evacuation Planning</h3><p>Break a complex problem into smaller parts and write a clear, testable evacuation algorithm.</p><button class="btn unit2-cta" type="button" onclick="openLesson(\'evacuation\')">Start lesson <span aria-hidden="true">→</span></button></article>'
 +'</div></section><section class="panel unit2-help"><h2>How to catch up</h2><p>Enter your name, read the explanations, follow the worked examples, complete the questions and print the A4 catch-up sheet with your name and today’s date.</p></section>';
}
function gate(){const l=lessons[active];return `<p><a href="./">← Lost Learning homepage</a></p><section class="hero"><div class="label">Year 7 · Unit 2 · Lesson ${l.num}</div><h1>${l.title}</h1><p>Enter your first name and surname before starting. Your name will be placed on your printout automatically.</p></section><div class="panel"><form onsubmit="start(event)"><label for="name"><strong>Student name</strong></label><p><input id="name" name="name" required maxlength="100" autocomplete="name" placeholder="First name and surname"></p><button class="btn">Start lesson →</button></form><p class="muted">Your name stays in this browser session. It is not sent to a server.</p></div>`}function start(e){e.preventDefault();student=document.getElementById('name').value.trim().replace(/\s+/g,' ');if(student)render()}
function lessonPage(){let l=lessons[active];return `<p><a href="./">← Lost Learning homepage</a> · <a href="unit2.html">Unit 2 lessons</a></p><section class="hero"><div class="label">Year 7 · Unit 2 · Lesson ${l.num}</div><h1>${l.title}</h1><p>${l.intro}</p><p>About ${l.time} · Student: ${esc(student)}</p></section><nav class="pills"><a href="#learn">Learn</a><a href="#examples">Worked examples</a><a href="#quiz">Self-check</a><a href="#finish">Print</a></nav><section class="panel" id="learn"><div class="label">Step 1</div><h2>What you need to know</h2>${l.knowledge.map((x,i)=>`<h3>${i+1}. ${x[0]}</h3><p>${x[1]}</p>`).join('')}</section><section class="panel" id="examples"><div class="label">Step 2</div><h2>Worked examples and model answers</h2>${l.models.map(x=>`<h3>${x[0]}</h3><div class="model">${x[1]}</div>`).join('')}<div class="help"><strong>Stuck?</strong> Re-read these examples and try the quiz again.</div></section><section class="panel" id="quiz"><div class="label">Steps 3 and 4</div><h2>Check your understanding</h2><p>Answer every question, then select Mark my answers. Feedback explains any mistakes.</p><form id="quizForm"><div id="questions"></div><div class="row"><button class="btn" type="submit">Mark my answers</button><button class="btn secondary" type="button" onclick="resetQuiz()">Try again</button></div></form><div id="score" aria-live="polite"></div></section><section class="panel" id="finish"><div class="label">Step 5</div><h2>Print your catch-up work</h2><p>Print the concise A4 sheet, answer the written tasks and place it in your folder. Your name and the current UK date are included automatically. No class field is used.</p><button class="btn" onclick="printLesson()">Print A4 worksheet</button></section>`}
function quiz(){const l=lessons[active];document.getElementById('questions').innerHTML=l.questions.map((x,i)=>`<fieldset class="question"><legend>${i+1}. ${x[0]}</legend>${x[1].map((opt,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`).join('')}<div id="feed${i}" class="result hidden"></div></fieldset>`).join('');document.getElementById('quizForm').addEventListener('submit',mark)}function mark(e){e.preventDefault();let l=lessons[active],score=0;let answered=[];for(let i=0;i<l.questions.length;i++){let a=document.querySelector('input[name="q'+i+'"]:checked');if(!a){document.getElementById('score').innerHTML='<div class="result wrong">Please answer all questions before marking.</div>';return}answered.push(+a.value)}l.questions.forEach((q,i)=>{let ok=answered[i]===q[2];if(ok)score++;let el=document.getElementById('feed'+i);el.className='result '+(ok?'good':'wrong');el.textContent=(ok?'✓ Correct. ':'✗ Not quite. ')+q[3]});document.getElementById('score').innerHTML='<div class="result '+(score===l.questions.length?'good':'wrong')+'"><strong>Score: '+score+' / '+l.questions.length+'</strong><p>'+(score===l.questions.length?'Excellent!':'Re-read the feedback and try again to improve.')+'</p></div>';document.getElementById('score').scrollIntoView({behavior:'smooth'})}function resetQuiz(){document.getElementById('quizForm').reset();document.getElementById('score').innerHTML='';document.querySelectorAll('[id^=feed]').forEach(el=>{el.className='result hidden';el.textContent=''})}
function printPage(){const l=lessons[active];return `<h1>Lost Learning - Catchup Work</h1><p><strong>Year 7 · Unit 2: Thinking Like a Computer Scientist · Lesson ${l.num}: ${l.title}</strong></p><div class="meta"><span><strong>Name:</strong> ${esc(student)}</span><span><strong>Date:</strong> ${dateUK()}</span></div><h2>Essential knowledge</h2><p>${l.summary}</p><h2>Questions</h2>${l.worksheet.map((q,i)=>`<div class="print-task"><strong>${i+1}. ${q}</strong><div class="line"></div>${i===2||i===3?'<div class="line"></div>':''}</div>`).join('')}<div class="note">□ I read the explanations. &nbsp; □ I completed the self-check quiz. &nbsp; □ I checked my answers.<p>My score: ______ / ${l.questions.length} &nbsp; Something I understand better now: ________________________</p></div>`}function printLesson(){printArea.innerHTML=printPage();window.print()}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k==='snow'||k==='evacuation'){active=k;render();scrollTo(0,0)}});render();
</script></body></html>
