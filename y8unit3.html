<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 8 Unit 3: Binary and Instruction Sets | Lost Learning</title><meta name="description" content="Catch up on Year 8 binary, hexadecimal and robot instruction set design."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year8.html" style="color:white;text-decoration:none;font-weight:850">← Year 8 Lost Learning</a><a href="./" style="color:#d5ecfb;text-decoration:none;font-size:.9rem">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"year":8,"num":3,"title":"Binary and Instruction Sets","intro":"Build on Year 7 binary: convert and add numbers, use hexadecimal, and design efficient instructions for a robot.","revision":"https://kingsnortongirls.github.io/revision/y8u3and4.html","support":[],"lessons":[{"title":"Eight-Bit Binary and Addition","objective":"Convert between denary and 8-bit binary, then add binary numbers using carrying.","learn":[["Place values in binary","Denary is base 10. Binary is base 2 and uses only 0 and 1. Eight unsigned bits have place values **128, 64, 32, 16, 8, 4, 2, 1**. Their largest unsigned value is 255."],["Convert binary into denary","Add the place values under each 1. For `00101101`, add 32 + 8 + 4 + 1 to get **45**. Zero columns do not contribute to the total."],["Convert denary into 8-bit binary","Find which powers of two add to the number. For 38 use 32 + 4 + 2, giving `00100110`. Add leading zeroes if an 8-bit representation is required."],["Add in binary","Start at the right-hand column. `0+0=0`, `1+0=1` and `1+1=10` (write 0, carry 1). If another 1 is added to a carried 1 and a 1 in a column, the result is `11` (write 1, carry 1)."]],"example":["Add two four-bit numbers","`0101` (5) + `0011` (3):\n  0101\n+ 0011\n= 1000\nFrom the right: 1+1 produces 0 carry 1; the next column adds 0+1+carry 1 to make 0 carry 1; 1+0+carry 1 makes 0 carry 1; the final carry becomes the leftmost 1."],"tasks":[["Convert **01100101** and **00011110** into denary. Show the place values you add.","For each digit that is 1, include its column value. `01100101` uses 64, 32, 4 and 1."],["Convert **19** and **142** into **8-bit binary**. Explain how you found your answer.","For 19 use 16 + 2 + 1; for 142 use 128 + 8 + 4 + 2."],["Add these binary numbers, showing any carries: **0101 + 0110** and **00110101 + 00000111**.","Work right to left. The answers represent 11 and 60 in denary."]],"challenge":"Explain why the largest unsigned 8-bit value is 255 rather than 256, and what an extra bit would allow.","quiz":[["What is the value of the leftmost bit in an 8-bit unsigned number?",["128","8","256"],0,"The leftmost place value is 128."],["What is `00001010` in denary?",["10","8","12"],0,"8 + 2 = 10."],["What is 13 in 8-bit binary?",["00001101","00010100","00000111"],0,"13 = 8 + 4 + 1."],["What is `0011 + 0010` in binary?",["0101","0010","0110"],0,"3 + 2 = 5, which is 0101."]]},{"title":"Fixed Bit Strings, Hexadecimal and Overflow","objective":"Explain nibbles and bytes, convert hexadecimal values and recognise overflow when fixed-length binary results are too large.","learn":[["Bits, nibbles and bytes","A **bit** is one binary digit. A **nibble** is four bits and can show 16 different values, 0–15. A **byte** is eight bits and can show 256 distinct unsigned values, 0–255."],["Hexadecimal is base 16","Hexadecimal digits are 0–9 and A–F. A=10, B=11, C=12, D=13, E=14 and F=15. Four bits convert neatly to one hexadecimal digit."],["Convert between binary and hexadecimal","Split an 8-bit string into two groups of four: `1010 1111` = A F, so its hexadecimal representation is `AF`. Conversely hexadecimal `2C` = `0010 1100`."],["Overflow","A fixed-length register can store only values in its range. With unsigned 8-bit storage, **255 + 1 = 256** needs nine bits (`1 00000000`). If only eight bits are kept, the carried ninth bit is lost, causing overflow."],["Binary shifts","A left shift moves bits to the left. For an unsigned value with space available, shifting by one position multiplies the value by two. Bits falling off the end are lost in fixed-width storage."]],"example":["Convert and detect overflow","Hexadecimal `3F` = `0011 1111` = 63 denary.\nEight-bit `11111111` + `00000001` = nine-bit `1 00000000` (256). The ninth bit cannot fit in eight unsigned bits; this is an **overflow**."],"tasks":[["Explain the meaning of **bit**, **nibble**, **byte** and **overflow**, giving an example for each.","A nibble is four bits, a byte eight. Overflow happens when the exact result cannot fit in the chosen number of bits."],["Convert the hexadecimal numbers **1A** and **B4** into **8-bit binary** and denary.","Each hexadecimal digit represents four bits. For 1A use 0001 and 1010."],["Calculate **11110000 + 00100000**. Explain whether the result fits in eight unsigned bits.","240 + 32 = 272, which cannot fit in unsigned eight-bit storage."]],"challenge":"Explain what happens when you left-shift an 8-bit number and its leading 1 is pushed out of the available bits.","quiz":[["How many bits are in a nibble?",["4","2","16"],0,"A nibble contains four bits."],["Which hexadecimal digit represents denary 15?",["F","A","E"],0,"F is 15 in base 16."],["What is hex A in four-bit binary?",["1010","1000","1111"],0,"A is 10, which is 1010."],["What is overflow?",["A result cannot be represented in the available bits","A number contains a zero","A file has a long name"],0,"The fixed number of bits is insufficient."]]},{"title":"Create a Binary and Hexadecimal Tutorial","objective":"Produce a clear tutorial or booklet that teaches younger students conversions and binary addition.","learn":[["Write for a younger audience","A tutorial must start with the basic ideas, define unfamiliar words and show each calculation step. It should not assume the reader already knows place values."],["Teach conversions in both directions","For binary to denary, show place values above the bits and add the selected ones. For denary to binary, show how the number is formed from powers of two."],["Demonstrate addition accurately","Show one four-bit binary sum, another eight-bit sum and where a carry goes. Explain that binary does not have a digit 2."],["Use visual and written explanations","Your booklet can be created in Word, PowerPoint or a similar suitable program, or planned using the response boxes in the hub. Include checked examples and a quick practice question with a correct answer."]],"example":["Sample conversion page","**Convert 00010110 to denary:**\nPlace values: 128 64 32 16 8 4 2 1\nBits:         0   0  0  1 0 1 1 0\nAdd 16 + 4 + 2 = **22**.\n**Check:** 22 uses 16 + 4 + 2, so the binary digits are 00010110."],"tasks":[["Plan a tutorial for Year 7 pupils with sections for **binary, place values, binary-to-denary and denary-to-binary**.","Use headings, one short definition and one fully worked conversion for each direction."],["Add a step-by-step demonstration of a **four-bit binary addition** and an **eight-bit binary addition**.","Explain what happens when 1 and 1 are added and how to carry a 1."],["Create a short practice section with **three conversion questions and their correct worked answers**. Describe how you checked the answers.","Choose numbers you can verify by converting them in the opposite direction."]],"challenge":"Add an optional page introducing hexadecimal and overflow, including one correctly checked example of each.","quiz":[["What should a good tutorial include?",["Steps, worked examples and correct answers","Only a title","Unexplained screenshots"],0,"A tutorial teaches the process."],["Which addition rule is correct in binary?",["1 + 1 = 10","1 + 1 = 2","1 + 1 = 11"],0,"Binary 10 represents denary 2."],["What is the result of denary 6 in four-bit binary?",["0110","0011","1100"],0,"6 = 4 + 2."],["Why should a tutorial be checked for accuracy?",["So students do not learn the wrong method","So the font is larger","So no examples are necessary"],0,"Incorrect worked steps would mislead readers."]]},{"title":"Efficient Robot Instructions and Character Sets","objective":"Create efficient instruction sequences, calculate the number of bits used and understand ASCII and Unicode.","learn":[["An instruction set","An **instruction set** is a set of commands that a device or program can understand. A robot might recognise FORWARD, LEFT, RIGHT and STOP, each represented by a short binary code."],["How many commands fit?","With two bits, there are **2² = 4 possible codes**: 00, 01, 10, 11. With three bits, there are **2³ = 8** codes. Adding more distinct commands can require a larger bit width."],["Count the stored bits","If a program contains 12 instructions and every instruction uses two bits, it requires **24 bits** for the instruction codes. If the system changes to three-bit instructions, the same 12 instructions require **36 bits**."],["Choose efficient routes","A shorter route is not always smaller in storage if it needs more bits per instruction. Compare the **number of instructions × bits per instruction** for each possible route."],["ASCII and Unicode","Text characters are represented by numeric codes. ASCII assigns codes to a limited set of characters, such as uppercase A = 65. Unicode defines a much larger repertoire of characters and is encoded using schemes such as UTF-8."]],"example":["Compare two robot routes","Route A: 12 commands using 2-bit instructions = **24 bits**.\nRoute B: 9 commands using 3-bit instructions = **27 bits**.\nAlthough B has fewer commands, A requires fewer instruction bits. This comparison leaves out other storage costs, which may also matter."],"tasks":[["Create a **2-bit instruction set** with four named robot commands and their unique codes.","You could use 00=Forward, 01=Left, 10=Right, 11=Stop."],["Compare a route using **14 two-bit commands** with one using **10 three-bit commands**. Work out both storage totals and state the smaller one.","Calculate count × bits per instruction: 14 × 2 and 10 × 3."],["Explain **ASCII and Unicode** and demonstrate how a character can be represented by a binary number.","Use a fictional character such as A = ASCII decimal 65 = binary 01000001. Do not type anyone's personal details."]],"challenge":"Imagine adding two extra robot commands to your four-command system. Explain why you need more instruction bits and how this might affect a long program.","quiz":[["How many commands can two bits encode?",["4","2","8"],0,"Two bits have four unique combinations."],["How many command codes can three bits represent?",["8","3","6"],0,"2³ = 8."],["How many bits do 11 two-bit instructions require?",["22","11","44"],0,"11 × 2 = 22."],["What is Unicode designed to support?",["A wide repertoire of characters and scripts","Only the English alphabet","Only binary numbers"],0,"Unicode covers text across many writing systems."]]},{"title":"Scratch Robot Maze, Selection and a Bit Counter","objective":"Design procedures and conditional commands for a Scratch robot, then compare instruction-set efficiency.","learn":[["Decompose the maze","Break the journey into turns, moves and destinations. A route can be described by a **sequence** of commands. Test each part separately, not the whole route blindly."],["Reusable Scratch procedures","Use Scratch **My Blocks** to make procedures such as `goForward`, `turnLeft` and `turnRight`. Calling these blocks avoids copying long sequences of movement code."],["Binary input and selection","In Scratch, ask for a command such as `01`. Use `if answer = 01 then` to choose a movement. In real systems, instruction bits are stored and interpreted rather than being typed as an informal label."],["Count instruction storage","Create a Scratch variable such as `totalBits`. Increase it by two after each two-bit command or by three after each three-bit command, then compare the total used by different routes."],["Test and refine","Check whether every command moves the robot as intended, including when it reaches a wall or when input is invalid. Add an extra command only after updating the code and bit counter."]],"example":["A four-command robot","00 = Forward\n01 = Turn left\n10 = Turn right\n11 = Stop\nIn Scratch, a series of `if` conditions chooses which **My Block** procedure to call. Each executed two-bit command increases `totalBits` by 2. After five valid commands the counter should show 10 bits."],"tasks":[["Draw or describe a small **maze route** and list the command codes the robot would follow to reach the exit.","Use a limited set of direction/movement commands. Each code must have one clearly defined meaning."],["Explain how you would make a Scratch program respond to the codes **00, 01, 10 and 11**. Include at least two custom procedures.","Use `ask and wait` and `if / else` conditions that call your My Blocks movement procedures."],["Design a `totalBits` counter that compares **two routes**: one with nine 2-bit instructions and one with seven 3-bit instructions.","Count 18 bits versus 21 bits. Explain which is smaller in this simplified model."]],"challenge":"Add two new commands to the robot's instruction set and explain how to update the selection code, all binary codes and storage counter.","quiz":[["What is the purpose of a Scratch custom block?",["Group and reuse instructions","Delete the program","Turn off the keyboard"],0,"My Blocks supports reusable procedures."],["What is selection?",["Choosing a path based on a condition","Repeating all instructions forever","Ordering files alphabetically"],0,"Selection makes conditional decisions."],["What should a bit counter measure here?",["Instruction count multiplied by bits per instruction","The colour of a sprite","The speed of the monitor"],0,"Instruction storage depends on count and code width."],["Why should different input codes be tested?",["To check each command has the intended effect","To make every command identical","To prevent all loops"],0,"Testing individual cases helps find errors."]]}]};</script><script src="catchup.js"></script></body></html>
