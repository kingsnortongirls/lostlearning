<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 7 Unit 6 · Back to the Future | Lost Learning</title><meta name="description" content="Year 7 Back to the Future independent catch-up lessons."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="./">← Lost Learning | Computer Science</a><small>Year 7 · Unit 6</small></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"num":6,"title":"Back to the Future","intro":"Explore computing pioneers, codebreaking, the Web, Boolean logic and sorting algorithms.","revision":"https://kingsnortongirls.github.io/revision/y7u6.html","lessons":[{"title":"Alan Turing and Secret Codes","objective":"Explain Alan Turing's contribution to computing and use a key to encrypt and decrypt messages.","learn":[["Who was Alan Turing?","Alan Turing was a British mathematician and computing pioneer. His work helped establish ideas about computation. During the Second World War, he contributed to British codebreaking at Bletchley Park."],["Encryption and decryption","Encryption turns a readable message (plaintext) into an unreadable form (ciphertext) using a rule or key. Decryption reverses the process when the correct information is available."],["Cipher keys","A cipher key tells the sender and receiver how letters are changed. A Caesar shift of 3 turns A into D, B into E and C into F. To decrypt, shift each letter back by 3."],["Pigpen cipher","Pigpen substitutes symbols based on letters' positions in a grid-style key. Without the correct key, understanding the message is much harder."],["Turing's legacy","Turing was treated unjustly because of his sexuality. He received a posthumous royal pardon in 2013. His life illustrates how historical injustice can affect important scientific figures."]],"example":["Caesar shift of 3","Plaintext: CAT\nShift each letter forward by three places: C→F, A→D, T→W.\nCiphertext: FDW\nTo decrypt FDW, shift each letter backwards by three to get CAT."],"tasks":[["Write a paragraph explaining **who Alan Turing was** and why his codebreaking work mattered.","Mention computing, the Second World War and Bletchley Park."],["Encrypt the word **CODE** using a Caesar shift of +3. Show each letter change.","C→F, O→R, D→G and E→H. Join the new letters in order."],["Decrypt **KHOOR** using a Caesar shift of 3. Explain the process you used.","Move each letter back three places in the alphabet."]],"challenge":"Compare Caesar and Pigpen ciphers. Explain why simple substitution methods are not secure enough for most modern online communication.","quiz":[["Where did Turing contribute to wartime codebreaking?",["Bletchley Park","The Moon","Silicon Valley"],0,"Turing worked with others at Bletchley Park."],["What does encryption do?",["Makes plaintext harder to read without a key","Always deletes the message","Prints the message"],0,"Encryption transforms readable data."],["With a Caesar shift of +3, what does A become?",["B","D","Z"],1,"A shifted three places is D."],["What helps someone decrypt a coded message?",["The appropriate cipher rule or key","The size of the computer monitor","The colour of the keyboard"],0,"The key or rule helps reverse the transformation."]]},{"title":"Tim Berners-Lee and the World Wide Web","objective":"Explain the difference between the internet and the Web and create a simple HTML web page.","learn":[["Who is Tim Berners-Lee?","Sir Tim Berners-Lee invented the World Wide Web at CERN in 1989. The Web was developed so people could share and link information more easily."],["Internet versus Web","The internet is the global network infrastructure that connects devices. The World Wide Web is a service that uses the internet, with web pages connected through hyperlinks."],["HTML gives a page structure","HTML stands for HyperText Markup Language. Tags such as `\u003ch1>`, `\u003cp>` and `\u003ca>` describe headings, paragraphs and links. Browsers interpret this markup."],["Why open standards matter","Making web technologies broadly available helped information sharing and innovation. A website can provide text, images and clickable links."]],"example":["A tiny HTML page","\u003c!doctype html>\n\u003chtml>\n\u003cbody>\n\u003ch1>Tim Berners-Lee\u003c/h1>\n\u003cp>He invented the World Wide Web.\u003c/p>\n\u003ca href=\"https://home.cern/\">CERN\u003c/a>\n\u003c/body>\n\u003c/html>"],"tasks":[["Explain in your own words how the **internet** differs from the **World Wide Web**. Include one example of each.","The internet connects computers; the Web is made of linked pages and websites."],["Create or write a simple HTML page about Tim Berners-Lee containing a heading and **three factual sentences**.","Use `\u003ch1>` for the heading and `\u003cp>` for each paragraph."],["Add a **hyperlink** to a suitable information page and explain what the `href` attribute does.","Use `\u003ca href=\"https://...\">Link text\u003c/a>` to create a clickable link."]],"challenge":"Use CSS to add a background colour or improve your page layout. Explain why HTML and CSS do different jobs.","quiz":[["Who invented the World Wide Web?",["Alan Turing","Tim Berners-Lee","Charles Babbage"],1,"Berners-Lee invented the Web."],["What is the internet?",["The infrastructure connecting devices globally","A single website","Just a web browser"],0,"The internet is the underlying network."],["Which HTML tag makes a heading?",["\u003ch1>","\u003cp>","\u003cimg>"],0,"H1 defines a level-one heading."],["What does a hyperlink do?",["Connects to another resource or location","Erases a file","Turns off the network"],0,"Hyperlinks connect web resources."]]},{"title":"George Boole and Logic Gates","objective":"Understand binary logic, work out AND, OR and NOT gate outputs and complete truth tables.","learn":[["George Boole","George Boole developed an algebra of logic in which statements can be true or false. This is a foundation of digital electronics and computing."],["Boolean values","Boolean logic uses two values, often 1 for TRUE and 0 for FALSE. Logic gates perform operations using one or more binary inputs."],["AND, OR and NOT","AND produces 1 only if **both** inputs are 1. OR produces 1 if **at least one** input is 1. NOT reverses its single input, so NOT 1 = 0."],["Truth tables","A truth table lists every possible input combination and the corresponding output. Two inputs A and B give four rows: 00, 01, 10 and 11."]],"example":["AND and OR truth table","A B | AND | OR\n0 0 |  0  | 0\n0 1 |  0  | 1\n1 0 |  0  | 1\n1 1 |  1  | 1\nFor a NOT gate: NOT 0 = 1 and NOT 1 = 0."],"tasks":[["Explain who **George Boole** was and why binary TRUE/FALSE logic is useful in computers.","Digital circuits often make decisions based on two states."],["Complete the four rows of a truth table for an **AND** gate and an **OR** gate. Explain the difference.","List A B as 00, 01, 10, 11 and apply the gate rule to each row."],["A circuit has the expression **NOT (A AND B)**. Work out the output for A=1, B=0 and then for A=1, B=1.","Work out AND first, then reverse its output with NOT."]],"challenge":"Describe or draw a two-gate circuit that produces 1 when A=1 and B=0, but 0 when B=1. Explain each gate.","quiz":[["What output does AND give when A=1 and B=0?",["1","0","2"],1,"AND needs both inputs to be 1."],["What output does OR give when A=0 and B=1?",["0","1","2"],1,"OR needs at least one input of 1."],["What is NOT 0?",["0","1","10"],1,"NOT reverses the input."],["How many rows are in a complete truth table for two binary inputs?",["2","4","8"],1,"Two inputs give 2 × 2 = 4 combinations."]]},{"title":"Charles Babbage, Tower of Hanoi and Bubble Sort","objective":"Explain Charles Babbage's contribution and solve problems using step-by-step algorithms.","learn":[["Charles Babbage","Charles Babbage designed important mechanical computing machines, including the Difference Engine and Analytical Engine. The Analytical Engine was a design for a programmable general-purpose machine."],["Solve problems systematically","Computational thinking uses decomposition, ordered steps and careful testing. A puzzle such as Tower of Hanoi rewards planning rather than random moves."],["Tower of Hanoi rules","Move one disc at a time. A larger disc cannot be placed on a smaller disc. With three discs, the minimum number of moves is seven."],["Bubble sort","Bubble sort compares **adjacent** values. If they are in the wrong order, swap them. Continue through the list repeatedly until it is sorted. The largest remaining item moves to the right during a pass."]],"example":["Bubble sort one pass","Start: 5, 2, 4\nCompare 5 and 2: swap → 2, 5, 4\nCompare 5 and 4: swap → 2, 4, 5\nThe list is now sorted. Bubble sort uses adjacent comparisons, not random swaps."],"tasks":[["Write **three facts** about Charles Babbage and explain the significance of his mechanical computing designs.","Include the Difference Engine or Analytical Engine and their intended purpose."],["Explain the **three rules** of Tower of Hanoi. How many minimum moves are needed for three discs?","Move one at a time; only the top disc can move; never place a larger one on a smaller one."],["Bubble sort the list **6, 3, 5, 1** into ascending order. Show the list after each swap.","Compare neighbours from left to right, then begin another pass until sorted."]],"challenge":"Explain the difference between bubble sort and merge sort at a basic level. Which approach works by splitting the list into smaller halves?","quiz":[["Which person designed the Analytical Engine?",["Charles Babbage","Tim Berners-Lee","George Boole"],0,"Babbage designed the Analytical Engine."],["Which discs may be moved in Tower of Hanoi?",["Only the top disc on a peg","Any disc","Only the biggest disc"],0,"Only the top disc is available to move."],["What does bubble sort compare?",["Adjacent items","Only the first and last items","Random numbers"],0,"Bubble sort compares neighbours."],["What should happen when two adjacent numbers are in the wrong ascending order?",["Swap them","Delete them","Add them"],0,"Swapping puts that pair in the correct order."]]}]};</script><script src="catchup.js"></script></body></html>
