<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 9 Unit 4: Photopea | Lost Learning</title><meta name="description" content="Two Photopea catch-up lessons covering editing tools and poster design."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year9.html">← Year 9 Lost Learning</a><a href="./">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Year 9 Computer Science</footer><script>window.LOST_UNIT={"year":9,"num":4,"title":"Photopea and Photo Editing","icon":"image","intro":"Learn essential editing tools and apply them to create a readable, effective safety poster.","revision":"https://kingsnortongirls.github.io/revision/y9u4.html","support":[["Open Photopea editor","https://www.photopea.com/"]],"lessons":[{"title":"Brush, Spot Healing and Clone Tools","objective":"Use Photopea's brush, spot-healing and clone tools to draw and remove unwanted objects.","learn":[["Start a project","Photopea is a browser-based graphics editor. Create a new project or open an appropriate practice image, then save work in an editable format such as PSD when you need to keep layers."],["Brush tool","The brush paints with the chosen foreground colour. Adjust **brush size, hardness and colour** to suit the task. Work on a new layer when possible so changes can be edited."],["Spot healing brush","The spot-healing brush blends small unwanted marks with nearby image information. Use a brush a little larger than the mark, and paint over small areas at a time."],["Clone stamp","The clone tool copies pixels from a chosen source to another area. Select a suitable source in Photopea, then paint carefully over an unwanted object. Choose a nearby texture and check the edges."],["Save and compare","Keep an original version and an edited version. If a tool looks unnatural, undo and try a smaller brush or better source. Do not misrepresent manipulated images as untouched evidence."]],"example":["Removing a small mark","For a tiny blemish in an empty sky: try **spot healing** with a brush slightly bigger than the mark. If the nearby sky has complicated textures, choose an appropriate clean source and use the **clone stamp** carefully."],"tasks":[["Create a simple **house drawing** with Photopea's brush tool. Describe the colour and size settings you used.","Make a new blank project. Change brush colour and thickness before drawing the roof, walls and windows."],["Practise **spot healing** on an appropriate practice photograph. Explain what you removed and how you avoided obvious blurred edges.","Work with a copy of an image you are allowed to edit. Use small strokes and compare before/after."],["Practise **clone stamping** to remove a different object. Explain how you chose the source area and what you improved.","Choose a nearby area of similar colour and texture. Add a screenshot of your edited work."]],"challenge":"Use all three tools to make a deliberately stylised illustration, then explain which tool was most useful for each change.","quiz":[["Which tool paints with a selected colour?",["Brush","Clone stamp only","Crop only"],0,"The brush paints with the foreground colour."],["Which tool is often useful for tiny marks?",["Spot healing","Text tool","Move tool"],0,"Spot healing blends small defects."],["What does clone stamp do?",["Copies pixels from a source area","Always blurs the whole image","Creates a new web page"],0,"Cloning transfers pixels."],["Why keep a copy of an original photo?",["So editing can be compared or reversed","To make a file impossible to open","To disable layers"],0,"Keeping the original supports safe editing."]]},{"title":"Text Tool and a Stay-Safe Poster","objective":"Combine Photopea's text and editing tools to produce an accessible, informative online-safety poster.","learn":[["Create readable text","Use the **Text tool** to add titles and information. Choose clear fonts, a readable size, consistent alignment and sufficient contrast against the background."],["Combine earlier editing skills","The Brush, Spot Healing and Clone tools can improve an image, but the message of the poster must remain clear. Use images you have permission to use."],["Plan for an audience","A successful Year 7 safety poster has a strong heading, two or three memorable actions and enough space for the reader to absorb the message quickly."],["Layers help editing","Separate text, photographs and decorative marks onto layers so each can be moved, resized or adjusted without damaging other parts."],["Export and show evidence","Save an editable project and export a readable image or PDF as appropriate. Add a screenshot to your Lost Learning evidence showing the poster and explain your design choices."]],"example":["A safe-password poster","Heading: **KEEP YOUR ACCOUNTS SAFE**\nThree short tips: Use a long, unique password. Turn on extra sign-in verification. Report suspicious messages.\nDesign: large high-contrast title, one relevant illustration and plenty of clear space."],"tasks":[["Plan a **stay-safe poster for younger students**, identifying the topic, intended audience, heading and three accurate safety messages.","Possible topics: passwords, scams or respectful online communication. Keep advice age-appropriate."],["Create the poster using **Photopea** and at least one image-editing tool from Lesson 1, plus a clear text hierarchy.","Use layers; choose legible fonts and contrast; work with appropriately licensed images."],["Evaluate your poster against **clarity, accuracy, visual appeal and accessibility**. Describe two improvements you made.","Check spelling, reading order, image quality and whether a Year 7 pupil can act on the advice."]],"challenge":"Make two versions of your poster for different audiences and explain which layout, colours and wording you changed.","quiz":[["Which tool adds a heading in Photopea?",["Text","Spot healing","Clone stamp"],0,"Text adds editable lettering."],["What helps text remain readable?",["Good contrast and adequate size","Tiny text","Words over a very busy image"],0,"Contrast and size improve accessibility."],["Why use layers?",["To edit parts independently","To make the whole poster one colour","To prevent saving"],0,"Layers separate elements."],["What should safety advice be?",["Accurate, clear and age-appropriate","Deliberately vague","Based only on rumours"],0,"Readers need trustworthy guidance."]]}]};</script><script src="catchup.js"></script></body></html>
