<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 7 Unit 7 · Introduction to Python | Lost Learning</title><meta name="description" content="Year 7 Introduction to Python independent catch-up lessons."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="./">← Lost Learning | Computer Science</a><small>Year 7 · Unit 7</small></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"num":7,"title":"Introduction to Python","intro":"Write short Python programs using output, input, variables, arithmetic and selection.","revision":"https://kingsnortongirls.github.io/revision/y7u7.html","lessons":[{"title":"Print, Input and Variables","objective":"Use Python's print command to display information and store user input in a variable.","learn":[["Python is a text-based language","Python programs are written with precise words, punctuation and indentation. A program runs one instruction at a time unless its control flow changes."],["Displaying output with print","`print(\"Hello world\")` displays Hello world. Text inside quotation marks is called a string. Capital letters matter: the command is `print`, not `PRINT`."],["Ask for input","`input(\"What is your name? \")` displays a question and waits for a response. Python returns the response as text."],["Variables store values","A variable has a name, such as `name`, and stores data that a program can use later. Write `name = input(\"Name? \")` to keep the answer, then `print(name)` to display it."]],"example":["A personalised greeting","name = input(\"What is your name? \")\nprint(\"Hello\", name)\nThe response is stored in `name`. The second line prints a greeting followed by that value."],"tasks":[["Write Python that prints **three separate messages**. Explain where quotation marks and brackets go.","Each line can use `print(\"Your message\")`."],["Write a program that asks a fictional user for their favourite animal, stores the answer and prints it back.","Use a variable such as `animal = input(\"Favourite animal? \")` followed by `print(animal)`."],["Explain the difference between `print(\"name\")` and `print(name)` when `name` is a defined variable.","The first shows the literal text 'name'; the second shows the value stored in the variable."]],"challenge":"Write a program that asks for a first name and favourite colour, then prints both values together in a meaningful sentence.","quiz":[["What does `print(\"Hello\")` do?",["Displays Hello","Waits for user input","Deletes a variable"],0,"print displays output."],["Which symbol is used to assign a value to a variable?",["=","==","?"],0,"A single equals sign assigns a value."],["What does input() return by default?",["Text (a string)","A whole number automatically","A drawing"],0,"Input is text unless converted."],["What happens in `print(name)`?",["It prints the value held in name","It always prints the word name","It creates a new variable"],0,"Without quotes, Python treats name as a variable."]]},{"title":"Comments, New Lines and Reusing Variables","objective":"Use comments to explain code, display output over several lines and recall values from multiple variables.","learn":[["Single-line comments","A Python comment starts with `#`. Python ignores the rest of that line. Comments help explain what the program does, but do not change the output."],["Several lines of explanation","You can add multiple lines beginning with `#` to write a longer comment. Triple-quoted strings are sometimes used for documentation, but are not the same as ordinary `#` comments."],["New lines","The escape sequence `\\n` creates a line break inside a string. For example, `print(\"First\\nSecond\")` displays First and Second on separate lines."],["Recall from several variables","Use `input()` to gather two answers and store them under different names. You can reuse each variable later in the program without asking the same question again."]],"example":["Two questions and a list of answers","# Ask for information\nfood = input(\"Favourite food? \")\nfilm = input(\"Favourite film? \")\n# Display on two lines\nprint(\"Food:\", food)\nprint(\"Film:\", film)"],"tasks":[["Write **three lines of Python comments** explaining what a programme about favourite hobbies does.","Put `#` at the beginning of each comment line."],["Write a print command that displays 'First' and 'Second' on different lines **using one print statement**.","Use the newline escape sequence `\\n` inside the string."],["Write a program that asks **three questions**, saves the answers in three variables and displays a labelled list.","Use descriptive variable names and three `input()` calls."]],"challenge":"Write a programme that includes an opening comment, a multi-line explanation, two input statements and output using a newline. Explain how comments differ from output.","quiz":[["What does `#` do in Python?",["Starts a comment","Multiplies numbers","Creates a loop"],0,"# marks a comment."],["How can you put a newline inside a printed string?",["Use \\n","Use //","Use *"],0,"The escape sequence \\n produces a new line."],["Why use descriptive variable names?",["To make programs easier to understand","To speed up the internet","To change every answer to a number"],0,"Clear names help readability."],["If `food = \"pasta\"`, what does `print(food)` display?",["food","pasta","Nothing"],1,"Python prints the value in the variable."]]},{"title":"Data Types and Arithmetic","objective":"Use integers, floats and arithmetic operators to calculate with values entered by the user.","learn":[["Data types","A string is text, such as `\"7\"`. An integer is a whole number, such as `7`. A float can contain a decimal, such as `7.5`."],["Input must be converted for maths","`input()` returns a string. Convert whole-number input with `int(input(\"Age? \"))`. Use `float(...)` for values that may include decimals."],["Arithmetic operators","Use `+` for addition, `-` for subtraction, `*` for multiplication and `/` for division. Python follows the normal order of operations, including brackets."],["Common bugs","`\"2\" + \"3\"` makes `\"23\"`, not 5. To add numerically, convert first. Use meaningful names and test with more than one input."]],"example":["Calculate an annual amount","monthly = float(input(\"Monthly amount: \"))\nyearly = monthly * 12\nprint(\"Yearly amount:\", yearly)\n`float()` allows decimal input. Multiplication is written with `*`."],"tasks":[["Give examples of a **string**, **integer** and **float** and explain why they differ.","Try `\"12\"`, `12` and `12.5`."],["Write code to ask for **two whole numbers**, add them and display the result.","Convert each input with `int()` before adding."],["Write a program to calculate the cost of **three identical items** from a price entered by the user.","Use `price = float(input(...))` then `total = price * 3`."]],"challenge":"Write a small calculator that takes two numbers and displays their sum, difference, product and quotient. Explain what would happen if the second number were zero.","quiz":[["Which data type represents 5.25?",["integer","float","boolean"],1,"Float values can have fractional parts."],["What does `int(\"8\")` produce?",["The integer 8","The string 8","An error every time"],0,"int converts suitable text to a whole number."],["Which operator multiplies in Python?",["x","*","^"],1,"An asterisk is multiplication."],["What is `\"2\" + \"3\"`?",["5","23","6"],1,"Adding strings joins their characters."]]},{"title":"Selection: If, Else and Elif","objective":"Use conditions to choose which instructions Python should execute and test different outcomes.","learn":[["Selection makes decisions","A program uses selection when it must follow one path for some inputs and another path for others. A Boolean condition evaluates to True or False."],["Use if and else","`if score >= 5:` starts a conditional block. Its indented statements run when the condition is true. The `else:` block runs if the condition is false."],["Comparison operators","`==` means equals in a test; `!=` means not equal; `>` and `\u003c` mean greater/less than; `>=` and `\u003c=` include equal. A single `=` assigns a value, not compares it."],["Several alternatives with elif","`elif` tests another condition after an initial `if` condition was false. Python checks the branches in order; only one branch of a single if/elif/else chain is selected."],["Indentation and testing","Python needs indentation to show which instructions belong inside a branch. Test values on either side of a threshold to check the correct message is printed."]],"example":["Choose an age-based message","age = int(input(\"Age? \"))\nif age \u003c 12:\n    print(\"Under 12\")\nelif age \u003c 16:\n    print(\"12 to 15\")\nelse:\n    print(\"16 or older\")"],"tasks":[["Write a program asking for a test score. Print 'Pass' for a score of **5 or above** and 'Keep practising' otherwise.","Use an integer input, `if score >= 5:` and `else:` with indentation."],["Write a program asking for pocket money per month. Calculate yearly money and choose a message based on whether the yearly total exceeds **£100**.","Convert the input to a number and multiply it by 12 before the `if` statement."],["Write an `if` / `elif` / `else` program that prints a different message for temperatures below 10°C, 10–19°C and 20°C or above.","Test `temp \u003c 10`, then `temp \u003c 20`, then use `else`."]],"challenge":"Explain the difference between `=` and `==`, then write a selection program with three branches and test it at its boundary values.","quiz":[["Which operator tests equality?",["=","==","+="],1,"Use == to compare values."],["Why indent the lines below `if`?",["To show which lines belong to that block","To decorate the code","To convert it to Scratch"],0,"Indentation defines the code block."],["What does `elif` mean?",["Test another condition if earlier ones were false","Always print both messages","Stop the interpreter"],0,"elif adds another decision branch."],["What prints when `score = 4` and the code tests `if score >= 5` with an else branch?",["The if branch","The else branch","Both branches"],1,"4 is less than 5, so the false branch runs."]]}]};</script><script src="catchup.js"></script></body></html>
