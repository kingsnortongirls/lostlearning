<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 8 Unit 5: Sorted! | Lost Learning</title><meta name="description" content="Catch up on sorting algorithms including Bubble, Insertion and Merge Sort."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year8.html" style="color:white;text-decoration:none;font-weight:850">← Year 8 Lost Learning</a><a href="./" style="color:#d5ecfb;text-decoration:none;font-size:.9rem">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"year":8,"num":5,"title":"Sorted! Sorting Algorithms","intro":"Understand why computers sort data and practise systematic sorting algorithms.","revision":"https://kingsnortongirls.github.io/revision/y8u5.html","support":[],"lessons":[{"title":"What Are Sorting Algorithms?","objective":"Explain sorting, ascending and descending order, and how computer programs can manage lists of data.","learn":[["Why sort information?","Sorting makes data easier to find, compare and use. Examples include a train departure board ordered by time, emails ordered by date and a game leaderboard ordered by highest score."],["Ascending and descending","**Ascending** order means smallest to largest, earliest to latest or A to Z. **Descending** reverses the direction. Different situations need different sorting orders."],["Lists and arrays","A list is an ordered collection of items. Scratch supports lists: you can add, delete, replace and read items by position. A sorting algorithm rearranges items without losing them."],["Computers need instructions","An algorithm is a precise set of steps that gives a predictable result. Randomly swapping numbers, as in bogo sort, is unreliable. A systematic algorithm compares particular items and decides when to swap."],["Time depends on the data","An algorithm may need more work for larger lists or certain starting orders. Two correct sorting methods can take different numbers of comparisons or swaps."]],"example":["Choose an order for the job","Train departures: **09:10, 09:35, 10:00** is ascending by time.\nGame scores: **900, 700, 450** is descending by score.\nTo sort `9, 2, 7, 4` in ascending order, the expected final list is `2, 4, 7, 9`."],"tasks":[["Give **five real-world examples** of computer systems sorting data. Explain the useful ordering rule for each.","Think about shopping prices, library catalogues, train times, school registers and high scores."],["Put **12, 5, 17, 3, 9** in ascending and descending order. Then explain the two terms in your own words.","Ascending goes from lowest to highest; descending from highest to lowest."],["Plan a Scratch **list** for five fictional race times. Describe how you would create and display the list and why an automatic sorting algorithm would help.","Use a named list such as `times`, then add values. Sorting helps find fastest or slowest times."]],"challenge":"Explain why 'swap two random items until the list looks sorted' is usually a poor sorting strategy. Consider time and reliability.","quiz":[["Which order is ascending?",["2, 5, 8","8, 5, 2","5, 2, 8"],0,"Ascending is smallest to largest."],["What ordering often suits a high-score leaderboard?",["Descending","Unsorted","Random"],0,"The highest score is commonly first."],["What does a sorting algorithm do?",["Rearranges data into an order","Deletes every value","Only displays a picture"],0,"Sorting algorithms order data."],["Why might a larger list take longer to sort?",["More comparisons and moves may be required","The monitor gets bigger","Numbers stop working"],0,"Sorting work generally increases with input size."]]},{"title":"Bubble Sort Step by Step","objective":"Apply bubble sort to a list, show each comparison and swap, and explain why some input lists need more passes.","learn":[["Compare neighbours","Bubble sort looks at **adjacent pairs**. For ascending order, if the left value is larger than the right one, swap them; otherwise leave them in place."],["What is a pass?","A **pass** moves from left to right comparing neighbours. After a complete pass, the largest unsorted value reaches the end of the list."],["Repeat until sorted","Make further passes until the list is sorted. A simple fixed-pass algorithm can continue even if the list already looks sorted; an optimised version can stop early if a pass makes no swaps."],["Why speed varies","A large value at the front can move many places right in one pass. A small value at the far right usually moves only one place left per pass, so its position can make sorting slower."]],"example":["Bubble sort 5, 2, 4, 1","Pass 1:\n5 and 2 → swap → 2,5,4,1\n5 and 4 → swap → 2,4,5,1\n5 and 1 → swap → 2,4,1,5\nPass 2:\n2 and 4 → no swap; 4 and 1 → swap → 2,1,4,5\nPass 3: 2 and 1 → swap → **1,2,4,5**."],"tasks":[["Bubble sort **6, 2, 5, 1** in ascending order and show the list after **every swap**.","Start at the left, compare adjacent values, swap if they are in the wrong order and repeat passes."],["Explain what a **pass** means in bubble sort and why the largest value moves to the end after the first complete pass.","A series of comparisons moves the largest encountered value rightwards each time it is larger than its neighbour."],["Compare the starting lists **1, 2, 3, 4** and **4, 3, 2, 1**. Predict which creates more swaps and explain your reasoning.","The reversed list needs many swaps; a sorted list needs none, though an unoptimised version may still perform comparisons."]],"challenge":"Describe how a 'swapped' flag can stop bubble sort early when a full pass makes no swaps. Explain why this saves work.","quiz":[["What does bubble sort compare?",["Adjacent items","Only the smallest item","Random pairs only"],0,"Bubble sort compares neighbours."],["For ascending order, when should adjacent numbers be swapped?",["When left > right","When left \u003c right","Every single time"],0,"The larger number moves right."],["What settles at the right-hand end after the first complete pass?",["The largest item","The smallest item","The average"],0,"The largest value bubbles right."],["What might an optimised bubble sort do if a pass has no swaps?",["Stop because the list is sorted","Delete the list","Restart with random values"],0,"No swaps on a full pass means the list is in order."]]},{"title":"Insertion Sort, Selection Sort and Merge Sort","objective":"Explain other sorting methods and compare how they work with bubble sort.","learn":[["Insertion sort","Insertion sort grows a sorted section from left to right. Take the next item and insert it into its correct position among the already-sorted items, moving larger items right to make space."],["Selection sort","Selection sort repeatedly finds the smallest remaining value and places it at the next unsorted position. It is different from bubble sort because it scans the unsorted items to choose one."],["Merge sort","Merge sort divides a list into smaller halves, sorts those halves and **merges** them back into a fully sorted list. When merging, compare the first remaining items of each sorted half."],["Compare methods","Bubble sort compares neighbours; insertion sort places each new item in an ordered section; selection sort chooses the smallest remaining item; merge sort divides and combines. Each method has different amounts of work and uses."],["Explain with examples","A good description shows at least one intermediate state rather than simply claiming the list 'becomes sorted'. Keep the original values and check the final output."]],"example":["Insertion and merge sort on a small list","**Insertion sort** on 5, 2, 4: start with [5] sorted; insert 2 → [2,5]; insert 4 → [2,4,5].\n**Merge sort** on 5,2,4,1: divide into [5,2] and [4,1], sort halves [2,5] and [1,4], then merge → [1,2,4,5]."],"tasks":[["Carry out an **insertion sort** on **7, 3, 6, 2**, showing the sorted section after each insertion.","Start with [7]. Insert 3, then 6, then 2 into the correct position."],["Explain **selection sort** by showing how you would find and place the smallest value in **8, 5, 1, 4**.","First select 1 and place it in the first position, then find the smallest remaining item."],["Demonstrate **merge sort** on **6, 2, 5, 1**. Show the splits, the two sorted halves and the final merge.","Split into [6,2] and [5,1]. Sort each pair then merge carefully."]],"challenge":"Write a comparison table for bubble, insertion, selection and merge sort. Explain which of the four uses divide-and-conquer.","quiz":[["Which sort builds a sorted section one item at a time?",["Insertion sort","Bubble sort","Merge sort"],0,"Insertion places each new item in an ordered portion."],["Which sort finds the smallest remaining item and places it next?",["Selection sort","Bubble sort","Insertion sort"],0,"Selection chooses the smallest remaining item."],["Which sort works by splitting a list and merging sorted parts?",["Merge sort","Selection sort","Bogo sort"],0,"Merge sort divides then merges."],["What is an important feature of a good sorting explanation?",["Showing intermediate steps and checking order","Only writing 'done'","Using random swaps without rules"],0,"The method must be clear and verifiable."]]}]};</script><script src="catchup.js"></script></body></html>
