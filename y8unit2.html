<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 8 Unit 2: The Command Line | Lost Learning</title><meta name="description" content="Year 8 Unit 2 lesson-by-lesson catch-up resources."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year8.html" style="color:white;text-decoration:none;font-weight:850">← Year 8 Lost Learning</a><a href="./" style="color:#d5ecfb;text-decoration:none;font-size:.9rem">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"year":8,"num":2,"title":"The Command Line","intro":"Understand how files and folders are managed, then compare graphical and command-driven interfaces.","revision":"https://kingsnortongirls.github.io/revision/y8u1and2.html","support":[],"lessons":[{"title":"File and Folder Management","objective":"Create a sensible folder structure and explain how files can be moved, copied, renamed, backed up and recognised by extension.","learn":[["Why file organisation matters","A well-named folder helps you find work later. Use descriptive filenames, such as `year8_flowol_task1.docx`, and a logical arrangement of folders rather than saving everything in one location."],["Copy versus move","Copying makes another copy of a file; the original stays. Moving changes its location. Renaming changes what a file is called without necessarily changing its contents."],["Extensions identify file formats","A filename extension helps identify a file format: `.docx` for many Word documents, `.pptx` for PowerPoint, `.png` for a picture, `.pdf` for a fixed-layout document and `.zip` for a compressed archive."],["Backups and zipping","A backup is another copy kept so you can recover work if the original is lost. Zipping packages files into an archive and may reduce their size; a ZIP archive is not a replacement for a backup stored somewhere safe."]],"example":["A clear schoolwork structure","Computer Science / Year 8 / Unit 2 / Lesson 1.docx\nThis makes the file's subject, year, unit and lesson obvious. Copy it to a suitable backup location rather than keeping both copies in the same folder."],"tasks":[["Plan a folder tree for **Year 8 Computer Science**, with Unit 1, Unit 2 and Unit 3 and appropriately named lesson files.","Write the folder names on separate lines, indenting subfolders under the main folder."],["Explain **how to copy, move, rename and delete** a file using a graphical file manager.","Describe right-click options or keyboard shortcuts. For deletion, use an imaginary practice file only."],["Create a mini guide or poster about **four file extensions** and how to back up work safely.","Give each extension, the usual file type and an example of a sensible backup location."]],"challenge":"Explain why putting a ZIP copy of your work beside the original on the same failing drive may not protect you from data loss.","quiz":[["What is the result of copying a file?",["The original remains and a second copy exists","The original always disappears","The file becomes a folder"],0,"Copy creates an additional file."],["What does `.pptx` usually indicate?",["A PowerPoint presentation","A photograph","An audio recording"],0,"PPTX is a presentation format."],["Which is an example of a sensible filename?",["thing_final_final2","Year8_Unit2_FileGuide.docx","!!!.docx"],1,"A descriptive name identifies the work."],["What is the main purpose of a backup?",["To recover information after loss or damage","To choose a nicer font","To reduce all file sizes"],0,"Backups provide another recovery copy."]]},{"title":"Using the Windows Command Prompt","objective":"Recognise common command-line instructions and compare the advantages of a GUI and a CLI.","learn":[["Graphical and command-line interfaces","A **GUI** lets a person click items and buttons. A **command-line interface (CLI)** accepts typed instructions. Both can manage files; the CLI is especially useful for repeatable tasks and automation."],["Directories are folders","The command prompt has a current directory. In Windows CMD, `dir` lists files and directories, `cd` changes directory, and `mkdir` creates a new directory."],["Useful file commands","For controlled practice in CMD: `copy` copies a file, `move` moves one, and `ren` renames one. `del` deletes files and needs particular care. CMD command syntax is not identical to Linux or macOS shell syntax."],["Use a safe practice area","Commands change real files. **Never run deletion or unfamiliar commands in school or personal folders.** Only try commands with teacher permission in a disposable practice folder."],["Choosing an interface","A GUI may be more intuitive for a one-off task; a CLI can efficiently repeat the same command over many files. The right choice depends on the scenario."]],"example":["Practice commands in a fictional folder","`mkdir Practice`\n`cd Practice`\n`dir`\nThis creates a practice folder, changes into it and lists its contents. These are **Windows CMD** examples. They do not need to be run to answer the questions."],"tasks":[["Match the commands **dir, cd, mkdir, copy, move and ren** to their meanings and write an example use for three of them.","`dir` lists files; `cd` changes folder; `mkdir` creates one; `copy` duplicates; `move` relocates; `ren` changes the filename."],["Write a safe sequence of CMD instructions to create a folder called `Revision` and enter it. Explain each command.","Use `mkdir Revision` then `cd Revision`. `dir` can show the files in the folder."],["Compare GUI and CLI file management. Give **two advantages and one disadvantage** of each.","Think about ease of use, speed for repeated tasks, discoverability and typing mistakes."]],"challenge":"A technician needs to rename 200 files in the same way. Explain why a scripted CLI approach might be preferable, and what should be tested before running it.","quiz":[["What does `dir` do in Windows CMD?",["Lists files and directories","Removes all files","Prints a photograph"],0,"DIR shows directory contents."],["What does `mkdir Homework` do?",["Creates a directory called Homework","Copies a file","Renames the current user"],0,"MKDIR creates a folder."],["Which command changes the current directory?",["cd","del","echo"],0,"CD stands for change directory."],["When is a command line particularly useful?",["When repeating scripted operations","Only when moving the pointer","Only for drawing pictures"],0,"Command lines can automate repeatable tasks."]]}]};</script><script src="catchup.js"></script></body></html>
