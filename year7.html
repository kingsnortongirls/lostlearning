<script>
"use strict";
const lessons={
hardware:{num:1,title:"Hardware",time:"20–30 minutes",intro:"Find out what is inside a computer, what each part does and how a computer turns input into output.",
knowledge:[
["Hardware means physical parts","Hardware is anything you can physically touch, such as a keyboard, monitor, motherboard or CPU. Software means the programs and instructions a computer runs."],
["Input, process and output","Input devices send data INTO a computer. The CPU processes data by following instructions. Output devices present information to the user."],
["Memory is not the same as storage","RAM temporarily holds data and programs currently being used. Its contents are lost when the power is switched off. Storage, such as an SSD or hard disk, keeps files when the power is off."],
["Know the main components","CPU: processes instructions. RAM: temporary working memory. SSD/hard disk: long-term storage. Motherboard: connects components. Power supply: provides electrical power. Heatsink/fan: removes heat. Graphics card: produces graphics. Sound card: processes audio."]
],questions:[
{q:"Which component processes instructions?",options:["CPU","Monitor","Keyboard","SSD"],a:0,why:"The central processing unit (CPU) carries out instructions."},
{q:"Which is an input device?",options:["Speaker","Mouse","Monitor","Projector"],a:1,why:"A mouse sends movement and clicks into the computer."},
{q:"What happens to the contents of RAM when a computer is switched off?",options:["They stay permanently","They are lost","They print automatically"],a:1,why:"RAM is volatile memory."},
{q:"Where should you save a document so it remains after switching off?",options:["RAM","CPU","SSD or hard disk"],a:2,why:"Storage keeps files without power."},
{q:"What is the main job of the motherboard?",options:["Connect the computer's components","Display images","Record your voice"],a:0,why:"The motherboard provides the connections between components."},
{q:"Which item can act as both an input and an output device?",options:["Touchscreen","Keyboard","Speaker"],a:0,why:"Touch provides input and the screen displays output."},
{q:"In a calculator, what is the PROCESS?",options:["Typing 3 × 4","Multiplying 3 by 4","Showing 12"],a:1,why:"The process is the calculation performed on the input."},
{q:"Which component is designed to help remove heat?",options:["Heatsink","Webcam","Microphone"],a:0,why:"Heatsinks and fans help cool components."}
],worksheet:[
"Define hardware and give two examples.",
"Explain what the CPU does.",
"State one difference between RAM and storage.",
"Sort these into input or output: keyboard, monitor, microphone, speakers.",
"A calculator receives 3 and 4, multiplies them and displays 12. Label the input, process and output.",
"Challenge: Explain why a touchscreen is both an input and an output device."
]},
binary:{num:2,title:"Binary",time:"25–35 minutes",intro:"Learn why computers use 0s and 1s, and practise converting between binary and denary.",
knowledge:[
["Binary uses only 0 and 1","Denary (also called decimal) is base 10. Binary is base 2. Computers use electronic circuits with two distinct states, represented by 0 and 1."],
["Every column has a place value","From right to left, binary columns are 1, 2, 4, 8, 16, 32, 64, 128. Each column is double the one to its right."],
["Binary to denary","Write the place values above the digits. Add only those columns that have a 1. Example: 1010 = 8 + 2 = 10."],
["Denary to binary","Start with the largest power of two that fits. Put a 1 in that column and subtract its value. Put 0 in columns that do not fit. Example: 13 = 8 + 4 + 1 = 1101."],
["Bits and bytes","A bit is one binary digit (0 or 1). A byte is 8 bits. With 4 bits, the largest unsigned value is 15 (1111); with 8 bits it is 255 (11111111)."]
],questions:[
{q:"Which digits are used in binary?",options:["0 and 1","0 to 9","1 and 2"],a:0,why:"Binary is base 2 and uses just 0 and 1."},
{q:"How many bits are in one byte?",options:["2","4","8","10"],a:2,why:"1 byte = 8 bits."},
{q:"Convert binary 1010 to denary.",answer:"10",why:"8 + 2 = 10."},
{q:"Convert binary 1101 to denary.",answer:"13",why:"8 + 4 + 1 = 13."},
{q:"Convert denary 10 to binary (without leading zeroes).",answer:"1010",why:"10 = 8 + 2, so 1010."},
{q:"Convert denary 25 to binary (without leading zeroes).",answer:"11001",why:"25 = 16 + 8 + 1, so 11001."},
{q:"What is the largest unsigned denary value that 4 bits can represent?",answer:"15",why:"1111 = 8 + 4 + 2 + 1 = 15."},
{q:"Why do computers use binary?",options:["Electronic circuits can represent two states reliably","Because 0 and 1 are the only numbers","Because every computer has two processors"],a:0,why:"Two distinct electrical states are straightforward to distinguish reliably."},
{q:"How many bits are needed to represent denary 16 in binary, without leading zeroes?",answer:"5",why:"16 is 10000 in binary, which has five digits."},
{q:"Convert binary 10011 to denary.",answer:"19",why:"16 + 2 + 1 = 19."}
],worksheet:[
"Explain why a computer uses binary.",
"State how many bits are in a byte.",
"Complete the place values:  ___ | ___ | 8 | 4 | 2 | 1.",
"Convert 1010 and 1101 from binary to denary. Show the place values and your addition.",
"Convert 13 and 25 from denary to binary. Show which values you used.",
"Challenge: What is the largest unsigned number possible with 5 bits? Explain."
]}};
let current="home";
let studentName="";
function safeText(value){return String(value).replace(/[&<>"\']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]))}
function todayUK(){return new Intl.DateTimeFormat("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date())}
function startLesson(e){e.preventDefault();const field=document.getElementById("studentNameInput");const entered=field.value.trim().replace(/\s+/g," ");if(!entered){field.focus();return}studentName=entered;render();scrollTo(0,0)}
function namePage(k){const l=lessons[k];return '<div class="breadcrumb"><a href="#unit1">← Unit 1 lessons</a> / Year 7 / Unit 1</div><section class="hero"><div class="eyebrow">Before you begin</div><h1>What is your name?</h1><p>Please enter your name before starting Lesson '+l.num+': '+l.title+'. Your name will be added automatically to your printed catch-up worksheet.</p></section><section class="panel"><form onsubmit="startLesson(event)"><label for="studentNameInput"><strong>Student name</strong></label><p class="small muted">Enter your first name and surname.</p><input id="studentNameInput" name="studentName" type="text" required maxlength="100" autocomplete="name" style="display:block;width:100%;max-width:450px;padding:12px;border:1px solid #aebfcf;border-radius:9px;margin:10px 0 20px"><button class="btn" type="submit">Start lesson →</button></form><p class="small muted" style="margin-top:18px">Your name is only used in this browser while you complete the lesson. It is not sent to a server.</p></section>'}
function go(route){location.hash=route;render();scrollTo(0,0)}
function render(){
  let route=decodeURIComponent(location.hash.replace(/^#/,""))||"home";
  current=lessons[route]?route:(route==="unit1"?"unit1":"home");
  const isLesson=Object.prototype.hasOwnProperty.call(lessons,current);
  document.title=current==="home"?"Year 7 Lost Learning | Computer Science":current==="unit1"?"Unit 1: Choose a lesson | Lost Learning":lessons[current].title+" | Lost Learning";
  document.getElementById("app").innerHTML=current==="home"?homepage():current==="unit1"?unit1Page():(studentName?lessonPage(current):namePage(current));
  document.getElementById("printSheet").innerHTML=isLesson&&studentName?printMarkup(current):"";
  if(isLesson&&studentName)fillQuestions(current);
  if(isLesson&&!studentName)document.getElementById("studentNameInput").focus();
}
const unitCards=[
  {num:1,title:"Under the Hood of a Computer",desc:"Hardware, input and output, memory, storage and binary.",count:2,link:"#unit1"},
  {num:2,title:"Thinking Like a Computer Scientist",desc:"Dr John Snow, evidence, problem-solving and evacuation planning.",count:2,link:"unit2.html"},
  {num:3,title:"E-Safety",desc:"Online friendships, sharing images, passwords and personal information.",count:3,link:"unit3.html"},
  {num:4,title:"Drawing and Manipulating Shapes",desc:"Algorithms, Scratch pen, patterns and Python Turtle.",count:5,link:"unit4.html"},
  {num:5,title:"Creating an Animation",desc:"Dance sequences, Scratch procedures, variables and selection.",count:3,link:"unit5.html"},
  {num:6,title:"Back to the Future",desc:"Alan Turing, Tim Berners-Lee, logic gates and sorting algorithms.",count:4,link:"unit6.html"},
  {num:7,title:"Introduction to Python",desc:"Print, comments, variables, arithmetic and selection.",count:4,link:"unit7.html"},
  {num:8,title:"Spreadsheets",desc:"Formatting, formulas, profit, models, functions and charts.",count:5,link:"unit8.html"}
];
function homepage(){
  return '<section class="hero homepage-hero"><div class="eyebrow">Year 7 · Computer Science</div><h1>Missed a lesson? Catch up here.</h1><p>Find your unit, choose the lesson you missed, and work through the essentials independently. Every lesson includes clear help, questions and printable evidence.</p><div class="steps"><span class="step">1. Choose a unit</span><span class="step">2. Choose a lesson</span><span class="step">3. Learn and practise</span><span class="step">4. Check and print</span></div></section>'
  +'<section class="panel unit-overview"><div class="unit-section-head"><div><span class="pill">Year 7</span><h2 style="margin-top:12px">Choose your unit</h2><p class="muted">Eight units, with a separate catch-up activity for every taught lesson.</p></div><span class="unit-total">28 catch-up lessons</span></div><div class="grid unit-selection-grid">'
  +unitCards.map(u=>'<article class="lesson-card unit-card"><div class="unit-top"><span class="unit-number" aria-hidden="true">'+u.num+'</span><span class="unit-count">'+u.count+' '+(u.count===1?"lesson":"lessons")+'</span></div><h3>Unit '+u.num+': '+safeText(u.title)+'</h3><p class="unit-summary">'+safeText(u.desc)+'</p><a class="btn unit-cta" href="'+u.link+'" aria-label="Choose a lesson from Unit '+u.num+': '+safeText(u.title)+'">Choose a lesson <span aria-hidden="true">→</span></a></article>').join("")
  +'</div></section><section class="panel next-steps"><h2>How to catch up</h2><p><strong>Choose the lesson you missed.</strong> Enter your name, read the explanations and worked examples, then complete the questions. Mark your knowledge check and print or save your work for your Computer Science folder.</p><div class="hint"><strong>Stuck? Get some help here...</strong> Every lesson contains examples and support. Re-read these before trying again.</div></section>';
}
function unit1Page(){
  return '<p class="breadcrumb"><a href="#home">← All Year 7 units</a></p><section class="hero"><div class="eyebrow">Year 7 · Unit 1</div><h1>Under the Hood of a Computer</h1><p>Choose the specific lesson you missed. Each catch-up activity stands on its own.</p><div class="steps"><span class="step">Learn</span><span class="step">Practise</span><span class="step">Check</span><span class="step">Print</span></div></section>'

function lessonPage(k){let l=lessons[k];return '<div class="breadcrumb"><a href="#unit1">← Unit 1 lessons</a> / Year 7 / Unit 1 / Lesson '+l.num+'</div><section class="hero"><div class="eyebrow">Year 7 • Unit 1 • Lesson '+l.num+'</div><h1>'+l.title+'</h1><p>'+l.intro+'</p><span class="pill">About '+l.time+'</span><div class="top-actions"><a class="btn ghost" href="#learn">Start learning ↓</a><button class="btn ghost" onclick="printLesson()">Print catch-up sheet</button></div></section><nav class="lesson-nav" aria-label="Lesson sections"><a href="#learn">Learn</a><a href="#examples">Worked examples</a><a href="#quiz">Self-check quiz</a><a href="#finish">Finish and print</a></nav><section class="panel" id="learn"><span class="eyebrow">Step 1</span><h2>What you need to know</h2>'+l.knowledge.map((x,i)=>'<article style="margin:18px 0"><h3>'+(i+1)+'. '+x[0]+'</h3><p>'+x[1]+'</p></article>').join("")+'</section><section class="panel" id="examples"><span class="eyebrow">Step 2</span><h2>Worked examples</h2>'+(k==="hardware"?hardwareExamples():binaryExamples())+'</section><section class="panel" id="quiz"><span class="eyebrow">Steps 3 and 4</span><h2>Check your understanding</h2><p>Answer all '+l.questions.length+' questions, then select <strong>Mark my answers</strong>. Your feedback will show what to revise.</p><div class="progress" aria-hidden="true"><div id="quizProgress" style="width:0%"></div></div><p id="answered" class="small muted">0 of '+l.questions.length+' answered</p><form id="quizForm"><div id="questions" class="questions"></div><div class="top-actions"><button type="submit" class="btn">Mark my answers</button><button type="button" class="btn secondary" onclick="resetQuiz()">Try again</button></div></form><div id="result" aria-live="polite"></div></section><section class="panel" id="finish"><span class="eyebrow">Step 5</span><h2>Print your catch-up work</h2><p>Print the short worksheet, complete the written questions and put it in your Computer Science folder. The worksheet is clearly titled <strong>Lost Learning - Catchup Work</strong>.</p><button class="btn" onclick="printLesson()">Print A4 worksheet</button><p class="small muted" style="margin-top:12px">Tip: Choose A4 portrait in the print window. If you do not have a printer at home, ask your teacher for a copy.</p></section>'}
function hardwareExamples(){return '<h3>Example A: Classify the hardware</h3><table class="mini-table"><tr><th>Component</th><th>Job</th></tr><tr><td>Keyboard</td><td>Input: enters letters and numbers</td></tr><tr><td>CPU</td><td>Processing: carries out instructions</td></tr><tr><td>RAM</td><td>Memory: temporarily holds working data</td></tr><tr><td>SSD</td><td>Storage: keeps saved files</td></tr><tr><td>Monitor</td><td>Output: displays information</td></tr></table><h3>Example B: A calculator</h3><div class="flow"><div class="node">Input<br><span class="small">3 and 4</span></div><span class="arrow">→</span><div class="node">Process<br><span class="small">Multiply</span></div><span class="arrow">→</span><div class="node">Output<br><span class="small">12</span></div></div><div class="model"><strong>Model answer:</strong> The user enters 3 and 4 using the keys (input). The processor follows instructions to multiply them (process). The answer 12 appears on the display (output).</div><h3>Example C: Explain a touchscreen</h3><div class="model"><strong>Model answer:</strong> A touchscreen is an input device because it detects where the user touches it. It is also an output device because it displays text, images and other information.</div>'}
function binaryExamples(){return '<h3>Example A: Convert binary 1010 to denary</h3><div class="binary-demo"><div><b>128</b><span>0</span></div><div><b>64</b><span>0</span></div><div><b>32</b><span>0</span></div><div><b>16</b><span>0</span></div><div><b>8</b><span>1</span></div><div><b>4</b><span>0</span></div><div><b>2</b><span>1</span></div><div><b>1</b><span>0</span></div></div><div class="model"><strong>Model working:</strong> Add the columns with a 1: 8 + 2 = <strong>10</strong>. So 1010 in binary is 10 in denary.</div><h3>Example B: Convert denary 13 to binary</h3><table class="mini-table"><tr><th>Place value</th><th>Does it fit?</th><th>Bit</th></tr><tr><td>8</td><td>Yes: 13 − 8 = 5</td><td>1</td></tr><tr><td>4</td><td>Yes: 5 − 4 = 1</td><td>1</td></tr><tr><td>2</td><td>No</td><td>0</td></tr><tr><td>1</td><td>Yes: 1 − 1 = 0</td><td>1</td></tr></table><div class="model"><strong>Model answer:</strong> 13 = 8 + 4 + 1, so 13 in denary is <strong>1101</strong> in binary.</div><h3>Example C: Bits and bytes</h3><div class="model"><strong>Model answer:</strong> A byte contains 8 bits. The binary number 10000 needs 5 bits and represents denary 16.</div><div class="hint"><strong>Remember:</strong> Binary columns double as you move left. For 8 bits: 128, 64, 32, 16, 8, 4, 2, 1.</div>'}
function fillQuestions(k){let qs=lessons[k].questions;document.getElementById("questions").innerHTML=qs.map((q,i)=>'<fieldset class="question" id="q'+i+'"><legend>'+(i+1)+'. '+q.q+'</legend>'+(q.options?'<div class="choices">'+q.options.map((opt,j)=>'<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'"> <span>'+opt+'</span></label>').join("")+'</div>':'<label><span class="small muted">Your answer:</span><br><input class="short-answer" name="q'+i+'" inputmode="text" autocomplete="off" placeholder="Type your answer"></label>')+'<div class="feedback hidden" id="f'+i+'"></div></fieldset>').join("");document.getElementById("quizForm").addEventListener("submit",markQuiz);document.getElementById("quizForm").addEventListener("input",updateProgress);document.getElementById("quizForm").addEventListener("change",updateProgress)}
function answers(){return lessons[current].questions.map((q,i)=>{let selected=document.querySelector('input[name="q'+i+'"]:checked');let typed=document.querySelector('.short-answer[name="q'+i+'"]');return q.options?(selected?selected.value:null):(typed?typed.value.trim():null)})}
function updateProgress(){let a=answers(),n=a.filter(v=>v!==null&&v!=="").length;document.getElementById("answered").textContent=n+" of "+a.length+" answered";document.getElementById("quizProgress").style.width=(n/a.length*100)+"%"}
function markQuiz(e){e.preventDefault();let qs=lessons[current].questions,a=answers(),missing=a.findIndex(v=>v===null||v==="");if(missing!==-1){document.getElementById("result").innerHTML='<div class="feedback bad">Please answer every question before marking. You have '+(qs.length-a.filter(x=>x!==null&&x!=="").length)+' left.</div>';document.getElementById("q"+missing).scrollIntoView({behavior:"smooth",block:"center"});return}let score=0;qs.forEach((q,i)=>{let correct=q.options?Number(a[i])===q.a:a[i].replace(/\s/g,"").toLowerCase()===q.answer.toLowerCase();if(correct)score++;let f=document.getElementById("f"+i);f.className="feedback "+(correct?"ok":"bad");f.textContent=(correct?"✓ Correct. ":"✗ Not quite. ")+q.why});document.getElementById("result").innerHTML='<div class="feedback '+(score===qs.length?"ok":"bad")+'" role="status"><div class="score">Your score: '+score+' / '+qs.length+' ('+Math.round(score/qs.length*100)+'%)</div><p>'+(score===qs.length?"Excellent, you have answered everything correctly.":"Read the feedback for any questions you missed, review those sections and try again.")+'</p><button class="btn secondary" type="button" onclick="document.getElementById(\'finish\').scrollIntoView({behavior:\'smooth\'})">Continue to printing ↓</button></div>';document.getElementById("result").scrollIntoView({behavior:"smooth",block:"center"})}
function resetQuiz(){document.getElementById("quizForm").reset();document.querySelectorAll(".feedback[id^=f]").forEach(x=>{x.className="feedback hidden";x.textContent=""});document.getElementById("result").innerHTML="";updateProgress();document.getElementById("quiz").scrollIntoView({behavior:"smooth"})}
function printMarkup(k){let l=lessons[k];return '<h1>Lost Learning - Catchup Work</h1><p><strong>Year 7 • Unit 1: Under the Hood of a Computer • Lesson '+l.num+': '+l.title+'</strong></p><div class="meta"><span>Name: '+safeText(studentName)+'</span><span>Date: '+todayUK()+'</span></div><p><strong>Instructions:</strong> Use the online lesson to help you answer these questions. Show your working where needed. Complete and place in your Computer Science folder.</p><h2>Essential knowledge</h2>'+(k==="hardware"?'<p>Input → Processing → Output. RAM is temporary memory; an SSD or hard disk provides longer-term storage.</p>':'<p>Binary uses 0 and 1. Place values: 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1. A byte contains 8 bits.</p>')+'<h2>Questions</h2>'+l.worksheet.map((q,i)=>'<div class="task"><strong>'+(i+1)+'. '+q+'</strong><div class="line"></div>'+(i===3||i===4?'<div class="line"></div>':'')+'</div>').join("")+'<div class="tick">Self-check: □ I read the explanations. &nbsp; □ I completed the online quiz. &nbsp; □ I checked my answers.<br><br>Quiz score: ______ / '+l.questions.length+' &nbsp;&nbsp; One thing I understand better now: __________________________________</div>'}
function printLesson(){if(!studentName){render();return}document.getElementById("printSheet").innerHTML=printMarkup(current);window.print()}
