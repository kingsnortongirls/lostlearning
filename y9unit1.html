<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 9 Unit 1: Computer Systems | Lost Learning</title><meta name="description" content="Eight Year 9 computer systems catch-up lessons."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year9.html">← Year 9 Lost Learning</a><a href="./">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Year 9 Computer Science</footer><script>window.LOST_UNIT={"year":9,"num":1,"title":"Computer Systems","icon":"cpu","intro":"Learn how computer hardware and software work together, how data is stored and why computing has legal and environmental impacts.","revision":"https://kingsnortongirls.github.io/revision/y9u1.html","support":[],"lessons":[{"title":"What Is a Computer? Inputs, Processing and Outputs","objective":"Explain what makes a device a computer and distinguish inputs, processing and outputs.","learn":[["Computers come in many forms","A computer is a programmable device that receives data, processes it according to instructions and produces an output. A smartwatch, games console or car controller can perform computing even if it does not resemble a desktop PC."],["The input-process-output cycle","**Input** brings data or instructions into a system, **processing** changes or evaluates that data, and **output** communicates the result. Some systems also store the result for later use."],["Identify less obvious input and output","Inputs can include keyboards, microphones, cameras, touchscreens and sensors. Outputs include screens, speakers, motors and indicator lights. A touchscreen can serve as both input and output."],["Explain the role of components","The processor executes instructions. RAM holds working data temporarily, while secondary storage retains files. Peripheral devices connect to provide inputs and outputs."]],"example":["A smartwatch is a computer","A smartwatch detects a pulse using a **sensor (input)**, uses a processor to interpret its readings (**processing**), then shows a heart-rate value on the screen (**output)**. The watch is a computer despite its small size."],"tasks":[["Explain why a **smartwatch** and a **car parking sensor** can each be considered part of a computer system.","Identify the input, processing and output for each."],["Classify **keyboard, screen, camera, speaker, touchscreen and temperature sensor** as input, output or both. Explain two decisions.","Input enters data; output presents a result. Touchscreens are both."],["Write a detailed input-process-output explanation for a **self-service checkout**, including the processor's role.","Barcode scanner → processing item and price → display or receipt."]],"challenge":"Compare a traditional desktop PC with a smart device. Explain why both are computers even though their forms and interfaces differ.","quiz":[["What is processing?",["Using instructions to transform or analyse data","Only typing on a keyboard","Deleting the screen"],0,"The processor follows instructions to handle data."],["Which is an input device?",["Microphone","Speaker","Monitor"],0,"Microphones capture sound input."],["A touchscreen is usually...",["Both input and output","Only storage","Only processing"],0,"It displays information and detects touch."],["Which is an output for a car parking sensor?",["Audible warning","Distance sensor reading","A switch press"],0,"The warning presents the processed result."]]},{"title":"Peripherals and Components Inside the Base Unit","objective":"Describe common and less common peripherals, CPU, RAM and storage, with their roles in a computer system.","learn":[["Peripherals","A **peripheral** is a device connected to the computer to provide an extra function. Examples include keyboards, printers, cameras, scanners and external storage. Some are input devices, some output devices and some both."],["CPU and RAM","The **CPU** fetches, decodes and executes instructions. **RAM** temporarily stores active programs and working data. RAM is volatile, so its contents normally disappear when power is lost."],["Secondary storage","A hard drive or SSD stores programs and files when the computer is off. It is different from RAM: it is normally slower to access but retains information without power."],["Devices can perform more than one role","An all-in-one printer can scan documents (input) and print them (output). A headset may use a microphone for input and headphones for output. The correct classification depends on the function described."]],"example":["Analyse an all-in-one printer","A scanner captures an image and sends data to a computer, so it is **input**. Printing a document creates an **output**. The same physical device can contain both kinds of component."],"tasks":[["Describe the jobs of **CPU, RAM, SSD and motherboard**, using one full sentence for each.","CPU processes instructions; RAM stores live work; SSD stores files; motherboard connects components."],["Create a comparison chart for **eight peripherals**, stating whether each provides input, output or both and its purpose.","Include examples beyond keyboard and monitor, such as scanners, microphones and 3D printers."],["Explain how data travels through a system when a user scans and prints a photograph.","Input via scanner, processing by software/CPU, storage if saved, and output via printer."]],"challenge":"Recommend a set of peripherals for a student producing podcasts. Justify the input and output devices chosen.","quiz":[["Which device executes program instructions?",["CPU","RAM","Printer"],0,"The CPU processes instructions."],["What is RAM mostly used for?",["Temporary working memory","Permanent offline backup","Displaying sound"],0,"RAM stores data and instructions in use."],["Which is a secondary storage device?",["SSD","Mouse","Monitor"],0,"An SSD retains files when power is off."],["Which part of an all-in-one printer captures paper documents?",["Scanner","Speaker","Display"],0,"Scanning is an input function."]]},{"title":"Operating Systems and Their Functions","objective":"Explain why computers need operating systems and compare their main features and licensing.","learn":[["What is an operating system?","An OS is system software that manages a device's hardware and provides the environment in which applications run. Without an OS, everyday tasks would require users to interact with low-level hardware directly."],["Manage hardware and software","The OS allocates CPU time and memory, manages running processes and files, provides security controls and uses **device drivers** to communicate with peripherals."],["Examples and interfaces","Windows, macOS, Linux, Android and iOS are operating systems. GUIs use windows, icons, menus and a pointer or touchscreen; command-line interfaces use typed commands."],["Open-source versus proprietary","Open-source licences permit access to and modification of source code under defined terms; proprietary systems restrict access and redistribution. Suitability also depends on application compatibility and support."]],"example":["Choose an OS for a situation","A school needs managed accounts, supported productivity applications and printer compatibility. A suitable OS should meet these requirements, not simply be the one a pupil uses at home."],"tasks":[["List **five operating systems** and identify one type of device on which each is commonly used.","Windows/macOS/Linux on PCs; Android/iOS on mobile devices."],["Explain **four functions of an OS**, including device drivers and memory management.","Each answer should say *why* that function matters."],["Recommend an OS for a **fictional school or library**, justifying two requirements and one potential limitation.","Consider compatibility, budget, account management and accessibility."]],"challenge":"Explain why a brand of laptop is not itself an operating system and why one OS may not run every application.","quiz":[["What does a device driver help with?",["Communication between OS and hardware","Creating random passwords","Only drawing charts"],0,"Drivers help the OS control hardware."],["Which is an operating system?",["Linux","Word","Photopea"],0,"Linux is an OS; the others are applications."],["Which is a main OS function?",["Memory and process management","Writing every essay","Replacing every peripheral"],0,"The OS allocates system resources."],["Which factor matters when choosing an OS?",["Required application compatibility","Logo colour only","Alphabetical order"],0,"Compatibility affects whether tasks can be completed."]]},{"title":"Utility, Application and System Software","objective":"Distinguish software categories, explain system maintenance tools and evaluate off-the-shelf against custom software.","learn":[["Three kinds of software","**System software** includes the operating system. **Application software** performs user tasks, such as word processing. **Utility software** helps maintain, protect or manage the system."],["Common utilities","Antimalware tools check for threats; backup utilities protect against file loss; compression tools reduce or package data; disk management and clean-up tools help organise storage. Different tools solve different problems."],["Security and updates","Updates can fix vulnerabilities and faults. Automatic updates can improve security, but users and organisations may schedule them to avoid interruptions or compatibility issues."],["Off-the-shelf and custom software","Off-the-shelf products are ready-made for many customers and can cost less initially. **Custom-written** software is designed for one organisation's requirements but usually costs more and needs ongoing maintenance."]],"example":["Choose software for a school","A school might use an off-the-shelf spreadsheet to calculate grades because it is available quickly. A custom-built assessment system could match unique requirements but may be expensive to design and maintain."],"tasks":[["Create a table with **three examples each** of system, application and utility software, explaining why they fit.","Be precise: file backup is a utility task, writing a letter is an application task."],["Describe **four utility functions** and explain why regular maintenance matters.","Think about backup, antimalware, compression and system updates."],["Compare **off-the-shelf** and **custom-written software** for a fictional company. Include two advantages and two disadvantages.","Consider cost, time to deploy, support, flexibility and ownership."]],"challenge":"Discuss a situation in which a customised solution would be justified despite the higher development cost.","quiz":[["Which software helps maintain or protect a computer?",["Utility software","Only games","A photograph"],0,"Utilities support maintenance and protection."],["Which is an application?",["A word processor","The CPU","RAM"],0,"Applications carry out end-user tasks."],["What is an advantage of off-the-shelf software?",["It is ready for many users","It always fits every requirement perfectly","It is never updated"],0,"Ready-made products are usually quicker to deploy."],["Why update software?",["To fix bugs and security issues","To stop every programme working","To delete all files"],0,"Updates often provide corrections and security fixes."]]},{"title":"RAM, ROM, Cache and Computer Performance","objective":"Compare primary memory types and explain how the CPU, cache and startup firmware affect performance.","learn":[["RAM versus ROM","**RAM** stores currently used programs and data and normally loses contents on power loss. **ROM** or non-volatile firmware stores instructions needed by the device even when switched off."],["BIOS and UEFI","Traditional BIOS and modern UEFI firmware initialise hardware and start the process of loading an operating system. Modern computers commonly use UEFI rather than the original BIOS design."],["Cache memory","CPU cache is small, fast memory close to the processor. It holds frequently needed data and instructions so the CPU may not have to wait for slower main memory as often."],["Performance factors","CPU clock speed, number of cores, cache, RAM capacity and storage speed all affect performance depending on the task. More RAM can help prevent excessive swapping, but is not always the bottleneck."]],"example":["Why unsaved work is lost","A pupil edits a document held in working memory. If the computer crashes before saving, the latest changes may not have been written to secondary storage. The saved version can survive while newer RAM contents are lost."],"tasks":[["Compare **RAM, ROM/firmware and cache** by purpose, speed and whether data is retained when powered off.","RAM is volatile; firmware is non-volatile; cache is a fast temporary CPU memory."],["Explain **three tasks** performed by BIOS/UEFI during startup.","Consider hardware checks, initialisation and handing control to a bootloader."],["A computer has a slow hard drive and too little RAM. Explain **two possible performance improvements** and when they might help.","An SSD may improve file loading; more RAM may reduce swapping; benefits depend on workload."]],"challenge":"Explain why adding more CPU cores does not guarantee twice the speed in every program.","quiz":[["Which normally loses working contents when powered off?",["RAM","SSD","Firmware"],0,"RAM is volatile."],["Why is cache useful?",["It keeps frequently used information close to CPU","It replaces all long-term storage","It is a screen setting"],0,"Cache reduces time waiting for main memory."],["What starts hardware initialisation before an OS loads?",["BIOS/UEFI firmware","A word processor","A browser bookmark"],0,"Firmware starts the boot process."],["Which factor can affect performance?",["Clock speed and number of cores","Case colour only","Monitor wallpaper"],0,"Processor features affect some workloads."]]},{"title":"Secondary and Cloud Storage","objective":"Compare optical, magnetic, solid-state and cloud storage, calculating capacity and recommending devices.","learn":[["Why secondary storage is needed","Secondary storage retains files and software when the computer is off. It complements RAM rather than replacing it."],["Storage technologies","**Magnetic** devices include hard disk drives; **solid-state** devices include SSDs and USB flash drives; **optical** media include CDs and DVDs. They differ in speed, cost, capacity and durability."],["Compare using criteria","Consider **capacity, speed, reliability, portability, durability and cost**. No single storage device is best for every requirement."],["Cloud storage","Cloud services store data on remote servers accessed across a network. Benefits include remote access and sharing; drawbacks include dependence on network access and questions about privacy, provider availability and ongoing cost."],["Calculate capacity","Multiply the number of files by their size. For example, 500 × 300 MB = 150,000 MB, approximately 150 GB using decimal units."]],"example":["Select storage for a school video project","A pupil with 150 GB of video would struggle to fit it on ordinary DVD discs. A suitably sized SSD or reliable cloud service may be more practical, depending on access, portability and backups."],"tasks":[["Compare **HDD, SSD, USB flash drive, DVD and cloud storage** against four useful criteria.","Think about capacity, speed, portability and connection requirements."],["Calculate storage for **250 photos at 8 MB each** and **60 videos at 500 MB each**. Show your working.","Multiply quantity × size, then add totals. Decide whether an advertised 32 GB device is enough."],["Recommend a storage solution for someone who needs to transport a **100 GB project** and keep a safe backup.","Justify the capacity, durability, portability and separate backup."]],"challenge":"Explain why a copy of your files saved to a second folder on the same failing drive may not count as an adequate backup.","quiz":[["Which storage usually retains data without power?",["SSD","RAM only","CPU cache only"],0,"Secondary storage is non-volatile."],["Which is magnetic storage?",["Hard disk drive","DVD","Monitor"],0,"Hard disks use magnetic recording."],["What can be a disadvantage of cloud storage?",["Dependence on connectivity","It never requires a user account","It only stores text"],0,"Access typically depends on the network and provider."],["What is 200 files × 10 MB?",["2000 MB","20 MB","200 MB"],0,"200 × 10 = 2000 MB."]]},{"title":"Computer Legislation","objective":"Explain key UK computer laws and create a clear information leaflet or poster for younger pupils.","learn":[["Why laws matter","Technology creates questions about intellectual property, personal information and accessing other people's systems. UK legislation helps set responsibilities and consequences."],["Copyright, Designs and Patents Act 1988","The **CDPA** protects creators' rights in original works such as software, music, images and writing. Copying or distributing protected work without permission may infringe copyright."],["Data Protection Act 2018 and UK GDPR","Personal data must be handled lawfully and appropriately. Organisations have responsibilities including transparency, security and data minimisation."],["Computer Misuse Act 1990","The **CMA** covers offences involving unauthorised access and certain interference with computers. Knowing or guessing a password does not mean you have permission."],["Communicate accurately","An information poster needs an audience, concise explanations, practical examples and responsible advice. Explain the main purpose of each law instead of just listing initials."]],"example":["A law for each scenario","Sharing a copyrighted photograph without licence → potentially **CDPA**.\nMishandling a list of pupils' personal information → **data protection**.\nAccessing another person's account without permission → potentially **CMA**."],"tasks":[["Write a **two-sentence explanation** of each of the three acts, identifying what it protects.","CDPA: creative work; DPA/UK GDPR: personal data; CMA: computer systems and access."],["Match **three fictional situations** to the most relevant act and justify each choice.","Use a scenario involving copied music, lost customer data and an accessed account."],["Plan an **A4 poster for Year 7 students** explaining any two acts with examples and advice. Describe or make it in Word, PowerPoint or Canva.","Use a short heading, a clear legal purpose, a realistic example and one safety tip for each act."]],"challenge":"Explain why the same action might raise more than one legal issue, for example when stolen personal data includes copyrighted work.","quiz":[["Which act is mainly associated with copyright?",["CDPA 1988","CMA 1990","Road Traffic Act"],0,"The Copyright, Designs and Patents Act protects creative rights."],["Which law addresses certain unauthorised access offences?",["Computer Misuse Act 1990","CDPA only","A school timetable"],0,"The CMA covers unauthorised access and interference offences."],["Which area is covered by UK data protection law?",["Handling personal information","Screen brightness","Mouse colour"],0,"Personal data must be handled lawfully."],["Does finding a password grant permission?",["No","Always","Only at weekends"],0,"Permission is separate from technical access."]]},{"title":"Ethical and Environmental Issues","objective":"Evaluate how computing affects people and the environment, including privacy, e-waste and the reduce-reuse-recycle approach.","learn":[["Computing changes society","Computers help people communicate, travel, access medical services and learn. They can also create risks around surveillance, privacy, dependence and exclusion."],["Ethical decisions","An **ethical issue** asks what is right or fair, not just what is technically possible. Consider different stakeholders such as users, companies, workers and the wider public."],["What is e-waste?","Electronic waste includes unwanted phones, computers and other electrical devices. Some contain hazardous materials and should be processed through appropriate collection and recycling routes."],["Reduce, reuse, recycle","**Reduce** unnecessary purchases, **reuse** or repair working devices and **recycle** responsibly at end of life. The WEEE framework addresses collection and treatment of electrical equipment."],["Balancing environmental choices","Keeping a functioning device can reduce manufacturing impacts. Replacing a very inefficient device may sometimes bring benefits. Compare the whole lifecycle rather than assuming one choice is always best."]],"example":["A class has 20 old laptops","The school could assess whether the laptops can be repaired or redeployed before buying replacements. Unusable devices should go through approved WEEE recycling rather than ordinary waste. Securely erase personal data before disposal."],"tasks":[["Describe **three positive and three negative effects** of computers on modern society.","Consider transport, healthcare, communication, privacy, accessibility and e-waste."],["Explain the terms **reduce, reuse, recycle and e-waste** and give one realistic example for each.","Think about keeping a phone longer, repairing a device and taking broken electronics to an approved collection point."],["A school is replacing its computers. Write a **balanced recommendation** that considers cost, learning, environmental impact and secure disposal.","Consider upgrades, repairs, energy use, data erasure and proper recycling."]],"challenge":"Evaluate whether buying a more energy-efficient computer can ever be environmentally preferable to keeping an older functioning machine.","quiz":[["What does e-waste mean?",["Discarded electronic equipment","Only paper documents","Food waste"],0,"E-waste is electrical and electronic waste."],["Which step often avoids unnecessary manufacturing?",["Reuse or repair","Throw away working devices","Replace everything yearly"],0,"Using devices longer can reduce waste."],["What should happen before disposing of a computer?",["Personal data should be securely erased","Passwords should be printed on it","Its screen should be painted"],0,"Data must be protected during disposal."],["What is an ethical question about technology?",["Whether a choice is fair and responsible","Only how quickly code runs","Only what colour the keyboard is"],0,"Ethics concerns rights, fairness and impacts."]]}]};</script><script src="catchup.js"></script></body></html>
