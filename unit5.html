<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 7 Unit 5 · Creating an Animation | Lost Learning</title><meta name="description" content="Year 7 Creating an Animation independent catch-up lessons."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="./">← Lost Learning | Computer Science</a><small>Year 7 · Unit 5</small></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"num":5,"title":"Creating an Animation","intro":"Use Scratch to plan, animate and control a dance sequence with precise algorithms.","revision":"https://kingsnortongirls.github.io/revision/y7u4and5.html","lessons":[{"title":"Algorithms and Your Scratch Dancer","objective":"Identify tasks suited to humans or computers and plan precise dance instructions in Scratch.","learn":[["Humans, robots and computers","Humans may be better at creative judgement and responding flexibly to unusual situations. Computers can repeat precise programmed steps quickly and consistently. People design the instructions computers follow."],["A dance is an algorithm","An algorithm is a sequence of precise steps. 'Make the sprite dance' is vague; 'move 20 steps, wait 0.2 seconds, turn 30°' is clearer and testable."],["Sprites, backdrops and costumes","A sprite is a character or object on the Scratch stage. A backdrop sets the scene. Changing a sprite's costume can make an animation look like movement."],["Sequence and timing","Blocks run in order. Commands such as 'move', 'turn', 'next costume' and 'wait' help create a recognisable routine. Too little waiting may make an animation difficult to see."]],"example":["A simple Scratch break-dance","when green flag clicked\nswitch backdrop to Dance Floor\nrepeat (4)\n  next costume\n  turn (90) degrees\n  wait (0.3) seconds\nThe same movement is performed four times with a pause between costume changes."],"tasks":[["Give **three tasks** that humans often perform better and **three tasks** that computers or robots perform better. Explain one choice.","Think about creativity, empathy, repetitive calculations and precision. Context can change the best choice."],["Plan a four-step dance routine for a Scratch sprite. Write each instruction precisely, including movement, turns or waits.","Example: move 20 steps; turn clockwise 30°; change costume; wait 0.3 seconds."],["Open Scratch and create a dancer with a suitable sprite and backdrop. Describe your first movement sequence and how you tested it.","Use 'when green flag clicked', move, wait, next costume or turn blocks. Add a screenshot if possible."]],"challenge":"Plan and describe a second dancer moving in time with the first dancer. Explain how timing will keep both routines synchronised.","quiz":[["What is an algorithm?",["A clear sequence of instructions","A computer's casing","A random guess"],0,"Algorithms use ordered steps."],["What is a sprite in Scratch?",["An object or character on the stage","A computer cable","The saved password"],0,"A sprite is programmed with blocks."],["Which instruction is most precise?",["Dance nicely","Turn clockwise 90 degrees","Do something exciting"],1,"Specific movements can be followed accurately."],["Why might a dancer need a wait block?",["To make movements visible at the right pace","To delete its sprite","To stop all code"],0,"Wait controls the timing of an animation."]]},{"title":"Loops and Procedures for Dance Sequences","objective":"Use repeat blocks and procedures to make a Scratch dance efficient and reusable.","learn":[["Recognise repeating moves","A real dance often repeats a short pattern of movement. Pattern recognition helps turn this into a loop instead of repeated individual code blocks."],["Iteration","Iteration means repetition. A `repeat (4)` block can perform the same shuffle or jump four times, making code shorter and easier to check."],["Procedures","A procedure is a named group of instructions you can run when needed. In Scratch, use 'My Blocks' then 'Make a Block' to create a procedure such as `shuffle`. A procedure can contain a repeat loop."],["Build a complete routine","Create separate components, such as jump, shuffle and spin, then call the blocks in the order needed. Use a sequence and sensible wait blocks to control timing."]],"example":["A Scratch procedure","Create a My Block called 'shuffle'. Under 'define shuffle', place:\nrepeat (4)\n  move (15) steps\n  next costume\n  wait (0.2) seconds\nThen place 'shuffle' in your main script to run it. You can call it more than once."],"tasks":[["Explain why a **repeat block** is better than copying the same six movement blocks four times.","Think about shorter code, fewer mistakes and easier changes."],["Build or describe **three dance procedures** in Scratch: shuffle, jump and spin. Say what blocks each would contain.","Try creating blocks under My Blocks. Each can have movement and wait instructions."],["Arrange your procedures into a complete dance. Explain the order and how you used a repeat loop.","Call the procedures one after another. Use waits to keep the movements at a clear pace."]],"challenge":"Create five named dance procedures, including one that calls another procedure. Explain why a large program benefits from this structure.","quiz":[["What does iteration mean?",["Repeating instructions","Saving an image","Deleting a variable"],0,"Iteration repeats instructions."],["What is a Scratch custom block useful for?",["Grouping instructions into a reusable procedure","Storing real passwords","Changing the computer clock"],0,"My Blocks creates reusable procedures."],["How would you run a named procedure?",["Call its block from your main script","Close the stage","Remove the sprites"],0,"A procedure runs when called."],["Why split a long animation into procedures?",["To make code clearer and easier to reuse","To make it impossible to edit","To remove all repetition"],0,"Procedures support readable, reusable programs."]]},{"title":"Variables, Selection and Controlling a Dance","objective":"Use variables, questions and selection to control an animation and count repetitions.","learn":[["Variables store values","A variable is a named location for a value. For example, create a Scratch variable called `danceCount` and set it to 0 when the green flag is clicked."],["Counters","A counter changes as a task repeats. Add 'change danceCount by 1' after each completed dance sequence, so the animation can display how many dances have run."],["Input and selection","Scratch can ask a question and store the answer. An `if ... then ... else` block chooses between two paths depending on a condition, such as whether the answer equals 'yes'."],["Timing and testing","A program can repeat a sequence until a condition changes or a time limit is reached. Test both the yes and no cases and check that the counter increases at the correct moment."]],"example":["Control the dance with a question","when green flag clicked\nset [danceCount] to (0)\nask [Shall I dance? yes/no] and wait\nif \u003c(answer) = [yes]> then\n  repeat (3)\n    shuffle\n    change [danceCount] by (1)\nelse\n  say [Maybe later!]"],"tasks":[["Explain what a **variable** and **counter** are, then write how `danceCount` should be updated after each dance.","Start at zero. Add one after each complete routine."],["Build or describe a Scratch script that asks whether to start dancing. Explain what it should do for both 'yes' and 'no'.","Use 'ask and wait' and 'if then else'. Check the user's answer."],["Test your program with two different inputs. Record what you expected to happen and what happened.","Try 'yes' and 'no'. Check whether the correct branch executes."]],"challenge":"Describe how to stop the dance after 60 seconds. Consider the Scratch timer and a repeat-until condition.","quiz":[["What does a variable do?",["Stores a value that can change","Only changes the background colour","Makes a computer faster"],0,"Variables hold values used by a program."],["How should a dance counter change each time a routine finishes?",["Increase by 1","Reset to -100","Never change"],0,"A counter tracks repetitions."],["Which Scratch block chooses between two paths?",["if then else","pen down","move steps"],0,"Selection chooses instructions based on a condition."],["Why test both yes and no responses?",["To check both possible paths work","To make the program longer","To erase mistakes automatically"],0,"Testing different cases checks the selection."]]}],"support":[["Open Scratch editor","https://scratch.mit.edu/projects/editor/"]]};</script><script src="catchup.js"></script></body></html>
