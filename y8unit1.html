<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 8 Unit 1: Operating Systems | Lost Learning</title><meta name="description" content="Year 8 Unit 1 lesson-by-lesson catch-up resources."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year8.html" style="color:white;text-decoration:none;font-weight:850">← Year 8 Lost Learning</a><a href="./" style="color:#d5ecfb;text-decoration:none;font-size:.9rem">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"year":8,"num":1,"title":"Operating Systems","intro":"Learn why computers need operating systems and how to compare them for different devices.","revision":"https://kingsnortongirls.github.io/revision/y8u1and2.html","support":[],"lessons":[{"title":"What Is an Operating System?","objective":"Describe the purpose of an operating system, identify different operating systems and recognise GUI features.","learn":[["System software and application software","An **operating system (OS)** is system software that manages the computer's hardware and software resources and provides ways for people to use the device. Applications, such as word processors, run on top of an OS. A brand of device is not automatically the name of its OS."],["Main jobs of an OS","An OS manages files and folders, memory, processes, input and output devices and user accounts. It helps applications use the hardware safely and shares resources between programs."],["GUI and WIMP","A **graphical user interface (GUI)** uses pictures and on-screen controls. **WIMP** describes Windows, Icons, Menus and Pointer. Windows and macOS commonly offer graphical desktops; Linux can offer a graphical desktop or a command line."],["Different devices use different systems","Examples include Windows, macOS and Linux on computers, Android and iOS on mobile devices, and other operating systems embedded in consoles or smart devices. A device may support more than one type of OS."]],"example":["Compare operating system and application","A **web browser** is an application that a person uses to access the Web. **Windows** or **Linux** is an operating system that manages the underlying computer. The browser needs the OS to run, and the OS helps it access memory, files and network hardware."],"tasks":[["Identify **four different operating systems** and give a device that can use each.","Examples: Windows on a laptop; Android on a phone; iOS on an iPhone; Linux on a desktop or server."],["Explain **three jobs** of an operating system and describe why each job is important.","Consider controlling the processor, memory, files, devices and user accounts."],["Sketch or describe a GUI. Clearly label **Windows, Icons, Menus and Pointer** and explain the purpose of each.","A window holds an app; an icon represents an item; a menu lists commands; the pointer selects objects."]],"challenge":"Explain why a computer with a powerful processor would still be difficult to use without an operating system.","quiz":[["Which is system software?",["Microsoft Word","An operating system","A photograph"],1,"An operating system manages computer resources."],["What does WIMP stand for?",["Windows, Icons, Menus, Pointer","Web, Internet, Memory, Processor","Windows, Input, Microphone, Printer"],0,"WIMP names common graphical interface elements."],["Which is normally a job of an operating system?",["Managing memory and files","Writing every email for the user","Inventing websites"],0,"The OS manages resources including memory and files."],["Which statement is correct?",["Samsung is itself an operating system","A device brand and an OS are always the same","A manufacturer's device may use Android or another OS"],2,"Device manufacturers and operating systems are different concepts."]]},{"title":"Comparing Operating Systems","objective":"Compare operating systems and recommend suitable choices for different users, including open-source and proprietary licensing.","learn":[["Not every OS is the same","Operating systems vary in interface, available applications, security controls, hardware compatibility and update policies. Some are aimed at desktops, others at mobile devices or servers."],["Open-source and proprietary","Open-source software makes its source code available under a licence permitting inspection, modification or redistribution under stated conditions. **Proprietary** software is controlled by its rights holder, with restrictions on modification or distribution."],["Choosing for a user","Think about what tasks the person needs to do, their device and the required applications. An operating system is not always 'better' for everyone: suitability depends on the requirements."],["Present a clear comparison","A good report uses accurate facts, headings, a comparison table, sensible paragraphs and a justified recommendation. Explain differences rather than simply listing brand names."]],"example":["Choose an OS for a school laptop","A school laptop might need browser access, managed accounts and compatibility with school software. A recommendation should name these needs and compare suitable options, such as Windows and a supported Linux distribution, before deciding. An unsupported OS could cause application or printer problems."],"tasks":[["Create a comparison table for **Windows, macOS, Linux and Android**. Include likely devices, interface and one typical use.","Avoid claiming that an OS only works on a single type of device unless this is genuinely a restriction."],["Explain in your own words what **open-source** and **proprietary** mean. Give an example of each.","Linux is usually distributed under open-source licences; Windows and macOS are proprietary."],["Write a short, formally formatted **recommendation for a fictional user** choosing an OS for schoolwork. Give two reasons.","Think about required apps, school compatibility, cost and supported updates. You can draft in the hub or Word."]],"challenge":"A charity has very old computers and a limited budget. Compare two practical operating-system options and explain one trade-off for each.","quiz":[["What should influence an OS recommendation?",["A person's tasks and device compatibility","Only the colour of its logo","The first option you hear about"],0,"Choice should reflect user needs."],["Which best describes open-source software?",["Code can be inspected and used under the applicable licence","It cannot be changed by anyone","It always costs nothing"],0,"Open source is about licensing and access to source, not necessarily price."],["Which is an example of a proprietary operating system?",["Windows","Most Linux distributions","The Linux kernel"],0,"Windows is proprietary software."],["Why should a comparison report give reasons?",["To justify a recommendation against requirements","To make the font bigger","To avoid mentioning users"],0,"A reasoned recommendation explains why an option fits the scenario."]]}]};</script><script src="catchup.js"></script></body></html>
