<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 7 Unit 3 · E-Safety | Lost Learning</title><meta name="description" content="Year 7 E-Safety lesson-by-lesson catch-up resources."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year7.html">← Year 7 Lost Learning</a><small>Year 7 · Unit 3</small></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"num":3,"title":"E-Safety","intro":"Recognise online risks, protect personal information and know how to get help.","revision":"https://kingsnortongirls.github.io/revision/y7u3.html","lessons":[{"title":"Clare Thought She Knew: Online Friends","objective":"Understand the opportunities and risks of online conversations, recognise grooming behaviours and know where to seek help.","learn":[["Opportunities and risks","Being online helps people keep in touch, learn and find communities. However, people can pretend to be somebody else. A friendly profile or shared interests do not prove someone's identity."],["Recognise grooming","Grooming is when someone builds a young person's trust to manipulate or exploit them. Warning signs can include excessive flattery, gifts, requests for secrecy, pressure to move conversations into private spaces or requests for personal images."],["You can stop the conversation","You do not have to reply, send pictures or keep a secret for anybody. If a message makes you uncomfortable, stop responding, keep appropriate evidence, report or block the account and tell a trusted adult."],["Where to get help","Tell a trusted adult at home or school. You can use the CEOP Safety Centre to report concerns about online sexual abuse or exploitation. Childline is another source of confidential advice for young people. If there is immediate danger, call 999."]],"example":["A fictional online chat","Clare, aged 12, talks to somebody who says he is called Mark. He compliments her, asks her to keep the conversations secret and later requests a revealing webcam image. **Warning signs:** secrecy, pressure and a sexual request. **Safest response:** do not send anything, end contact, report the account and speak to a trusted adult."],"tasks":[["In the fictional Clare and Mark scenario, identify **three warning signs** and explain why each could be risky.","Think about an unknown identity, pressure to keep secrets and requests for images."],["Write **four clear pieces of advice** for a Year 7 pupil who feels uncomfortable in an online conversation.","Include: stop replying, save appropriate evidence, report/block, and tell a trusted adult."],["Explain **two benefits** of online communication and **two ways** to make it safer.","Benefits can include connecting with friends or getting help. Safer habits include privacy controls and not sharing personal details."]],"challenge":"A person says, 'If you really trust me, you will keep our conversations secret.' Explain why this is manipulation and how you would respond safely.","quiz":[["Can a friendly online profile prove who a person really is?",["Yes, always","No, people can misrepresent themselves","Yes, if they have lots of followers"],1,"Profiles can contain false information."],["Which request is an important warning sign?",["Asking about a favourite book","Asking you to keep a risky chat secret","Sharing a public game review"],1,"Pressure to keep unsafe secrets is a warning sign."],["What should you do if someone pressures you for an intimate image?",["Send it so they stop","Stop, report and tell a trusted adult","Share your password"],1,"You do not have to comply with unsafe requests."],["Where can young people report online sexual exploitation concerns?",["CEOP Safety Centre","A random online stranger","A public comment thread"],0,"CEOP provides a reporting route for online child sexual abuse concerns."]]},{"title":"Sharing Images and Password Security","objective":"Explain the risks of sharing intimate images and demonstrate secure password habits.","learn":[["Images can spread","An intimate image shared privately may be copied, forwarded or saved without permission. The person who is affected deserves support, not blame. Never forward an intimate image of a young person, even to 'help'."],["What to do if an image is shared","Do not resend it. Tell a trusted adult, report the content to the platform and seek help from Childline or CEOP where appropriate. Laws concerning intimate images of under-18s are serious and can be complex."],["Password security","A strong password or passphrase is long, unique and hard for others to guess. Reusing the same password on several services is risky: if one service is breached, other accounts may be exposed."],["Extra protection","Use multi-factor authentication (MFA) when available and keep recovery details secure. Never share your real password with friends or type it into this catch-up lesson."]],"example":["A safer passphrase","Instead of 'password123' or your birthday, build a **long, unique passphrase** using several unrelated words and extra characters. This is just a method, not a password to copy. Use your school's approved password guidance."],"tasks":[["Explain **three possible consequences** if a private image is shared without consent, and suggest a safe action in each case.","Consider loss of control, emotional harm, bullying and reporting. Do not include any actual private images."],["Write a short guide explaining **four rules** for creating and protecting passwords.","Think: long, unique, private and protected with MFA where available."],["A friend receives an embarrassing image of another pupil. Explain what they should and should **not** do.","Do not forward, download or circulate it. Seek support and report it safely."]],"challenge":"Explain why a long unique passphrase plus MFA is stronger than using the same short password on every account.","quiz":[["What is a risk of sending a private image?",["You always keep complete control of it","It may be copied or forwarded","It automatically disappears for everybody"],1,"The sender may lose control of where it goes."],["What should you do with an intimate image of a young person sent to you?",["Forward it to friends","Avoid forwarding it and report/seek help","Post it as a warning"],1,"Do not redistribute the image."],["Which password practice is safest?",["Reusing a short password","Using a long unique passphrase","Sharing your password with a friend"],1,"Long, unique credentials reduce risk."],["What does MFA provide?",["An extra check beyond your password","A way to make every password public","A guarantee no account can be hacked"],0,"MFA adds another layer of account protection."]]},{"title":"Personal Information and Reporting","objective":"Identify personal information, understand digital footprints and choose safe ways to report harmful content.","learn":[["Personal information","A name, home address, date of birth, telephone number, precise location, school details and account identifiers can help identify or contact a person. Several harmless-looking details may become identifying when combined."],["Digital footprint","Your digital footprint is the information you leave through online activities, including posts, photographs, comments and records kept by services. Deleting a post does not guarantee every copy has gone."],["Checking a fictional profile","Before posting, consider who can view your information, whether it gives away your location and whether the post could harm you or somebody else. Privacy settings help but do not make sharing risk-free."],["Reporting is responsible","You can report bullying, harassment, harmful content and suspicious accounts through a platform's report tools. For serious concerns, speak with a trusted adult. The Internet Watch Foundation has a reporting service for child sexual abuse imagery."]],"example":["Check a fictional profile","Profile: 'Sam, aged 12, lives at 15 Example Street, meets friends outside Park Lane School at 3.20 pm.' **Risk:** address, school, age and routine reveal identifying information. **Improvement:** remove these details and adjust privacy settings."],"tasks":[["Create a **fictional** social media profile with a made-up name and safe interests. Explain **four details** that you deliberately left out.","Do not include your real address, school, contact details, passwords or date of birth."],["Explain **three ways** a digital footprint can be created, even when you did not deliberately make a public post.","Consider comments, tags and posts or images shared by other people."],["Describe the steps you would take to report bullying or inappropriate content on an online platform.","Use the platform's reporting tools and tell a trusted adult. Do not approach the person spreading it."]],"challenge":"Explain why a photograph may reveal personal information even when there is no caption. Consider backgrounds, uniforms and location details.","quiz":[["Which is personal information?",["A favourite colour","Your home address","A fictional animal name"],1,"An address can identify where someone lives."],["What is a digital footprint?",["Information left by your online activities","A shoe print","A computer model"],0,"Online activities create a record or trace."],["Do privacy settings remove every online risk?",["Yes","No","Only for videos"],1,"Settings help, but content can still be copied or misused."],["What is an appropriate response to online bullying?",["Report it and tell a trusted adult","Publicly share the bully's address","Join in"],0,"Use reporting routes and ask for help."]]}],"support":[["CEOP: online abuse advice and reporting","https://www.ceop.police.uk/Safety-Centre/"],["Childline: staying safe online","https://www.childline.org.uk/info-advice/bullying-abuse-safety/online-mobile-safety/staying-safe-online"],["Childline: Report Remove","https://www.childline.org.uk/remove"]]};</script><script src="catchup.js"></script></body></html>
