<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 8 Unit 4: Flowol | Lost Learning</title><meta name="description" content="Catch up independently on Flowol control systems."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year8.html" style="color:white;text-decoration:none;font-weight:850">← Year 8 Lost Learning</a><a href="./" style="color:#d5ecfb;text-decoration:none;font-size:.9rem">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"year":8,"num":4,"title":"Flowol Control Systems","intro":"Design and test flowcharts that control real-world systems, including crossings, sensors and an automated car park.","revision":"https://kingsnortongirls.github.io/revision/y8u4.html","support":[],"lessons":[{"title":"Flowcharts and a Zebra Crossing","objective":"Identify control-flowchart symbols and design a repeating control sequence for a zebra crossing.","learn":[["What is a control system?","A **control system** uses instructions and sometimes sensors to operate devices. Examples include traffic lights, central heating and automated doors. Control systems must follow a precise sequence."],["Flowchart symbols","A **start** symbol begins the program, an **output** symbol switches devices on or off, a **process** can apply a delay or set a value, and a **decision** checks a condition with yes and no routes. Arrows show the flow."],["Sequencing","Instructions are carried out in order. To flash a zebra crossing beacon, turn it ON, wait, turn it OFF, wait, and repeat. A badly ordered sequence may give a confusing signal."],["Loops","A loop sends the flow back to an earlier point. A crossing beacon generally needs to continue flashing rather than stopping after one flash. Test that the correct output turns on and off at the required pace."]],"example":["Zebra beacon control flow","START → Turn beacon ON → Wait 0.5 seconds → Turn beacon OFF → Wait 0.5 seconds → back to Turn beacon ON.\nThis flowchart repeats continuously until the control system is stopped. The same loop idea can be used for a simulated warning light."],"tasks":[["Describe the jobs of **four flowchart symbols** and draw a small example of each.","Include START, OUTPUT, PROCESS and DECISION. A decision has two possible routes."],["Create a **flowchart for a flashing zebra crossing beacon**, with on/off commands, delays and a loop.","Use a sensible repeated order. Sketch it, or make it in Flowol if you have access."],["Explain why a flowchart that **stops after one flash** does not solve the same problem as one with a continuous loop.","A continuous warning needs repetition. Identify where your loop arrow should return."]],"challenge":"Design a flashing crossing light with two different delays and explain how the timing changes the effect.","quiz":[["Which symbol normally checks a condition?",["Decision","Start","Output"],0,"A decision tests something and follows a branch."],["Which operation is an output?",["Switch beacon ON","Read temperature","Ask whether a sensor is active"],0,"Turning a device on is an output action."],["Why does a beacon need a loop?",["To keep flashing repeatedly","To rename every file","To convert denary"],0,"The sequence should repeat."],["What controls the pause between flashes?",["A delay","A filename extension","A storage drive"],0,"Delays control timing."]]},{"title":"Traffic Light Sequences and System Failures","objective":"Develop a traffic-light control sequence and explain why faults in control systems can affect safety.","learn":[["Control signals must be correctly sequenced","A road traffic light must pass through valid states with suitable delays. In a simplified UK sequence, RED → RED + AMBER → GREEN → AMBER → RED."],["Two sides of a single-lane bridge","Two traffic-light sets must coordinate so opposing vehicles are never both signalled to proceed. A safe simulated sequence checks both directions before changing an output."],["Flowcharts can run in sequence","Create one flow for one side of a bridge and another for the opposite side, coordinating both in a repeating cycle. Use process delays so lights do not change instantly."],["What can go wrong?","Broken sensors, failed outputs, electrical faults or incorrect software can produce an unsafe state. Safety-critical systems need testing, fault detection and appropriate fail-safe behaviour."]],"example":["Bridge light sequence","1. Side A GREEN, Side B RED. 2. Wait for a set period. 3. Side A AMBER while B stays RED. 4. Set BOTH sides RED for a short clearance period. 5. Side A RED, Side B GREEN. 6. Reverse with a clearance period. 7. Repeat.\nNever set both sides GREEN at once."],"tasks":[["Write the standard simplified **UK traffic light colour sequence** in order, including the combined red-and-amber state.","RED → RED AND AMBER → GREEN → AMBER → RED."],["Design or annotate a two-sided **bridge traffic-light flowchart**. Explain how you prevent both directions getting a green light at once.","Keep one side red when the other is green and use a both-red clearance interval."],["Explain **two types of failure** in a traffic-light control system and **one possible consequence** of each.","Think about a faulty output light, a timing bug, sensor failure or power loss."]],"challenge":"Explain why a control system for a hospital device or aircraft needs much more rigorous fault testing than a decorative flashing light.","quiz":[["Which is a valid UK traffic-light state?",["Red and amber together","Green and red together","Amber and green together"],0,"Red and amber appear together before green."],["What should never happen at a single-lane bridge?",["Both directions receive green at the same time","A delay occurs","Both sides are red briefly"],0,"Conflicting green lights could lead to collisions."],["Why are delay processes used?",["To control timing between states","To remove arrows","To turn a sensor into a motor"],0,"Delays ensure controlled changes."],["Which is a possible system failure?",["A sensor reports the wrong reading","A correct repeat loop","A labelled process symbol"],0,"Incorrect readings can lead to unsafe decisions."]]},{"title":"Sensors and Automatic Home Control","objective":"Recognise sensor types and create decisions that control devices in an automated home.","learn":[["What is a sensor?","A **sensor** detects a physical condition or change, such as temperature, movement, light or pressure. It sends an **input** to the control system."],["Sensors, conditions and outputs","The computer processes the reading, tests a condition, then chooses an output. For example, if temperature is greater than 23°C, switch a fan on; otherwise switch it off."],["Decision symbols have two branches","A decision diamond asks a yes/no question, such as `Temperature > 23?`. Each branch should lead to a clear action. A loop repeatedly checks the sensor to detect changes."],["Automatic home examples","A light sensor can control outdoor lighting when it becomes dark. A movement sensor can trigger a security light. A temperature sensor can control a fan or heater."],["Hysteresis and repeated switching","If a reading fluctuates around a threshold, a real system may rapidly switch on and off. Using separate turn-on and turn-off thresholds is one possible improvement."]],"example":["Temperature-controlled fan flow","START → Read temperature → Is temperature > 23°C?\nYES → Fan ON → Read temperature again.\nNO → Fan OFF → Read temperature again.\nThe loop keeps checking the input and updating the output."],"tasks":[["For **temperature, light and motion**, give a real-life sensor example and the output it could control.","Temperature → fan; light → garden lamp; movement → security light."],["Write a flowchart or precise steps for a **fan that starts above 23°C** and switches off at or below 23°C.","Use a decision, YES and NO branches, outputs and a loop back to read the sensor again."],["Create a second control plan for a **security light**. Explain what input is monitored and when the lamp is on.","Use a motion sensor or a combination of light level and motion if the task needs it."]],"challenge":"Explain how you might use two different temperature thresholds to prevent a fan from rapidly switching on and off.","quiz":[["Which device gives a control system information about the environment?",["Sensor","Actuator","Monitor screen"],0,"A sensor provides an input reading."],["What is the correct output if the rule is 'fan ON when temperature > 23°C' and the temperature is 24°C?",["Fan ON","Fan OFF","No reading needed"],0,"24 is greater than 23."],["Why must the controller check sensors repeatedly?",["Conditions may change","To make the flowchart longer","Because a decision is always wrong"],0,"Repeated monitoring detects changes."],["Which sensor could detect movement at a front door?",["Motion sensor","Temperature sensor","Sound output"],0,"Movement can be detected using a motion sensor."]]},{"title":"Subroutines and a Pelican Crossing","objective":"Design a pedestrian crossing control system and explain how subroutines make flowcharts easier to reuse.","learn":[["Default state","A pedestrian crossing normally gives priority to road traffic until a button is pressed. A **default state** is the normal condition the system returns to when no request is active."],["Selection follows the push button","A decision tests whether the pedestrian button has been pressed. If not, the system keeps checking. If yes, it begins a controlled sequence of vehicle lights and pedestrian signals."],["What is a subroutine?","A **subroutine** is a named group of instructions called by the main program. It can handle one part of a control system, such as flashing the pedestrian signal or making an audible beep."],["Why use a subroutine?","Subroutines reduce duplicated instructions and make a large flowchart easier to test. The main flow can call a flashing subroutine whenever that part of the sequence is needed."],["Crossing safety","Your simulation must follow the chosen, explicitly stated crossing rules. Never signal pedestrians to cross while your simulated vehicle traffic is permitted to proceed."]],"example":["Pelican crossing structure","Main flow: START → Check button → if pressed, run crossing sequence → call `FlashSignal` → return to normal state.\nSubroutine `FlashSignal`: alternate selected output ON/OFF with short waits for a defined number of cycles, then RETURN to the main flow."],"tasks":[["Describe the **normal state** of a pedestrian crossing and the input that requests a change.","The button provides an input. Traffic signal and pedestrian signal are outputs."],["Draw or explain a **main flowchart** for a pedestrian crossing, with a decision for whether the button is pressed.","Make the yes and no branches clear; include the safe sequence and a return to monitoring."],["Design a separate **subroutine to flash a light or beep**. Explain how the main flow calls it.","A subroutine is defined separately and called when needed; it must return appropriately."]],"challenge":"Explain how two different crossing tasks could share one reusable subroutine, and how you would test that subroutine in isolation.","quiz":[["What normally triggers a pedestrian crossing request?",["A pedestrian presses the button","An icon moves","The file is copied"],0,"The button provides an input."],["What is a subroutine?",["Reusable named sequence of instructions","A permanent error","A type of sensor"],0,"Subroutines group instructions."],["Why use a subroutine?",["To avoid repeating the same code","To remove all sensors","To keep every output on"],0,"Subroutines improve structure and reuse."],["What is the normal condition called?",["Default state","Overflow","Input queue"],0,"The default is the normal operating state."]]},{"title":"Car Park Barriers, Sensors and Actuators","objective":"Identify inputs and outputs in a car park barrier and begin a safe control flowchart using sensors and motors.","learn":[["Sensors detect; actuators act","A **sensor** detects a car or barrier position. An **actuator**, such as a motor, moves the barrier in response to commands. A control unit processes inputs and sends outputs."],["Inputs and outputs in a car park","Possible inputs include an arrival sensor, a departure sensor and an upper/lower limit sensor. Outputs include motors to raise or lower the barrier and display lights."],["Sequence for entry","Detect a vehicle → check permission to enter → raise the barrier → check that it is open → let the vehicle pass → lower the barrier when safe. Each movement needs a defined stopping condition."],["Why test before lowering?","A safe system should not lower a barrier onto a vehicle. Check whether the lane is clear and use appropriate sensors or safety controls. A timer alone may not handle all real-world situations."],["Planning before Flowol","Draw the input/output table first, then use decisions and outputs to represent the logic. If Flowol is unavailable, write or draw an annotated control flowchart instead."]],"example":["A barrier system in input/process/output form","INPUT: vehicle detected at entrance.\nPROCESS: check the car park has permission/space and read the barrier's safe position.\nOUTPUT: raise motor operates; once open, stop motor.\nINPUT: vehicle has cleared barrier.\nOUTPUT: lower safely, then stop motor."],"tasks":[["Create an **input/output table** for a fictional automated car park barrier, identifying at least **three inputs** and **three outputs**.","Inputs might be vehicle sensor, barrier position, and car-park full signal. Outputs might be raise motor, lower motor and full light."],["Draw or describe a **flowchart to raise a barrier for an arriving car** and stop the motor at the open position.","Use a sensor decision and motor output. Include a way to stop movement."],["Explain **two hazards** caused by a badly programmed barrier and how a sensor or decision could reduce each hazard.","Think about lowering onto a car, raising without permission or a motor that never stops."]],"challenge":"Design a system that refuses entry when the car park is full, and explain how this changes your entry flowchart.","quiz":[["What is an actuator?",["A device that carries out a physical action","A sensor that only reads temperature","A file extension"],0,"Motors are common actuators."],["Which is an input to an automatic barrier?",["Vehicle detected by a sensor","Motor raises the arm","Full sign lights up"],0,"Sensors provide input."],["Why should a raised barrier's motor eventually switch off?",["To avoid continued motion or damage","To keep the program running faster","To create more codes"],0,"The motor needs a stopping condition."],["What should the system check before lowering?",["That the lane is clear and it is safe","Only the colour of the car","Whether the printer is on"],0,"Safety checks help prevent collisions."]]},{"title":"Car Park Counter and Complete Control System","objective":"Use variables to count spaces and complete a tested barrier control solution.","learn":[["Variables remember changing values","A **variable** stores a value that can change while a system runs. `spacesAvailable` might start at 10 for a car park with ten spaces."],["Counting cars arriving and leaving","When a car **enters**, reduce spaces available by one. When a car **leaves**, increase it by one. The count should never go below 0 or above the car park's capacity."],["Use a decision when full","If `spacesAvailable = 0`, the entry barrier stays closed and a FULL output is switched on. If a space is available, the normal safe entry sequence may begin."],["Avoid double-counting","An arrival sensor may remain active for more than one flowchart check. Count **once per completed entry or exit**, not repeatedly while the same car is detected."],["Test the finished flowchart","Test an empty car park, a partly full one and a completely full one. Test entry and exit, invalid readings and a sensor that remains on. Keep screenshots or an annotated description as evidence."]],"example":["A complete counting example","Capacity = 3; `spacesAvailable = 3`.\nOne car enters → 2 available.\nSecond enters → 1 available.\nThird enters → 0 available → show FULL, refuse further entry.\nOne car leaves → 1 available → clear FULL and permit entry again."],"tasks":[["Design variables for a car park with **five spaces**. Show the value after two cars enter, one leaves and four more attempt to enter.","Begin at 5; after two entries 3; after one exit 4. Only four more cars can then enter, leaving 0."],["Write or draw the **entry and exit flowchart logic** including the full check, raising/lowering motors and updating the counter.","Check spaces before entry; update once after a successful entry. Update once on successful exit."],["Create a **test table with at least five tests**, showing input, expected output and whether the system passes.","Test full, not full, car entering, car leaving, and a sensor staying active."]],"challenge":"Explain how you would prevent the counter changing twice when a vehicle remains over the same pressure sensor.","quiz":[["What should happen to `spacesAvailable` when a car enters?",["Subtract 1","Add 1","Always set to 100"],0,"An arriving car uses one available space."],["What should happen when no spaces remain?",["Show FULL and refuse entry","Allow an unlimited number of cars","Reset the count"],0,"No free space means entry should be restricted."],["What is wrong with a count of -1 for available spaces?",["It is outside the sensible range","It means the park is empty","It automatically opens the gate"],0,"Available spaces must not fall below 0."],["Why test the entry sensor for repeated readings?",["To avoid counting the same car more than once","To increase screen brightness","To convert binary"],0,"Continuous detection can cause duplicate counts."]]}]};</script><script src="catchup.js"></script></body></html>
