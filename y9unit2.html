<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 9 Unit 2: Logic | Lost Learning</title><meta name="description" content="Year 9 Boolean logic, binary, flowcharts and pseudocode lessons."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year9.html">← Year 9 Lost Learning</a><a href="./">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Year 9 Computer Science</footer><script>window.LOST_UNIT={"year":9,"num":2,"title":"Logic and Flowcharts","icon":"git-branch","intro":"Understand Boolean logic, number systems, flowcharts and pseudocode.","revision":"https://kingsnortongirls.github.io/revision/y9u2.html","support":[["Logic circuit simulator","https://logic.ly/demo/"]],"lessons":[{"title":"Boolean Logic Gates and Truth Tables","objective":"Use AND, OR and NOT gates, draw simple logic circuits and complete truth tables.","learn":[["Boolean logic","A Boolean value is TRUE (1) or FALSE (0). Logic gates use these values to produce an output; George Boole helped develop the mathematical basis for digital logic."],["AND, OR and NOT","AND gives 1 only when **both** inputs are 1; OR gives 1 when **at least one** input is 1; NOT reverses its single input (NOT 0 = 1, NOT 1 = 0)."],["Truth tables","List all input combinations. For two binary inputs A and B, there are four rows: 00, 01, 10, 11. Calculate the output of each gate for every row."],["Combining gates","To evaluate `(A AND B) OR C`, calculate A AND B first, then combine that result with C using OR. Test all possible inputs in a truth table."]],"example":["Worked truth table","A B | AND | OR\n0 0 |   0   | 0\n0 1 |   0   | 1\n1 0 |   0   | 1\n1 1 |   1   | 1\nNOT reverses any single input."],"tasks":[["Draw or describe **AND, OR and NOT** gates and write the rule for each.","AND needs both inputs; OR needs either; NOT inverts one."],["Complete the truth table for **AND** and **OR** with all four combinations of A and B.","Rows are 00, 01, 10, 11. Apply one gate at a time."],["Evaluate `(A AND B) OR C` for A=1, B=0, C=1 and for A=1, B=1, C=0.","Work out AND first, then OR with C. You can use the linked circuit simulator."]],"challenge":"Create a four-row truth table for `(NOT A) AND B`, showing the intermediate NOT result.","quiz":[["What is AND(1,0)?",["0","1","2"],0,"AND needs both inputs to be 1."],["What is OR(0,1)?",["1","0","2"],0,"OR needs at least one input to be 1."],["What is NOT(1)?",["0","1","10"],0,"NOT reverses the input."],["How many combinations do two binary inputs have?",["4","2","8"],0,"2² = 4 combinations."]]},{"title":"Binary, Hexadecimal, Addition and Storage Units","objective":"Convert number bases, add binary, explain overflow and select suitable storage units.","learn":[["Binary to denary","Binary is base 2 and has place values 128, 64, 32, 16, 8, 4, 2, 1 for eight bits. Add the values for each 1 to find its denary value."],["Hexadecimal","Hexadecimal is base 16. Digits A–F mean 10–15. One hexadecimal digit corresponds to four bits: `A` is `1010` and `F` is `1111`."],["Addition and overflow","Binary addition works from right to left, carrying when a column sums to two or more. An unsigned eight-bit number holds at most 255; a result needing nine bits overflows that fixed width."],["Capacity units","8 bits = 1 byte. Larger sizes are often described as KB, MB, GB and TB. Note that decimal and binary unit conventions may use different multipliers."]],"example":["Two ways to express 44","Binary `00101100` = 32 + 8 + 4 = **44**. Hex `2C` = 2×16 + 12 = **44**. Adding 1 to 255 needs nine bits and cannot fit in unsigned eight-bit storage."],"tasks":[["Convert **01011001** and **10000110** to denary, showing every place value added.","Use the values 128, 64, 32, 16, 8, 4, 2, 1."],["Convert denary **46** to eight-bit binary. Convert hexadecimal **3A** to denary and binary.","46 = 32+8+4+2. Hex 3A means 3×16+10."],["Add **00011101 + 00000111**, showing carries. Define **overflow** and give an eight-bit example.","Work from the right. Remember that 1+1 is binary 10."]],"challenge":"Calculate the total bits in 250 bytes and justify using GB rather than KB for a large video.","quiz":[["What is `00001001` in denary?",["9","8","3"],0,"8+1=9."],["What is hexadecimal E in denary?",["14","15","10"],0,"E=14."],["What is binary 1+1?",["10","2","11"],0,"Binary 10 is denary 2."],["How many bits are in a byte?",["8","4","16"],0,"A byte has eight bits."]]},{"title":"Flowcharts and Algorithms","objective":"Use correct flowchart symbols to describe sequence, selection and iteration.","learn":[["What is a flowchart?","An algorithm is an ordered set of steps. A **flowchart** is a diagram that shows those steps and the flow between them."],["Standard symbols","An oval is usually START/STOP; a rectangle is a PROCESS; a parallelogram represents INPUT/OUTPUT; and a diamond is a DECISION. Arrows show where to go next."],["Control structures","Sequence follows actions in order. Selection branches after a condition. Iteration loops back to repeat steps."],["Trace an algorithm","Start at START, follow each arrow and answer decision questions based on the input. Check that each path works and eventually stops or intentionally repeats."]],"example":["Age-checking flowchart","START → INPUT age → Is age ≥ 13 AND age ≤ 19? YES → OUTPUT 'Teenager'; NO → OUTPUT 'Other age' → STOP. Each answer follows a different branch."],"tasks":[["Draw a simple **five-step flowchart for brushing your teeth**, using suitable symbols.","Include START, processes and STOP with correctly directed arrows."],["Draw a flowchart asking for an **age** and outputting **Teenager** for 13–19, otherwise Other age.","Use input, decision, two outputs and a stop."],["Describe what a flowchart does when it asks 'Try again?' and the YES route returns to an earlier step.","That route forms a loop. Explain the conditions under which it ends."]],"challenge":"Create a flowchart that asks for positive numbers until the input is greater than zero, then outputs the accepted value.","quiz":[["Which symbol represents a decision?",["Diamond","Rectangle","Oval"],0,"A diamond marks a choice."],["Which symbol represents input/output?",["Parallelogram","Circle","Arrow"],0,"A parallelogram is commonly used."],["What is iteration?",["Repetition","Storage","Deletion"],0,"Iteration repeats steps."],["What do flowchart arrows indicate?",["Direction of execution","Data size","Font style"],0,"Arrows connect steps."]]},{"title":"Pseudocode and Selection","objective":"Write structured instructions with IF, ELSE and clear sequences.","learn":[["What is pseudocode?","Pseudocode is a language-independent plan for an algorithm. It describes actions logically without needing to obey every rule of a programming language."],["Sequence and efficiency","Write short precise steps such as `MOVE RIGHT 3` or `OUTPUT greeting`. Make the meaning clear; avoid needlessly repeating many individual instructions."],["IF and ELSE","Use `IF condition THEN` to test a statement. `ELSE` identifies the alternative if the test is false. `ENDIF` marks the end of that decision."],["Test the branches","Trace example inputs through your code. Try values either side of a boundary, such as 49 and 50, to make sure the right outcome is produced."]],"example":["Check a score","INPUT score\nIF score >= 50 THEN\n   OUTPUT 'Pass'\nELSE\n   OUTPUT 'Retry'\nENDIF"],"tasks":[["Write pseudocode to move a character **3 right, 2 up and 1 left**, with actions in order.","Choose clear instructions and include directions and distances."],["Write pseudocode that **picks up a banana if one exists** and walks past otherwise.","Use IF/ELSE/ENDIF and a Boolean test."],["Write and test pseudocode to output **Pass** when score ≥50 and **Retry** otherwise. Trace 49, 50 and 80.","State the path selected and output for each input."]],"challenge":"Create a pseudocode algorithm that uses an IF statement inside a loop to search a small grid for an item.","quiz":[["What is pseudocode for?",["Planning algorithms","Compressing images","Storing passwords"],0,"Pseudocode communicates algorithm logic."],["Which keyword begins selection?",["IF","SAVE","PRINTSCREEN"],0,"IF tests a condition."],["When does ELSE run?",["When the IF condition is false","Always first","Only at program start"],0,"ELSE is the alternative branch."],["Why indent an IF block?",["To show which steps belong together","To change a variable type","To make files smaller"],0,"Indentation shows structure."]]}]};</script><script src="catchup.js"></script></body></html>
