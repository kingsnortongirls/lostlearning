<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 8 Unit 6: E-Safety | Lost Learning</title><meta name="description" content="Catch up on email safety, malware, pharming, ransomware and hacking."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year8.html" style="color:white;text-decoration:none;font-weight:850">← Year 8 Lost Learning</a><a href="./" style="color:#d5ecfb;text-decoration:none;font-size:.9rem">All year groups</a></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"year":8,"num":6,"title":"E-Safety 2","intro":"Recognise suspicious emails and websites, understand malware and know how to respond responsibly to cyber threats.","revision":"https://kingsnortongirls.github.io/revision/y8u6.html","support":[["CEOP Safety Centre","https://www.ceop.police.uk/Safety-Centre/"],["NCSC: Cyber security advice","https://www.ncsc.gov.uk/"]],"lessons":[{"title":"Email: Benefits, Drawbacks and Dangers","objective":"Describe how different groups use email, evaluate its advantages and disadvantages, and identify common risks.","learn":[["How people use email","Students may email teachers about work; businesses contact customers and suppliers; families may share messages or appointments. Email is useful because it is quick, can reach groups and can include attachments."],["Advantages and limitations","Advantages include inexpensive communication, written records and attachments. Disadvantages can include too many messages, unclear tone, delays in receiving a reply and accidental sharing with the wrong person."],["Common email dangers","Risks include **phishing**, malicious attachments, harmful links, impersonation, spam and accidental disclosure of private information. A message appearing to come from someone familiar is not proof it is genuine."],["Recognise phishing","Phishing attempts to trick people into sharing information or taking unsafe actions. Clues include unexpected urgency, suspicious addresses, unusual links, requests for passwords and messages that do not match a service's normal process."],["What to do","Do not follow suspicious links or open unexpected attachments. Verify a request using a known, separate contact method. Report suspicious messages through your school's approved system and tell a trusted adult."]],"example":["Inspect a fictional school email","From: `helpdesk@school-support-example.invalid`\nSubject: 'URGENT: Your account closes in 10 minutes!'\nMessage: 'Reply with your password now.'\nThis is suspicious because it asks for a password and uses pressure. **Do not reply**. Verify with school IT using the recognised contact route."],"tasks":[["Describe how **a pupil, a business and a family member** might each use email. Give **one advantage and one disadvantage** for each.","Think about written records, speed, attachments and the risk of messages being missed."],["Analyse the fictional email in the worked example. Identify **four warning signs** and write a safe response.","Unexpected urgency, password request and suspicious address are warning signs. Report it and verify independently."],["Write **five rules for safe email use** that would help another Year 8 pupil.","Include checking the sender, avoiding unknown attachments and links, checking recipients and reporting concerns."]],"challenge":"Explain why an email from a known name may still be a scam. Describe a trustworthy way to verify the sender without replying to that email.","quiz":[["What is a major advantage of email?",["It can send messages and files quickly","It guarantees every message is read","It cannot be forged"],0,"Email is efficient but not always trustworthy."],["What is phishing?",["An attempt to deceive someone into unsafe actions or sharing information","A way to format a document","A type of storage"],0,"Phishing often arrives by email or message."],["What should you do with an unexpected password request?",["Do not share it; verify by a separate route","Reply with the password","Forward it to every pupil"],0,"Legitimate support teams should not request passwords this way."],["Which feature alone proves an email is genuine?",["None of these: names and logos can be copied","A familiar logo","Capital letters in the subject"],0,"Visual appearance is not proof of authenticity."]]},{"title":"Genuine Websites, Malware, Pharming and Ransomware","objective":"Assess website risks, explain different kinds of malicious software and choose sensible protective actions.","learn":[["A secure connection is not the same as a safe website","**HTTPS** means the connection to the website is encrypted. It does **not** prove that a site is honest or free from scams. Check the full domain spelling, purpose of the site, unusual requests and whether you reached it through a trusted route."],["What is malware?","**Malware** means malicious software. Types include viruses, worms, spyware and ransomware. Signs of compromise can include unexpected pop-ups, changed settings, unusual slowness, warnings from security software or files behaving oddly."],["Pharming","**Pharming** directs people to a fake destination even when they think they are visiting a legitimate address. For example, manipulated domain lookup or device settings may redirect a visit to a convincing imitation."],["Ransomware","**Ransomware** can encrypt or block access to files and demand payment. Prevention includes updates, trusted software sources, sensible security controls and secure backups. Paying does not guarantee recovery."],["Response to something suspicious","Stop interacting with the suspicious page or file, tell school IT or a trusted adult, and follow the correct reporting process. Do not install 'fixes' advertised by random pop-ups."]],"example":["Spot the fake web address","You expect `www.examplebank.co.uk`, but the link leads to `examplebank-login.help-example.invalid`.\nThe important domain is different, even if the page copies branding or displays a padlock. Do not enter credentials; navigate through the genuine service using a known, independently obtained address."],"tasks":[["Explain why a **padlock and HTTPS** do not, on their own, guarantee that a website is trustworthy.","A scam site can also use encryption. Check the domain, purpose and request."],["Create a comparison table for **malware, pharming and ransomware**, covering what each means and one risk or example.","Malware is the broad category; pharming is redirection to a fake destination; ransomware commonly blocks or encrypts access."],["Write a short safety plan for a pupil whose laptop shows strange pop-ups after opening an attachment.","Stop using suspicious links, tell a trusted adult or IT, do not enter more passwords and follow school reporting guidance."]],"challenge":"Explain how a secure backup stored separately from the infected device can reduce the harm from ransomware.","quiz":[["What does HTTPS mainly protect?",["The connection between browser and site","The site's honesty","Every file on the computer"],0,"HTTPS encrypts traffic but does not guarantee a legitimate site."],["What does ransomware often do?",["Encrypts or blocks files and demands payment","Creates a classroom timetable","Makes a printer faster"],0,"Ransomware restricts access to data."],["What is pharming?",["Redirecting users towards a fake destination","Sorting numbers","A type of screen"],0,"Pharming misdirects traffic."],["Which action is a sensible way to reduce malware risk?",["Install trusted updates and avoid unknown attachments","Disable all security software","Download every free tool in a pop-up"],0,"Updates and cautious behaviour reduce risk."]]},{"title":"Hacking, the Law and Protecting Systems","objective":"Explain unauthorised access, its possible legal consequences and practical ways to protect accounts and computers.","learn":[["What does hacking mean?","Hacking broadly describes exploring or modifying computer systems. Whether activity is lawful depends on permission and conduct. **Unauthorised access** to a computer system is a serious concern and may be a criminal offence."],["The law","In the UK, the **Computer Misuse Act 1990** makes certain forms of unauthorised access and interference with computer systems offences. Good intentions do not automatically give permission to access another person's account."],["Why systems are targeted","Attackers might want money, personal information or to disrupt a service. Threats include guessed or stolen passwords, unsafe downloads, fraudulent messages and malicious programs."],["Signs of a problem","Unexpected account activity, unfamiliar sign-ins, a changed password, missing files or security warnings can indicate trouble. These signs are not absolute proof, but they need attention."],["Prevention and response","Use long unique passwords, multi-factor authentication where available, updates, secure backups and careful reporting. Do not attempt to investigate by breaking into another account; involve school IT or a trusted adult."],["Logic bombs","A **logic bomb** is malicious code triggered when a specified condition is met. Recognising the idea helps explain why unusual software behaviour may not occur immediately after installation."]],"example":["A fictional account access scenario","A pupil notices that their friend has left a computer logged in. Opening their messages without permission is not acceptable. The safer choice is to leave the account alone and report the unattended session to the teacher. Permission matters even if accessing the account appears easy."],"tasks":[["Define **hacking** and **unauthorised access**, then explain why permission matters.","A user's open session or easy-to-guess password does not grant permission."],["Name the relevant **UK computer misuse law** and explain, in simple language, one type of behaviour it is intended to prohibit.","The Computer Misuse Act 1990 covers certain unauthorised access and interference with computer systems."],["Create a **six-point account security checklist** and write what you would do if you noticed an unfamiliar login.","Include unique passwords, MFA, updates and reporting the suspected incident."]],"challenge":"Explain how a malicious program triggered by a future date or specific event could be harder to notice immediately after installation.","quiz":[["Which UK law addresses certain forms of unauthorised computer access?",["Computer Misuse Act 1990","Road Traffic Act only","A school's uniform policy"],0,"The Computer Misuse Act covers certain computer misuse offences."],["Does an unlocked account mean you have permission to use it?",["No","Yes, always","Only if you know the person"],0,"Permission must be given."],["What is a logic bomb?",["Code that activates under a specified condition","A screen brightness setting","A printer cartridge"],0,"It is triggered by a particular event or condition."],["What is a responsible response to suspected hacking at school?",["Tell the correct school IT or safeguarding contact","Try to hack the attacker","Publish someone's password"],0,"Report concerns rather than retaliating."]]}]};</script><script src="catchup.js"></script></body></html>
