<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 7 Unit 4 · Drawing and Manipulating Shapes | Lost Learning</title><meta name="description" content="Year 7 Drawing and Manipulating Shapes lesson-by-lesson catch-up resources."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="./">← Lost Learning | Computer Science</a><small>Year 7 · Unit 4</small></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"num":4,"title":"Drawing and Manipulating Shapes","intro":"Use geometry, algorithms, Scratch and Python Turtle to make shapes and repeating patterns.","revision":"https://kingsnortongirls.github.io/revision/y7u4and5.html","lessons":[{"title":"Shapes, Patterns and Algorithms","objective":"Describe regular shapes, recognise patterns and write precise algorithms using coordinates.","learn":[["Regular polygons","A regular polygon has equal sides and equal interior angles. Examples include an equilateral triangle (3 sides), square (4), regular pentagon (5) and regular hexagon (6)."],["Patterns and sequences","A repeating pattern uses shapes or movements that occur again and again. A sequence is an ordered series. Spotting repetition makes a drawing algorithm more efficient."],["Decomposition and abstraction","Decomposition means breaking a complicated design into smaller shapes or tasks. Abstraction means paying attention to important details, such as sides, sizes and positions, while ignoring unnecessary ones."],["Precise instructions and coordinates","An algorithm is a clear, ordered set of instructions. Coordinates such as (3,2) describe a position. To draw a shape, you must describe where to start, how far to move and when to turn."]],"example":["A square drawing algorithm","1. Place the pen at the starting point. 2. Put the pen down. 3. Move forwards 50 units. 4. Turn right 90°. 5. Repeat steps 3 and 4 until four sides are complete. The complete turn is 360°."],"tasks":[["List the number of sides for a triangle, square, pentagon and hexagon. Explain what makes a polygon **regular**.","Use the words 'equal sides' and 'equal angles'."],["Write a precise, numbered algorithm to draw a square of side length 40 units, starting at (0,0).","Include the starting point, pen position, movement, turn angle and repetition."],["Describe how you would break down a pattern of **four differently positioned squares** into smaller tasks.","Think about the position, size and angle of each square."]],"challenge":"Calculate the exterior turn angle for a regular pentagon using 360 ÷ number of sides. Explain why the turn angle works.","quiz":[["How many sides has a regular hexagon?",["5","6","8"],1,"A hexagon has six sides."],["What is decomposition?",["Breaking a problem into smaller parts","Adding decoration","Removing all instructions"],0,"Decomposition makes a problem manageable."],["What does the coordinate (4,2) describe?",["A position","A colour","A number of sides"],0,"Coordinates identify positions."],["How many degrees do you turn at each corner when drawing a square using turtle movement?",["45°","90°","180°"],1,"Four 90° turns make 360°."]]},{"title":"Drawing Shapes in Scratch","objective":"Use Scratch pen, movement and repeat blocks to draw basic geometric shapes.","learn":[["Scratch sprites follow instructions","A sprite performs blocks in sequence. With the Pen extension, the sprite can leave a line as it moves across the stage."],["Useful pen and motion blocks","Use 'erase all', 'pen down', 'move 50 steps', 'turn 90 degrees' and 'pen up'. The order matters: a sprite must put its pen down before drawing a line."],["Repeat instead of copying","A square needs four equal moves and four right-angle turns. A `repeat (4)` block surrounding 'move 50 steps' and 'turn 90 degrees' is more efficient than copying them four times."],["Exterior turn angles","For a regular polygon, calculate the turtle's turn using 360 ÷ number of sides. Triangle: 120°. Square: 90°. Hexagon: 60°."]],"example":["Scratch square pseudocode","when green flag clicked\n erase all\n pen down\n repeat (4)\n   move (60) steps\n   turn clockwise (90) degrees\n pen up\nThe loop repeats the two instructions four times, creating a square."],"tasks":[["Open the Scratch editor, add the Pen extension and create code to draw a square. Describe the blocks you used.","Start with 'when green flag clicked', erase all, pen down, repeat 4, move, turn and pen up."],["Modify your Scratch program to draw a triangle and a rectangle. Explain what changed.","A triangle uses three equal moves and 120° turns; a rectangle alternates two different side lengths and 90° turns."],["Draw **four separate squares** in Scratch. Explain how you positioned your sprite between shapes without drawing unwanted joining lines.","Use pen up before moving to another start point, then pen down."]],"challenge":"Draw a regular hexagon in Scratch. Calculate the angle before writing your code, then explain why the drawing closes.","quiz":[["Which Scratch extension draws a trail behind a sprite?",["Music","Pen","Text-to-speech"],1,"The Pen extension lets sprites draw."],["Why place a move and a turn inside a repeat block?",["To remove repetition in the code","To make the sprite invisible","To change the language"],0,"Loops make code shorter and clearer."],["What is the exterior turn angle for a regular triangle?",["60°","90°","120°"],2,"360 ÷ 3 = 120°."],["How do you move without drawing a connecting line?",["Use pen up","Erase the project","Change the sprite name"],0,"Pen up allows movement without drawing."]]},{"title":"Repeating Patterns in Scratch","objective":"Use repeated shapes, positioning and turns to create and debug geometric artwork.","learn":[["From shape to pattern","A shape is a single drawing. A pattern can be created by drawing a shape, moving or turning, then drawing the shape again."],["Nested repetition","A repeat block can contain another repeat block. An inner loop draws one polygon, while an outer loop repeats or rotates that polygon to create a larger pattern."],["Rotation changes the design","For example, drawing a square and then turning 30° before drawing another square twelve times produces a rotating pattern, because 12 × 30° = 360°."],["Debugging","If a shape does not close, check the turn angle and repeat count. If unwanted lines join shapes, check where the pen is down. Test one step at a time."]],"example":["A rotating square pattern","repeat (12)\n   repeat (4)\n      move (60) steps\n      turn (90) degrees\n   turn (30) degrees\nThis repeats a complete square while turning the sprite slightly each time."],"tasks":[["Create a Scratch pattern using at least **four repeated squares**. Explain your outer and inner loops.","The inner repeat makes a square. The outer repeat makes several copies."],["Create a second pattern where the polygons rotate by a fixed angle. Record the number of repeats and the turn angle.","Try twelve copies rotated by 30°, or six copies rotated by 60°."],["Describe a fault you encountered or could encounter when using repeats. Explain how you would debug it.","Check the angle, repeat count, start position and pen state."]],"challenge":"Make a more complex starburst with two nested loops and compare it with an equivalent long program without loops.","quiz":[["What is a nested loop?",["A loop inside another loop","Two different sprites","A comment"],0,"Nested loops are repetitions inside repetitions."],["What is the result of 12 turns of 30°?",["180°","360°","720°"],1,"12 × 30° = 360°."],["Which problem could cause extra joining lines?",["Pen down while repositioning","Pen up while repositioning","A correct repeat count"],0,"Moving with pen down leaves a trail."],["What does debugging mean?",["Finding and fixing errors","Adding random blocks","Closing Scratch"],0,"Debugging locates and corrects problems."]]},{"title":"Drawing with Python Turtle","objective":"Write text-based Python instructions to move a turtle and draw shapes.","learn":[["Text-based code","Python uses typed commands instead of Scratch blocks. Precise spelling, brackets, indentation and order are important."],["Set up Turtle","A common starting point is `import turtle` followed by `t = turtle.Turtle()`. The turtle object receives commands such as `t.forward(80)` and `t.right(90)`."],["Control movement and drawing","Use `t.forward(n)` to move; `t.left(angle)` and `t.right(angle)` to turn; `t.penup()` to move without drawing; `t.pendown()` to resume drawing."],["Loops reduce repetition","A `for` loop such as `for i in range(4):` repeats its indented body four times. Turtle may need a Python environment that supports graphics."]],"example":["Python Turtle square","import turtle\nt = turtle.Turtle()\nfor i in range(4):\n    t.forward(80)\n    t.right(90)\nturtle.done()"],"tasks":[["Write a working Python Turtle program to draw a square. Add a screenshot of the code or explain each line.","Start by importing turtle and creating `t = turtle.Turtle()`. Use a `for` loop."],["Adapt the program to draw a regular triangle, then explain the number of repeats and the angle.","Use `range(3)` and a turn of 120°."],["Describe how you could draw the letters H and I with Turtle, including how to move without drawing.","Use `penup()` to reposition between separate strokes and `pendown()` to draw."]],"challenge":"Create a pattern of ten circles that gradually increase in size, or describe a program to do this using a loop.","quiz":[["Which command moves a turtle forwards?",["t.forward(80)","t.stop(80)","t.jump(80)"],0,"The forward method moves the turtle."],["What does `range(4)` do in a for loop?",["Provides four iterations","Provides forty iterations","Draws a circle"],0,"It generates four loop values from 0 to 3."],["What happens after `t.penup()`?",["Movement no longer draws a line","The turtle turns right","The program closes"],0,"Pen up stops drawing while moving."],["What is the Python Turtle turn angle for a square?",["60°","90°","120°"],1,"Four 90° turns complete the square."]]},{"title":"Python Turtle: While Loops and Procedures","objective":"Use while loops and defined procedures to create reusable shape drawing code.","learn":[["A while loop repeats while a condition is true","`while count \u003c 4:` repeats its indented body as long as count remains below 4. Update the counter or the loop might never finish."],["Making a square with while","Start `count = 0`; while count is less than 4: move forwards, turn right 90° and increase count by 1. Four sides are drawn."],["Procedures with def","`def square():` creates a named procedure. Code in its indented body does not run until you call `square()`. This helps reuse the same shape drawing instructions."],["Why code reuse matters","A procedure keeps repeated drawing code in one place. If you need a different square size later, you can create a parameter such as `def square(size):`."]],"example":["Square procedure using a while loop","import turtle\nt = turtle.Turtle()\ndef square():\n    count = 0\n    while count \u003c 4:\n        t.forward(60)\n        t.right(90)\n        count += 1\nsquare()\nturtle.done()"],"tasks":[["Write or explain a Python Turtle **while loop** that draws a square. Identify the condition and counter update.","Use `count = 0`, `while count \u003c 4:`, then `count += 1` inside the loop."],["Convert the square drawing instructions into a **procedure** called `square()` and show where it is called.","`def square():` creates it; `square()` calls it later."],["Explain how you could call your procedure several times to draw four squares in different positions.","Call `square()` repeatedly, moving with pen up between each call."]],"challenge":"Change the procedure to accept a parameter: `def square(size):`. Explain how calls such as `square(40)` and `square(80)` behave.","quiz":[["When does a while loop repeat?",["While its condition is true","Exactly once always","Only while the screen is off"],0,"A while loop checks its condition each time."],["Why must `count` change in the square loop?",["To allow the loop to finish","To make the pen red","To start the program"],0,"Without updating count, the condition may stay true."],["What keyword creates a Python procedure?",["while","def","input"],1,"Use `def` to define a named function or procedure."],["How do you run a procedure named `square`?",["Call `square()`","Write `square` as a comment","Restart Python"],0,"Calling the name with brackets executes the procedure."]]}]};</script><script src="catchup.js"></script></body></html>
