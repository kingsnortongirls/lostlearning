<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10345a"><title>Year 7 Unit 8 · Spreadsheets | Lost Learning</title><meta name="description" content="Year 7 Spreadsheets independent catch-up lessons."><link rel="stylesheet" href="catchup.css"></head><body><header><div class="wrap"><a href="year7.html">← Year 7 Lost Learning</a><small>Year 7 · Unit 8</small></div></header><main id="app"></main><section id="paper" class="print-sheet"></section><footer>Lost Learning · Learn, practise, check and print.</footer><script>window.LOST_UNIT={"num":8,"title":"Spreadsheets","intro":"Format cells, use formulas and functions, model profit and create meaningful charts.","revision":"https://kingsnortongirls.github.io/revision/y7u8.html","lessons":[{"title":"Cells, Formatting, Formulas and SUM","objective":"Locate spreadsheet cells, format information and calculate totals using formulas, SUM and fill handles.","learn":[["Rows, columns and cell references","A spreadsheet is a grid. Columns use letters (A, B, C) and rows use numbers (1, 2, 3). The cell at column B, row 4 is `B4`. A range such as `B3:B8` includes all cells from B3 to B8."],["Formatting aids understanding","Titles, bold headings, shading, borders, aligned numbers and currency formatting make a spreadsheet easier to interpret. Formatting changes appearance, not the actual numeric value."],["Formulas start with =","A spreadsheet formula begins with `=`. To add cells B3 and B4, write `=B3+B4`. To multiply, use `*` instead of ×."],["SUM function and fill handle","`=SUM(B3:B8)` adds the numbers in that range. The fill handle lets you copy formulas into other cells, adjusting relative references as appropriate."]],"example":["Tuck-shop totals","If B3 is 12 and B4 is 8, `=B3+B4` displays 20. `=SUM(B3:B4)` also displays 20. If C3 is a price and D3 is a quantity, `=C3*D3` calculates the subtotal."],"tasks":[["Explain the difference between a **row**, **column**, **cell reference** and **range**, giving a correct example of each.","Column B runs vertically; row 4 runs horizontally; B4 is one cell; B4:B9 is a range."],["Create a fictional tuck-shop spreadsheet with an item, price, quantity and subtotal. Write the formula for **price × quantity**.","If prices are in B and quantities in C, use `=B2*C2` in D2."],["Explain how you would use **SUM** and the **fill handle** to calculate several totals efficiently.","SUM adds ranges; fill handle copies a formula to other rows or columns."]],"challenge":"Explain why `=B3+B4+B5` and `=SUM(B3:B5)` can give the same answer, and which you would prefer for a range of 100 cells.","quiz":[["Which cell is in column C, row 5?",["5C","C5","C:5"],1,"A cell reference has its column letter first."],["Which symbol begins a formula?",["=","#","@"],0,"Formulas begin with =."],["What does `=SUM(B2:B4)` do?",["Adds B2, B3 and B4","Multiplies B2 by B4","Changes the font"],0,"SUM adds all numbers in the range."],["Which character means multiplication in a spreadsheet formula?",["x","*","%"],1,"Use the asterisk for multiplication."]]},{"title":"Profit, Subtraction and Adding Rows","objective":"Use formulas to calculate income, expenditure and profit, and modify a spreadsheet layout.","learn":[["Income and expenditure","Income is money received by a business or activity. Expenditure or costs are money spent. The difference tells you whether the business makes money."],["Profit calculation","Profit = income minus expenditure. For example, £200 income and £155 costs produces £45 profit. A negative result means a loss."],["Multiply prices and quantities","Revenue from selling an item can be calculated as selling price × number sold. If an item costs £3 and 10 are sold, revenue is £30."],["Adding and deleting rows","Spreadsheets can change as more information becomes available. Insert a row for a new item and check that all totals and formula references include the new values."]],"example":["Property profit model","Imagine rent received is £900 in B2 and expenses are £325 in B3. Formula in B4: `=B2-B3`. Profit: £575. If another £100 expense is added, total costs become £425 and profit falls to £475."],"tasks":[["Explain the difference between **income**, **expenditure**, **profit** and **loss** with a simple example.","Profit = income - expenditure. A loss occurs when costs exceed income."],["Plan a spreadsheet for a fictional school sale with sales income and three expense categories. Calculate profit using cell references.","Place income in B2, total costs in B6 and use `=B2-B6`."],["Describe the steps needed to **insert a new cost row** without leaving the cost out of your profit calculation.","Insert a row, enter the cost and check or extend SUM formulas."]],"challenge":"Explain how changing the quantity sold could affect revenue and profit, while some costs might stay fixed.","quiz":[["How do you calculate profit?",["Income minus costs","Costs plus income","Quantity divided by income"],0,"Profit is income less expenditure."],["What does a negative profit usually mean?",["A loss","An automatic bonus","No sales"],0,"Costs exceeded income."],["If 8 items sell for £4 each, what is the revenue?",["£12","£32","£2"],1,"8 × £4 = £32."],["Why check formulas after inserting a row?",["New values might not be included in totals","The font may change","It stops all calculation"],0,"Formula ranges must cover the correct cells."]]},{"title":"Labels, Variables, Rules and Models","objective":"Distinguish labels, variables and rules and explain how changing values affects a model.","learn":[["What is a model?","A spreadsheet model represents a real situation using data and rules. It can help make predictions, answer 'what if?' questions and compare possible choices."],["Labels identify information","Labels are words describing what a row, column or value represents, such as 'Ticket price' or 'Tickets sold'."],["Variables can change","Variables are input values that might change, such as price, number of customers or a cost. Changing a variable should update the result when formulas are correctly linked."],["Rules perform calculations","Rules are spreadsheet formulas such as `=B2*B3` for total revenue. Models are only useful when the inputs and formulas are accurate."],["Testing the model","Change one variable, predict the effect and compare your prediction with the model's calculated result. Test sensible boundary values too."]],"example":["School concert model","Label B2 as 'Price per ticket' and enter 5. Label B3 as 'Tickets sold' and enter 40. Label B4 as 'Revenue' and enter `=B2*B3`. The model gives £200. If ticket price rises to £6, revenue updates to £240."],"tasks":[["Explain what a **label**, **variable** and **rule** are, using the school concert example.","Label is descriptive text; variable is an input value; rule is a formula."],["Create a two-variable spreadsheet model for a fictional school event. Predict what happens if one value doubles.","Try ticket price × number sold. Change one value at a time."],["Explain why a spreadsheet model might give an incorrect prediction even when the formulas are working.","The input values could be wrong, incomplete or unrealistic."]],"challenge":"Design a model for a school trip that lets a teacher change the number of pupils and ticket cost, then predict the total cost.","quiz":[["What is a spreadsheet model?",["A way to represent and test a situation","Only a drawing","A web browser"],0,"Models link data with rules."],["Which is a label?",["Ticket price","6","=B2*B3"],0,"Labels describe information."],["Which is a formula rule?",["=B2*B3","Tickets sold","Concert"],0,"The formula calculates a result."],["What should happen when a linked variable changes?",["The formula result updates","The computer always restarts","The spreadsheet cannot change"],0,"Linked formulas recalculate."]]},{"title":"Functions: SUM, MIN, MAX, AVERAGE and IF","objective":"Use built-in functions to summarise numerical data and make simple decisions.","learn":[["A function is a built-in calculation","Functions save time and reduce errors. Write functions in cells using `=` followed by a function name and brackets containing values or a range."],["SUM and AVERAGE","`=SUM(B2:B6)` adds numbers. `=AVERAGE(B2:B6)` calculates their mean: total divided by number of values."],["MIN and MAX","`=MIN(B2:B6)` returns the smallest value. `=MAX(B2:B6)` returns the largest."],["IF makes a decision","`=IF(B2>=10,\"Target met\",\"Keep trying\")` checks a condition. The first text appears if the test is true; the second appears if it is false."],["Check the result","A function cannot correct inaccurate input data. Compare the output with a sensible estimate or a manual calculation."]],"example":["Quiz scores","Scores: 4, 7, 9, 10.\nSUM = 30; AVERAGE = 7.5; MIN = 4; MAX = 10.\nIf the first score is in B2, `=IF(B2>=5,\"Pass\",\"Retry\")` displays Retry."],"tasks":[["Explain what **SUM**, **AVERAGE**, **MIN** and **MAX** do. Give a spreadsheet formula for each using `B2:B6`.","All these functions take a range of cells inside brackets."],["Calculate the SUM, AVERAGE, MIN and MAX of **3, 5, 7, 9, 11**. Show your working.","SUM = 35 and there are five values. The average is SUM ÷ 5."],["Write an **IF function** displaying 'Profit' if cell B8 is above zero, and 'No profit' otherwise. Explain the true and false results.","Use `=IF(B8>0,\"Profit\",\"No profit\")`."]],"challenge":"Explain the difference between a formula you write yourself, such as `=B2+B3`, and a built-in function such as `=SUM(B2:B3)`.","quiz":[["Which function finds the biggest value?",["MIN","MAX","SUM"],1,"MAX returns the largest."],["What does AVERAGE return?",["The mean of the values","Only the first value","The highest value"],0,"AVERAGE calculates the arithmetic mean."],["What does `=MIN(3,8,5)` return?",["3","8","16"],0,"The smallest value is 3."],["What is the purpose of the IF function?",["To choose between results based on a test","To change the screen brightness","To insert a chart"],0,"IF uses a logical condition."]]},{"title":"Creating and Choosing Charts","objective":"Create and interpret bar, line and pie charts with clear titles and labels.","learn":[["Charts communicate patterns","Charts make data easier to compare and interpret. A clear chart has a useful title and sensible labels."],["Bar charts compare categories","Use a bar or column chart to compare categories, such as the cost of different school lunches. The bars help readers compare amounts."],["Line charts show change","A line chart is often suitable for values that change continuously over time, such as temperatures recorded each day."],["Pie charts show proportions","A pie chart shows how a whole is divided into parts. The categories should add up to the complete whole, for example how 30 pupils travel to school."],["Titles, axes and print layout","A chart should have a descriptive title, correctly labelled axes where appropriate and a readable scale. Choose portrait or landscape orientation to fit the information on a page."]],"example":["Choose the best chart","Favourite fruits among 30 pupils: Apple 12, Banana 10, Orange 8. A bar chart compares categories clearly; a pie chart shows their share of the class. Temperatures recorded over seven days suit a line chart."],"tasks":[["Explain when you would choose a **bar chart**, **line chart** or **pie chart**, giving one scenario for each.","Bar: compare categories. Line: change over time. Pie: parts of a whole."],["Create a simple spreadsheet table for **four animals and their costs**, then describe how you would make an accurately titled bar chart.","Select data, insert bar chart, add title and category/value labels."],["Explain how to improve a misleading chart with no title, missing labels and an unsuitable type.","State which missing features you would add and why readers need them."]],"challenge":"Plan two charts from the same data for different audiences. Explain which tells the story most clearly and why.","quiz":[["Which chart is useful for comparing the costs of different items?",["Bar","Line","Network"],0,"Bar charts compare category values."],["Which chart best shows temperature over several days?",["Line","Pie","Venn"],0,"Line charts are useful for trends over time."],["What does a pie chart show?",["Parts of a whole","Only negative numbers","Only time"],0,"Pie charts represent proportions."],["Why are chart titles and labels important?",["They help people interpret the data","They make the file larger","They stop numbers changing"],0,"Titles and labels give context."]]}],"support":[]};</script><script src="catchup.js"></script></body></html>
